 relative Week 4**, within a **$2,000 cash ceiling**. This is a real planning deliverable based entirely on synthetic sample inputs, not an executed launch or real market validation.\n\nSources: launch-input.md (@art-md1646:launch-input) and competitor-research.md (@art-md4685:competitor-research). C1–C5 below are fictional supplied cards. The research report embeds an older launch-input reference; this plan uses the current supplied artifact reference. All RelayDesk price, capability and setup claims remain hypotheses.\n\n## Status and assumptions\nCompleted in this assignment: input review and preparation of this plan and its companion dashboard. No pilot recruitment, contact, spending, browsing, implementation or assignment creation occurred. No outcome measurements are available; targets below are not actuals. All named owners are suggestions, not completed or accepted assignments. Task @task-h1574 remains open for Admin review.\n\nWeek 1 begins only after Admin approves the offer, owners, capacity and execution scope. Existing internal planning time is assumed in-kind; incremental cash costs are budgeted below. Confirm this accounting boundary before launch. Proposed pilot offer: a free, time-limited evaluation through Week 4 with no automatic charge; $59/team/month is a future price hypothesis. Honoraria reward research participation regardless of feedback or purchase.\n\n## Eligibility, funnel and success criteria\nProposed eligibility: a small service team of 2–10 people, at least two participants, a shared request inbox, a named pilot lead with authority to participate, and a concrete ownership or follow-up problem. These are planning assumptions requiring approval.\n\nRecruitment counts only a unique team with explicit acceptance of pilot terms, an identified lead and a scheduled onboarding session. Deduplicate by organization/team; multiple contacts do not count twice. Proposed funnel: **120 distinct invited teams → 24 qualified discovery calls (20%) → 10 acceptances (41.7% of calls; 8.3% overall)**. These are unvalidated assumptions, not a forecast or guarantee. Channel mix: 60 permissioned warm introductions, 40 relevant community opt-ins under community rules, 20 partner referrals. No real prospect list exists yet; if channel access is unavailable, report a shortfall.\n\nSeparate outcome gates:\n- Recruitment: 10 eligible accepted teams by W4.\n- Activation: at least 8 of 10 complete inbox connection, teammate invitation, request assignment and a test SLA alert by W4.\n- Retention: at least 6 of 10 show team activity on two separate days in the seven days after activation; activate this cohort by W3 end to permit full observation.\n- Ownership clarity: at least 8 of 10 leads correctly identify a request owner in an unassisted exercise; record failed and untested cases.\n- Demand signal: at least 5 of 10 request continued use and state willingness to pay $59/month after use. Report stated preference separately from any future paid commitment; this is preliminary evidence, not validated revenue.\n- Setup hypothesis: record every attempt from setup start to the complete activation workflow, elapsed minutes, assistance, environment and failures. Report median, range and completion rate; test a ≤60-minute median among completers without excluding failed attempts from the completion denominator.\n\n## Weekly milestones — all proposed\n| Week | Focus | Proposed owners | Work | Weekly exit target | Cumulative accepted | Cash envelope |\n| --- | --- | --- | --- | --- | --- | --- |\n| 01 | Prepare &amp; qualify | Atlas + Maker | Define eligibility, approve pilot terms and data handling, test the activation workflow, draft two messages, and prepare 120 prospect records from authorized sources. | 30 draft invitations; 6 discovery calls; 2 accepted teams | 2 / 10 | $350 |\n| 02 | Recruit &amp; activate | Maker + Echo | After separate authorization, propose 40 invitations and one follow-up per non-responder after 4–5 business days. Run 8 discovery calls and guided onboarding. | 3 additional accepted; 4 cumulative activated | 5 / 10 | $500 |\n| 03 | Close the gap | Atlas + Maker | Propose 35 invitations and 8 discovery calls. Ask willing pilots for introductions only with consent. Compare message responses and fix recurring setup friction. | 3 additional accepted; 7 cumulative activated | 8 / 10 | $550 |\n| 04 | Confirm &amp; evaluate | Echo + Analyst + Ledger | Propose final 15 invitations and 2 discovery calls early in week. Confirm remaining teams; measure retained use, ownership clarity, price response and costs. | 2 additional accepted; 8 cumulative activated; decision memo | 10 / 10 | $400 |\nThe weekly envelopes sum to $1,800; the $200 reserve is held separately. They allocate the category budget below, not additional spending. W1 invitations and all subsequent external work are proposals contingent on later authorization. W1 proposed six calls yield two acceptances; W2 eight yield three; W3 eight yield three; W4 two yield two. The optimistic W4 close rate is a risk: prioritize acceptance before W4 and disclose any gap.\n\n## Positioning and fictional competitor table — SAMPLE DATA\nLead draft: “A shared inbox designed to get small service teams assigning requests quickly.”\nSupporting draft: “Planned at $59/team/month, with assignment and SLA alerts.”\nDo not claim proven one-hour setup, feature parity, savings or superiority.\nAll six rows describe shared inbox products; prices are USD/team/month.\n| Evidence | Product | Price | Listed workflow features | Listed setup / target |\n| --- | --- | --- | --- | --- |\n| C1 | InboxOak | $49 | Basic assignment; explicitly no SLA alerts | 1 day |\n| C2 | TeamWillow | $99 | Assignment + SLA alerts | 3 days |\n| C3 | QueueFox | $29 | Manual tags only | 2 hours |\n| C4 | ReplyHarbor | $149 | Routing + analytics | 5 days |\n| C5 | ServiceLark | $79 | Assignment + analytics | 2 days |\n| Hypothesis | RelayDesk | $59 planned | Assignment + SLA alerts planned | 1-hour target |\nC3 is the cheapest fictional card. C2 overlaps in named feature categories, not proven capability. Only C1 explicitly lacks SLA alerts; omissions elsewhere mean unknown. Routing/analytics for RelayDesk are unspecified. Setup measurement conditions for competitors are unknown.\n\n## Cash budget — proposed, no money spent\n| Category | Basis | Maximum |\n| --- | --- | --- |\n| Pilot research honoraria | 10 teams × $60; compensate feedback, never positive reviews | $600 |\n| Onboarding assistance | 12 hours × $50; incremental support allowance | $600 |\n| Research / list preparation | 6 hours × $50; authorized sources only | $300 |\n| Demo and onboarding materials | Fixed allowance | $150 |\n| Pilot tools / infrastructure | Fixed allowance; existing stack first | $150 |\n| Contingency | Admin release only; included in hard ceiling | $200 |\n**Base plan $1,800 + reserve $200 = hard cap $2,000.** At ten recruited teams, the ceiling is $200 per recruited team; this is a planning ratio, not observed acquisition cost. If fewer teams join, show actual cost per accepted and per activated team. Ledger would maintain committed, paid and remaining amounts before any proposed purchase.\n\n## Proposed ownership and review cadence\nAtlas: launch accountability, approvals and recruitment gates. Maker: launch materials, onboarding and milestone coordination. Scout: evidence and positioning caveats. Echo: pilot interviews and feedback capture. Analyst: funnel, activation and value analysis. Ledger: cost ledger and budget checks. Admin: review this plan and authorize any later execution. These roles create no host tasks or reporting changes.\nPropose a weekly internal review of funnel and budget, with a W2 recovery decision and a W4 proceed / iterate / stop memo. No schedule or recurring job is created.\n\n## Outreach drafts — not sent\n**Draft A / ownership:** “Hi [name], we're exploring RelayDesk, a shared inbox designed to help small service teams assign requests clearly. Would your team consider a short pilot and feedback session? We’re testing the workflow and setup experience; participation is optional. May I share the proposed pilot details?”\n**Draft B / offer:** “Hi [name], we're testing a shared inbox with planned assignment and SLA alerts, with a future price hypothesis of $59/team/month. Would a time-limited evaluation be relevant to your team? We’d value candid feedback; there is no automatic charge.”\n**One follow-up draft:** “Following up once on the RelayDesk pilot invitation. If this is not relevant, no response is needed and we will stop following up.”\nUse only after execution authorization, confirmed offer and applicable recipient permission. No mass sends, purchased lists or paid advertising.\n\n## Measurement and decision\nProposed ledger fields: anonymous team ID, eligibility evidence, channel, message variant, invitation date, call date, acceptance/terms date, onboarding date, activation steps, elapsed time, assistance/failure reason, activity dates, ownership result, continued-use request, stated price response, costs and evidence link. Store minimum necessary information with agreed access and retention. Track counts and denominators weekly; report missing data explicitly. Small samples support directional learning only.\n\nProceed recommendation requires recruitment and budget gates plus the activation, retention and demand thresholds above. If recruitment succeeds but value gates fail, report “recruitment achieved; demand inconclusive” and propose iteration. If recruitment or budget fails, report the objective unmet. Admin makes the subsequent decision; this document triggers no action.\n\n## Risks and responses\n| Risk | Trigger | Proposed response / owner |\n| --- | --- | --- |\n| Recruitment shortfall | Below 5 accepted by end of W2 | Atlas: review eligibility objections and shift remaining drafts to the better-performing message/channel. Do not relax eligibility or claim targets met. |\n| Setup or feature gaps | Workflow cannot be completed or setup median exceeds 60 min | Maker: log failures and assistance; revise claims and onboarding. Pause invites if safe operation is unverified. |\n| Signup without value | Below 8 activations or 6 retained teams | Analyst + Echo: interview drop-offs; report recruitment separately from demand. Extend learning only with Admin review. |\n| Budget overrun | Committed plus paid costs approach $1,800 | Ledger: stop new commitments; reserve requires Admin release. No paid ads. |\n| Consent / privacy | Unclear permission, retention or access rules | Atlas: resolve pilot terms before outreach or real inbox connection; use test data in preparation. |\n| Synthetic evidence | Any fictional competitor card presented as market proof | Scout: retain SAMPLE DATA labels and distinguish missing capabilities from explicit exclusions. |\n\n## Admin review\nReview eligibility, pilot terms, owner availability, cash/in-kind accounting and success thresholds before execution. This task remains open; no external actions or additional host tasks are authorized by these drafts.\n\u003c/pre>\u003c/details>\u003c/section>\n\u003cfooter>SAMPLE DATA · Synthetic inputs, real planning deliverables · Prepared for Admin review · All launch work remains proposed · No external assets, scripts or network dependencies\u003c/footer>\n\u003c/main>\u003c/body>\u003c/html>"},{"id":"art-html3318","owner":"sapi_07e6a1f92000","filename":"results-dashboard.html","title":"Customer feedback","reference":"@art-html3318:customer-feedback","content":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>SAMPLE DATA — Feedback priorities\u003c/title>\u003cstyle>\n:root{color-scheme:light;--ink:#172c3c;--muted:#536675;--line:#dce5e9;--accent:#087e83}*{box-sizing:border-box}body{margin:0;background:#f2f6f7;color:var(--ink);font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1240px;margin:auto;padding:40px 28px}header{background:#122e40;color:white;padding:38px;border-radius:20px}h1{font-size:clamp(30px,4vw,48px);line-height:1.12;margin:18px 0}h2{font-size:25px;letter-spacing:-.5px}h3{margin:10px 0;font-size:20px}p{margin:10px 0}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800}.sample{display:inline-block;background:#ffe1a0;color:#513705;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:800}header p{color:#d7e7ee;max-width:760px}nav{display:flex;gap:20px;flex-wrap:wrap;margin-top:24px}nav a{color:#a9f2ec;text-underline-offset:5px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.kpi,section{background:white;border:1px solid var(--line);border-radius:14px;padding:24px}.kpi strong{display:block;font-size:38px;line-height:1.2}.kpi span,.meta{color:var(--muted);font-size:14px}section{margin:22px 0}.lead{border-left:5px solid var(--accent)}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;text-align:left}th{background:#edf4f5;font-size:12px;color:#3b5665}th,td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}td:nth-child(2){min-width:115px}tbody tr:hover{background:#f6fafb}.pill{display:inline-block;background:#e7f3f1;color:#195e59;font-weight:800;font-size:10px;letter-spacing:.7px;padding:4px 8px;border-radius:5px}.backlog{display:grid;grid-template-columns:48px 1fr;gap:16px;padding:22px 0;border-top:1px solid var(--line)}.num{font-size:25px;color:var(--accent);font-weight:800}.positive{background:#eaf5ef}footer{font-size:13px;color:var(--muted);padding:10px 4px 30px}summary{cursor:pointer;font-weight:700}a:focus-visible,summary:focus-visible{outline:3px solid #de940d;outline-offset:4px}@media(max-width:700px){main{padding:18px 12px}header{padding:25px}.kpis{grid-template-columns:repeat(2,1fr)}section{padding:18px}.backlog{grid-template-columns:34px 1fr}}@media print{body{background:white}main{padding:0}header{background:white;color:var(--ink);border:1px solid var(--line)}header p{color:var(--muted)}nav{display:none}.scroll{overflow:visible}section,.backlog{break-inside:avoid}table{font-size:10px}th,td{padding:6px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cheader>\u003cspan class=\"sample\">SAMPLE DATA · SYNTHETIC INPUTS\u003c/span>\u003ch1>What should come next?\u003c/h1>\u003cp>Feedback priorities grounded in unique accounts and source severity. A review-ready proposal; all backlog items and owners remain unassigned.\u003c/p>\u003cdiv class=\"eyebrow\">18 SEPTEMBER 2026 · AWAITING ADMIN REVIEW\u003c/div>\u003cnav aria-label=\"Sections\">\u003ca href=\"#ranking\">Ranked themes\u003c/a>\u003ca href=\"#backlog\">Proposed backlog\u003c/a>\u003ca href=\"#evidence\">Evidence ledger\u003c/a>\u003ca href=\"#method\">Method\u003c/a>\u003c/nav>\u003c/header>\u003cdiv class=\"kpis\">\u003carticle class=\"kpi\">\u003cstrong>12\u003c/strong>\u003cspan>Feedback records\u003c/span>\u003c/article>\u003carticle class=\"kpi\">\u003cstrong>11\u003c/strong>\u003cspan>Unique accounts\u003c/span>\u003c/article>\u003carticle class=\"kpi\">\u003cstrong>5\u003c/strong>\u003cspan>Issue / request themes\u003c/span>\u003c/article>\u003carticle class=\"kpi\">\u003cstrong>1\u003c/strong>\u003cspan>Positive signal\u003c/span>\u003c/article>\u003c/div>\u003csection class=\"lead\">\u003cspan class=\"eyebrow\">RECOMMENDED FIRST\u003c/span>\u003ch2>CSV export, then notification reliability\u003c/h2>\u003cp>CSV export scores \u003cb>8\u003c/b> across three accounts. Duplicate notifications scores \u003cb>6\u003c/b> across two accounts. Together they cover \u003cb>5 of 10 issue/request accounts\u003c/b> in this synthetic sample.\u003c/p>\u003cp class=\"meta\">11 issue/request records from 10 accounts; 1 positive record from 1 account. No implementation or assignments completed.\u003c/p>\u003c/section>\u003csection id=\"ranking\">\u003ch2>Theme ranking\u003c/h2>\u003cp class=\"meta\">Score = sum of per-account maximum severity. Share uses all 11 sample accounts.\u003c/p>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Rank\u003c/th>\u003cth scope=\"col\">Theme\u003c/th>\u003cth scope=\"col\">Records\u003c/th>\u003cth scope=\"col\">Unique accounts\u003c/th>\u003cth scope=\"col\">Share of 11 accounts\u003c/th>\u003cth scope=\"col\">Mean account severity\u003c/th>\u003cth scope=\"col\">Major accounts\u003c/th>\u003cth scope=\"col\">Score\u003c/th>\u003cth scope=\"col\">Evidence IDs\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>CSV export availability\u003c/td>\u003ctd>4\u003c/td>\u003ctd>3\u003c/td>\u003ctd>27.3%\u003c/td>\u003ctd>2.67\u003c/td>\u003ctd>2\u003c/td>\u003ctd>8\u003c/td>\u003ctd>F01, F02, F03, F11\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Duplicate notifications\u003c/td>\u003ctd>2\u003c/td>\u003ctd>2\u003c/td>\u003ctd>18.2%\u003c/td>\u003ctd>3.00\u003c/td>\u003ctd>2\u003c/td>\u003ctd>6\u003c/td>\u003ctd>F09, F10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Dashboard loading performance\u003c/td>\u003ctd>2\u003c/td>\u003ctd>2\u003c/td>\u003ctd>18.2%\u003c/td>\u003ctd>2.50\u003c/td>\u003ctd>1\u003c/td>\u003ctd>5\u003c/td>\u003ctd>F04, F05\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>First-task assignment onboarding\u003c/td>\u003ctd>2\u003c/td>\u003ctd>2\u003c/td>\u003ctd>18.2%\u003c/td>\u003ctd>2.00\u003c/td>\u003ctd>0\u003c/td>\u003ctd>4\u003c/td>\u003ctd>F06, F07\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Dark theme request\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>9.1%\u003c/td>\u003ctd>1.00\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>F08\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection id=\"backlog\">\u003ch2>Proposed priority backlog\u003c/h2>\u003cp class=\"meta\">Functional owners are suggestions. Effort and delivery dates are unknown.\u003c/p>\u003carticle class=\"backlog\">\u003cdiv class=\"num\">01\u003c/div>\u003cdiv>\u003cspan class=\"pill\">PROPOSED · UNASSIGNED\u003c/span>\u003ch3>CSV export availability\u003c/h3>\u003cp>Define and implement CSV export for weekly reports and finance review.\u003c/p>\u003cp class=\"meta\">\u003cb>Proposed owner:\u003c/b> Product + Reporting engineering\u003c/p>\u003cp>\u003cb>Verify:\u003c/b> Verify exported fields and rows against the report; test a finance-review workflow.\u003c/p>\u003cp class=\"meta\">Evidence: F01, F02, F03, F11 · Effort not estimated\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"backlog\">\u003cdiv class=\"num\">02\u003c/div>\u003cdiv>\u003cspan class=\"pill\">PROPOSED · UNASSIGNED\u003c/span>\u003ch3>Duplicate notifications\u003c/h3>\u003cp>Reproduce duplicate task alerts and correct the triggering or delivery behavior.\u003c/p>\u003cp class=\"meta\">\u003cb>Proposed owner:\u003c/b> Notifications engineering + QA\u003c/p>\u003cp>\u003cb>Verify:\u003c/b> A controlled task event produces one intended alert; regression checks cover retries.\u003c/p>\u003cp class=\"meta\">Evidence: F09, F10 · Effort not estimated\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"backlog\">\u003cdiv class=\"num\">03\u003c/div>\u003cdiv>\u003cspan class=\"pill\">PROPOSED · UNASSIGNED\u003c/span>\u003ch3>Dashboard loading performance\u003c/h3>\u003cp>Reproduce the reported 500-item load and profile the slow path.\u003c/p>\u003cp class=\"meta\">\u003cb>Proposed owner:\u003c/b> Frontend + Backend engineering\u003c/p>\u003cp>\u003cb>Verify:\u003c/b> Measure the same workload before and after changes; agree a load-time target before implementation.\u003c/p>\u003cp class=\"meta\">Evidence: F04, F05 · Effort not estimated\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"backlog\">\u003cdiv class=\"num\">04\u003c/div>\u003cdiv>\u003cspan class=\"pill\">PROPOSED · UNASSIGNED\u003c/span>\u003ch3>First-task assignment onboarding\u003c/h3>\u003cp>Add a first-task assignment example and validate the flow.\u003c/p>\u003cp class=\"meta\">\u003cb>Proposed owner:\u003c/b> Product design + Onboarding engineering\u003c/p>\u003cp>\u003cb>Verify:\u003c/b> Observe a new-user test completing an assignment; agree success criteria before rollout.\u003c/p>\u003cp class=\"meta\">Evidence: F06, F07 · Effort not estimated\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"backlog\">\u003cdiv class=\"num\">05\u003c/div>\u003cdiv>\u003cspan class=\"pill\">PROPOSED · UNASSIGNED\u003c/span>\u003ch3>Dark theme request\u003c/h3>\u003cp>Validate demand and accessibility needs before committing to a dark theme.\u003c/p>\u003cp class=\"meta\">\u003cb>Proposed owner:\u003c/b> Product design\u003c/p>\u003cp>\u003cb>Verify:\u003c/b> Document validated requirements and an explicit build/defer decision.\u003c/p>\u003cp class=\"meta\">Evidence: F08 · Effort not estimated\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"positive\">\u003cspan class=\"eyebrow\">PRESERVE THE POSITIVE\u003c/span>\u003ch2>Clear task ownership\u003c/h2>\u003cp>“Task ownership is clear and saves us time.”\u003c/p>\u003cp class=\"meta\">F12 · A11 · severity 0 · one record / one account. Keep this strength in view when changing onboarding.\u003c/p>\u003c/section>\u003csection id=\"evidence\">\u003ch2>Evidence ledger\u003c/h2>\u003cp class=\"meta\">Verbatim synthetic feedback. F01 and F11 come from the same account.\u003c/p>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">ID\u003c/th>\u003cth scope=\"col\">Account\u003c/th>\u003cth scope=\"col\">Severity\u003c/th>\u003cth scope=\"col\">Sample feedback\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr id=\"F01\">\u003ctd>\u003cb>F01\u003c/b>\u003c/td>\u003ctd>A01\u003c/td>\u003ctd>3\u003c/td>\u003ctd>We cannot export the weekly report as CSV.\u003c/td>\u003c/tr>\u003ctr id=\"F02\">\u003ctd>\u003cb>F02\u003c/b>\u003c/td>\u003ctd>A02\u003c/td>\u003ctd>3\u003c/td>\u003ctd>CSV export is missing; copying results takes an hour.\u003c/td>\u003c/tr>\u003ctr id=\"F03\">\u003ctd>\u003cb>F03\u003c/b>\u003c/td>\u003ctd>A03\u003c/td>\u003ctd>2\u003c/td>\u003ctd>Need CSV export for our finance review.\u003c/td>\u003c/tr>\u003ctr id=\"F04\">\u003ctd>\u003cb>F04\u003c/b>\u003c/td>\u003ctd>A04\u003c/td>\u003ctd>3\u003c/td>\u003ctd>The dashboard takes 15 seconds to load with 500 items.\u003c/td>\u003c/tr>\u003ctr id=\"F05\">\u003ctd>\u003cb>F05\u003c/b>\u003c/td>\u003ctd>A05\u003c/td>\u003ctd>2\u003c/td>\u003ctd>Dashboard loading is slow on large projects.\u003c/td>\u003c/tr>\u003ctr id=\"F06\">\u003ctd>\u003cb>F06\u003c/b>\u003c/td>\u003ctd>A06\u003c/td>\u003ctd>2\u003c/td>\u003ctd>New teammates do not know how to assign their first task.\u003c/td>\u003c/tr>\u003ctr id=\"F07\">\u003ctd>\u003cb>F07\u003c/b>\u003c/td>\u003ctd>A07\u003c/td>\u003ctd>2\u003c/td>\u003ctd>The first-run onboarding has no assignment example.\u003c/td>\u003c/tr>\u003ctr id=\"F08\">\u003ctd>\u003cb>F08\u003c/b>\u003c/td>\u003ctd>A08\u003c/td>\u003ctd>1\u003c/td>\u003ctd>I need a dark theme.\u003c/td>\u003c/tr>\u003ctr id=\"F09\">\u003ctd>\u003cb>F09\u003c/b>\u003c/td>\u003ctd>A09\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Alerts about the same task are sent twice.\u003c/td>\u003c/tr>\u003ctr id=\"F10\">\u003ctd>\u003cb>F10\u003c/b>\u003c/td>\u003ctd>A10\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Duplicate notifications make me miss important updates.\u003c/td>\u003c/tr>\u003ctr id=\"F11\">\u003ctd>\u003cb>F11\u003c/b>\u003c/td>\u003ctd>A01\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Following up on CSV export, still waiting.\u003c/td>\u003c/tr>\u003ctr id=\"F12\">\u003ctd>\u003cb>F12\u003c/b>\u003c/td>\u003ctd>A11\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Task ownership is clear and saves us time.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection id=\"method\">\u003ch2>Method & limitations\u003c/h2>\u003cp>Rank issue/request themes by severity-weighted account score: sum the maximum source severity for each unique account within the theme (equivalently, unique accounts × mean account severity). This balances frequency and severity without letting repeat posts inflate rank. Ties use unique accounts, then maximum severity, then theme name. Severity: 0 positive, 1 minor, 2 moderate, 3 major. Positive feedback is excluded from the backlog. These are sample-only priorities, not population estimates or delivery commitments.\u003c/p>\u003cp>F01 and F11 are both A01: four CSV records represent three accounts and score 8, not 11. Frequency percentages use all 11 unique sample accounts; 10 accounts supplied issues/requests. No effort estimates, deadlines, or named accountable owners were supplied. All owners below are proposed functional roles; no assignments have been created and no product work is claimed complete.\u003c/p>\u003cdetails>\u003csummary>Source reconciliation\u003c/summary>\u003cp>Sources: feedback-input.json (@art-json8097:feedback-input) and feedback-evidence.json (@art-json6046:feedback-evidence). All 12 evidence records were reconciled with the input for ID, account, text and severity; theme counts and account sets were recomputed. The evidence file contains a different upstream source reference (@art-json7990:feedback-input); this analysis uses the supplied local input, whose records match.\u003c/p>\u003c/details>\u003cp class=\"meta\">Small synthetic sample; no real customer demand, revenue impact, prevalence, or implementation cost can be inferred. Severity is source-provided and not independently validated.\u003c/p>\u003c/section>\u003cfooter>\u003cb>SAMPLE DATA\u003c/b> · Not real customers · Admin review pending · Proposed work only\u003c/footer>\u003c/main>\u003c/body>\u003c/html>"},{"id":"art-html0445","owner":"sapi_07e6a1f92000","filename":"business-dashboard.html","title":"Weekly business review","reference":"@art-html0445:weekly-business-review","content":"\u003c!doctype html>\n\u00 ;fill:#4d6270}.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}.key:before{content:\"\";display:inline-block;width:22px;border-top:3px solid var(--teal);vertical-align:middle;margin-right:6px}.key.target:before{border-color:var(--amber);border-top-style:dashed}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.insight{border-left:3px solid var(--teal);padding-left:15px}.insight p{margin:8px 0;font-size:14px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}caption{text-align:left;font-weight:700;margin-bottom:12px}th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}thead th{background:#f1f6f8;font-size:12px;color:var(--muted)}th:first-child{text-align:left}tbody tr:last-child{background:#edf7f4}tbody th{font-weight:750}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.action{padding:18px;background:#f4f7f9;border-radius:12px}.owner{font-size:12px;letter-spacing:.08em;color:var(--teal);font-weight:800;text-transform:uppercase}.action p{font-size:14px;margin:9px 0}.status{font-size:12px;font-weight:750;color:#775213}.method{font-size:14px}.method li{margin:8px 0}code{font-size:.93em;overflow-wrap:anywhere}footer{font-size:12px;color:var(--muted);padding-top:22px}.skip{position:absolute;left:-9999px}.skip:focus{position:static;display:block;padding:10px;background:white;color:var(--ink)}@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.charts{grid-template-columns:1fr}.chart svg{max-height:250px}}@media(max-width:680px){main{padding:16px}.kpis,.grid2,.actions{grid-template-columns:1fr}header{padding:24px}.panel{padding:18px}.card{padding:18px}}@media print{body{background:white}main{max-width:none;padding:0}header{background:white;color:var(--ink);border:1px solid var(--line)}header p,.meta,.eyebrow{color:var(--ink)}.card,.panel{break-inside:avoid}.charts{grid-template-columns:1fr}.chart svg{max-height:190px}.skip{display:none}}\n\u003c/style>\u003c/head>\u003cbody>\u003ca href=\"#evidence\" class=\"skip\">Skip to evidence tables\u003c/a>\u003cmain>\n\u003cheader>\u003cspan class=\"badge\">SAMPLE DATA\u003c/span>\u003cdiv class=\"eyebrow\" style=\"margin-top:20px\">Ledger / weekly business review\u003c/div>\u003ch1>Revenue softened. Service slipped.\u003c/h1>\u003cp>W4 revenue fell as conversion and SLA attainment weakened. These are observations from synthetic sample data; underlying causes remain unverified hypotheses.\u003c/p>\u003cdiv class=\"meta\">\u003cspan>Period: W1–W4 · calendar dates not supplied\u003c/span>\u003cspan>Currency: USD · weekly revenue\u003c/span>\u003cspan>Prepared for Admin review\u003c/span>\u003c/div>\u003c/header>\n\u003csection aria-label=\"W4 sample key performance indicators\" class=\"kpis\">\n\u003cdiv class=\"card\">\u003cdiv class=\"label\">W4 REVENUE\u003c/div>\u003cdiv class=\"value\">$12,600\u003c/div>\u003cp class=\"detail signal\">−$1,800 / −12.50% vs W3\u003c/p>\u003cp class=\"detail\">W3 baseline: $14,400\u003c/p>\u003c/div>\n\u003cdiv class=\"card alert\">\u003cdiv class=\"label\">W4 TARGET SHORTFALL\u003c/div>\u003cdiv class=\"value\">$2,400\u003c/div>\u003cp class=\"detail signal\">16.00% below target\u003c/p>\u003cp class=\"detail\">$15,000 target · 84.00% attained\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"label\">W4 CONVERSION\u003c/div>\u003cdiv class=\"value\">11.25%\u003c/div>\u003cp class=\"detail signal\">−4.75 pp vs W3\u003c/p>\u003cp class=\"detail\">18 wins / 160 leads\u003c/p>\u003c/div>\n\u003cdiv class=\"card alert\">\u003cdiv class=\"label\">W4 SLA ATTAINMENT\u003c/div>\u003cdiv class=\"value\">69.44%\u003c/div>\u003cp class=\"detail signal\">20.56 pp below 90% target\u003c/p>\u003cp class=\"detail\">50 / 72 tickets · −10.56 pp vs W3\u003c/p>\u003c/div>\n\u003c/section>\n\u003csection class=\"panel\" aria-labelledby=\"trends\">\u003ch2 id=\"trends\">Four-week trends \u003cspan class=\"subtle\">/ SAMPLE DATA\u003c/span>\u003c/h2>\u003cp class=\"subtle\">All chart axes begin at zero. Exact inputs and rates appear in the evidence tables. pp = percentage points.\u003c/p>\u003cdiv class=\"charts\">\n\u003cfigure class=\"chart\">\u003ch3>Revenue vs target · USD\u003c/h3>\u003csvg viewBox=\"0 0 480 222\" role=\"img\" aria-labelledby=\"rev-title rev-desc\">\u003ctitle id=\"rev-title\">SAMPLE DATA — Weekly revenue and target in USD\u003c/title>\u003cdesc id=\"rev-desc\">Revenue: W1 12000.00, W2 13500.00, W3 14400.00, W4 12600.00; Target: W1 12500.00, W2 13500.00, W3 14500.00, W4 15000.00. Exact values and denominators are in the tables below.\u003c/desc>\u003cline x1=\"60\" x2=\"440\" y1=\"180.0\" y2=\"180.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"184.0\" text-anchor=\"end\">0k\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"145.0\" y2=\"145.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"149.0\" text-anchor=\"end\">4k\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"110.0\" y2=\"110.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"114.0\" text-anchor=\"end\">8k\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"75.0\" y2=\"75.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"79.0\" text-anchor=\"end\">12k\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"40.0\" y2=\"40.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"44.0\" text-anchor=\"end\">16k\u003c/text>\u003cpolyline points=\"60,75.0 180,61.875 300,54.0 420,69.75\" fill=\"none\" stroke=\"#116b63\" stroke-width=\"3\"/>\u003ccircle cx=\"60\" cy=\"75.0\" r=\"4\" fill=\"#116b63\"/>\u003ccircle cx=\"180\" cy=\"61.875\" r=\"4\" fill=\"#116b63\"/>\u003ccircle cx=\"300\" cy=\"54.0\" r=\"4\" fill=\"#116b63\"/>\u003ccircle cx=\"420\" cy=\"69.75\" r=\"4\" fill=\"#116b63\"/>\u003cpolyline points=\"60,70.625 180,61.875 300,53.125 420,48.75\" fill=\"none\" stroke=\"#875914\" stroke-width=\"3\" stroke-dasharray=\"6 5\"/>\u003ccircle cx=\"60\" cy=\"70.625\" r=\"4\" fill=\"#875914\"/>\u003ccircle cx=\"180\" cy=\"61.875\" r=\"4\" fill=\"#875914\"/>\u003ccircle cx=\"300\" cy=\"53.125\" r=\"4\" fill=\"#875914\"/>\u003ccircle cx=\"420\" cy=\"48.75\" r=\"4\" fill=\"#875914\"/>\u003ctext x=\"60\" y=\"207\" text-anchor=\"middle\">W1\u003c/text>\u003ctext x=\"180\" y=\"207\" text-anchor=\"middle\">W2\u003c/text>\u003ctext x=\"300\" y=\"207\" text-anchor=\"middle\">W3\u003c/text>\u003ctext x=\"420\" y=\"207\" text-anchor=\"middle\">W4\u003c/text>\u003c/svg>\u003cfigcaption class=\"legend\">\u003cspan class=\"key\">Revenue · solid\u003c/span>\u003cspan class=\"key target\">Target · dashed\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"chart\">\u003ch3>Conversion · %\u003c/h3>\u003csvg viewBox=\"0 0 480 222\" role=\"img\" aria-labelledby=\"conv-title conv-desc\">\u003ctitle id=\"conv-title\">SAMPLE DATA — Weekly conversion\u003c/title>\u003cdesc id=\"conv-desc\">Conversion: W1 20.00%, W2 20.00%, W3 16.00%, W4 11.25%. Exact values and denominators are in the tables below.\u003c/desc>\u003cline x1=\"60\" x2=\"440\" y1=\"180.0\" y2=\"180.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"184.0\" text-anchor=\"end\">0%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"152.0\" y2=\"152.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"156.0\" text-anchor=\"end\">5%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"124.0\" y2=\"124.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"128.0\" text-anchor=\"end\">10%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"96.0\" y2=\"96.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"100.0\" text-anchor=\"end\">15%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"68.0\" y2=\"68.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"72.0\" text-anchor=\"end\">20%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"40.0\" y2=\"40.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"44.0\" text-anchor=\"end\">25%\u003c/text>\u003cpolyline points=\"60,68.0 180,68.0 300,90.39999999999999 420,117.0\" fill=\"none\" stroke=\"#116b63\" stroke-width=\"3\"/>\u003ccircle cx=\"60\" cy=\"68.0\" r=\"4\" fill=\"#116b63\"/>\u003ccircle cx=\"180\" cy=\"68.0\" r=\"4\" fill=\"#116b63\"/>\u003ccircle cx=\"300\" cy=\"90.39999999999999\" r=\"4\" fill=\"#116b63\"/>\u003ccircle cx=\"420\" cy=\"117.0\" r=\"4\" fill=\"#116b63\"/>\u003ctext x=\"60\" y=\"207\" text-anchor=\"middle\">W1\u003c/text>\u003ctext x=\"180\" y=\"207\" text-anchor=\"middle\">W2\u003c/text>\u003ctext x=\"300\" y=\"207\" text-anchor=\"middle\">W3\u003c/text>\u003ctext x=\"420\" y=\"207\" text-anchor=\"middle\">W4\u003c/text>\u003c/svg>\u003cfigcaption class=\"subtle\">20.00% → 20.00% → 16.00% → 11.25%\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"chart\">\u003ch3>SLA attainment · %\u003c/h3>\u003csvg viewBox=\"0 0 480 222\" role=\"img\" aria-labelledby=\"sla-title sla-desc\">\u003ctitle id=\"sla-title\">SAMPLE DATA — Weekly SLA attainment\u003c/title>\u003cdesc id=\"sla-desc\">SLA attainment: W1 90.00%, W2 88.00%, W3 80.00%, W4 69.44%. Exact values and denominators are in the tables below.\u003c/desc>\u003cline x1=\"60\" x2=\"440\" y1=\"180.0\" y2=\"180.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"184.0\" text-anchor=\"end\">0%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"145.0\" y2=\"145.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"149.0\" text-anchor=\"end\">25%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"110.0\" y2=\"110.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"114.0\" text-anchor=\"end\">50%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"75.0\" y2=\"75.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"79.0\" text-anchor=\"end\">75%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"40.0\" y2=\"40.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"44.0\" text-anchor=\"end\">100%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"54.0\" y2=\"54.0\" stroke=\"#875914\" stroke-dasharray=\"5 5\"/>\u003ctext x=\"438\" y=\"46.0\" text-anchor=\"end\">90% target\u003c/text>\u003cpolyline points=\"60,54.0 180,56.8 300,68.0 420,82.77777777777779\" fill=\"none\" stroke=\"#245ea7\" stroke-width=\"3\"/>\u003ccircle cx=\"60\" cy=\"54.0\" r=\"4\" fill=\"#245ea7\"/>\u003ccircle cx=\"180\" cy=\"56.8\" r=\"4\" fill=\"#245ea7\"/>\u003ccircle cx=\"300\" cy=\"68.0\" r=\"4\" fill=\"#245ea7\"/>\u003ccircle cx=\"420\" cy=\"82.77777777777779\" r=\"4\" fill=\"#245ea7\"/>\u003ctext x=\"60\" y=\"207\" text-anchor=\"middle\">W1\u003c/text>\u003ctext x=\"180\" y=\"207\" text-anchor=\"middle\">W2\u003c/text>\u003ctext x=\"300\" y=\"207\" text-anchor=\"middle\">W3\u003c/text>\u003ctext x=\"420\" y=\"207\" text-anchor=\"middle\">W4\u003c/text>\u003c/svg>\u003cfigcaption class=\"subtle\">90.00% → 88.00% → 80.00% → 69.44%\u003c/figcaption>\u003c/figure>\n\u003c/div>\u003c/section>\n\u003csection class=\"panel\" aria-labelledby=\"observations\">\u003ch2 id=\"observations\">What the evidence supports\u003c/h2>\u003cdiv class=\"grid2\">\u003cdiv class=\"insight\">\u003ch3>More leads, fewer wins\u003c/h3>\u003cp>W4 leads grew from 150 to 160 (+6.67%), while wins fell from 24 to 18 (−25.00%). Revenue fell 12.50% after rising from W1 through W3.\u003c/p>\u003cp>\u003cstrong>Hypotheses to test:\u003c/strong> a change in lead mix or sales-stage timing. These aggregates establish no causal link to revenue.\u003c/p>\u003c/div>\u003cdiv class=\"insight\">\u003ch3>Ticket growth outpaced SLA-met growth\u003c/h3>\u003cp>W4 tickets rose 20.00% (60 → 72); SLA-met tickets rose 48 → 50. Tickets outside SLA increased 12 → 22.\u003c/p>\u003cp>\u003cstrong>Hypotheses to test:\u003c/strong> ticket complexity or capacity constraints. Neither is demonstrated by the supplied data.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"evidence\" aria-labelledby=\"evidence-title\">\u003ch2 id=\"evidence-title\">Evidence &amp; calculations\u003c/h2>\u003cp class=\"subtle\">Source: \u003ccode>@art-json5833:business-input\u003c/code> / \u003ccode>business-input.json\u003c/code>, read in full through host-control. Original label: “SAMPLE DATA — synthetic business metrics, USD”. No external sources.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Weekly source inputs, scroll horizontally on small screens\">\u003ctable>\u003ccaption>SAMPLE DATA — supplied weekly inputs\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">Week\u003c/th>\u003cth scope=\"col\">Revenue (USD)\u003c/th>\u003cth scope=\"col\">Target (USD)\u003c/th>\u003cth scope=\"col\">Leads\u003c/th>\u003cth scope=\"col\">Wins\u003c/th>\u003cth scope=\"col\">Tickets\u003c/th>\u003cth scope=\"col\">SLA met\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">W1\u003c/th>\u003ctd>$12,000\u003c/td>\u003ctd>$12,500\u003c/td>\u003ctd>100\u003c/td>\u003ctd>20\u003c/td>\u003ctd>40\u003c/td>\u003ctd>36\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">W2\u003c/th>\u003ctd>$13,500\u003c/td>\u003ctd>$13,500\u003c/td>\u003ctd>120\u003c/td>\u003ctd>24\u003c/td>\u003ctd>50\u003c/td>\u003ctd>44\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">W3\u003c/th>\u003ctd>$14,400\u003c/td>\u003ctd>$14,500\u003c/td>\u003ctd>150\u003c/td>\u003ctd>24\u003c/td>\u003ctd>60\u003c/td>\u003ctd>48\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">W4\u003c/th>\u003ctd>$12,600\u003c/td>\u003ctd>$15,000\u003c/td>\u003ctd>160\u003c/td>\u003ctd>18\u003c/td>\u003ctd>72\u003c/td>\u003ctd>50\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\" style=\"margin-top:24px\" tabindex=\"0\" role=\"region\" aria-label=\"Calculated weekly rates, scroll horizontally on small screens\">\u003ctable>\u003ccaption>SAMPLE DATA — derived rates and signed gaps\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">Week\u003c/th>\u003cth scope=\"col\">Revenue gap\u003c/th>\u003cth scope=\"col\">Gap / target\u003c/th>\u003cth scope=\"col\">Conversion\u003c/th>\u003cth scope=\"col\">SLA attainment\u003c/th>\u003cth scope=\"col\">SLA gap vs 90%\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">W1\u003c/th>\u003ctd>−$500\u003c/td>\u003ctd>-4.00%\u003c/td>\u003ctd>20.00%\u003c/td>\u003ctd>90.00%\u003c/td>\u003ctd>0.00 pp\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">W2\u003c/th>\u003ctd>$0\u003c/td>\u003ctd>0.00%\u003c/td>\u003ctd>20.00%\u003c/td>\u003ctd>88.00%\u003c/td>\u003ctd>-2.00 pp\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">W3\u003c/th>\u003ctd>−$100\u003c/td>\u003ctd>-0.69%\u003c/td>\u003ctd>16.00%\u003c/td>\u003ctd>80.00%\u003c/td>\u003ctd>-10.00 pp\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">W4\u003c/th>\u003ctd>−$2,400\u003c/td>\u003ctd>-16.00%\u003c/td>\u003ctd>11.25%\u003c/td>\u003ctd>69.44%\u003c/td>\u003ctd>-20.56 pp\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003csection class=\"panel\" aria-labelledby=\"actions\">\u003ch2 id=\"actions\">Proposed actions\u003c/h2>\u003cp class=\"subtle\">Not executed. Owners below are proposals; no new tasks, outreach or operational changes were made.\u003c/p>\u003cdiv class=\"actions\">\n\u003carticle class=\"action\">\u003cdiv class=\"owner\">Ledger\u003c/div>\u003ch3>Validate and refresh\u003c/h3>\u003cp>When Admin supplies actual metrics, validate dates, currency, targets, revenue basis, lead/win counts and SLA eligibility. Preserve provenance and reconcile the totals.\u003c/p>\u003cp>\u003cstrong>Review gate:\u003c/strong> validated actual input before replacing sample figures; retain SAMPLE DATA labeling until then.\u003c/p>\u003cdiv class=\"status\">PROPOSED · awaiting actual data\u003c/div>\u003c/article>\n\u003carticle class=\"action\">\u003cdiv class=\"owner\">Scout\u003c/div>\u003ch3>Test the hypotheses\u003c/h3>\u003cp>Review authorized lead segments and sales stages, plus ticket priority, age and capacity records. Seek evidence for and against lead-mix, timing, complexity and capacity explanations.\u003c/p>\u003cp>\u003cstrong>Review gate:\u003c/strong> documented evidence, with uncertainty and contrary findings.\u003c/p>\u003cdiv class=\"status\">PROPOSED · not started\u003c/div>\u003c/article>\n\u003carticle class=\"action\">\u003cdiv class=\"owner\">Atlas\u003c/div>\u003ch3>Review priorities with Admin\u003c/h3>\u003cp>Use validated findings to propose priorities, accountable next steps and success thresholds. Confirm conversion goals; the supplied SLA benchmark is 90%.\u003c/p>\u003cp>\u003cstrong>Review gate:\u003c/strong> verified impact and operational constraints before decisions.\u003c/p>\u003cdiv class=\"status\">PROPOSED · pending evidence\u003c/div>\u003c/article>\n\u003c/div>\u003c/section>\n\u003csection class=\"panel method\" aria-labelledby=\"method\">\u003ch2 id=\"method\">Method, validation &amp; limitations\u003c/h2>\u003cdiv class=\"grid2\">\u003cdiv>\u003ch3>Reproducible definitions\u003c/h3>\u003cul>\u003cli>Revenue change: (12,600 − 14,400) / 14,400 = \u003cstrong>−12.50%\u003c/strong>.\u003c/li>\u003cli>Signed target gap = revenue − target. W4: −$2,400; gap / target = \u003cstrong>−16.00%\u003c/strong>. Target attainment = 12,600 / 15,000 = 84.00%.\u003c/li>\u003cli>Conversion = weekly wins / weekly leads, using the supplied simplified definition; \u003cstrong>not cohort conversion\u003c/strong>.\u003c/li>\u003cli>SLA attainment = SLA-met tickets / tickets; SLA gap = attainment − 90%, in pp.\u003c/li>\u003cli>Compute with unrounded values; display rates and pp changes to two decimal places.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch3>Boundaries of this review\u003c/h3>\u003cul>\u003cli>Validated unique sequential W1–W4 labels, nonnegative integers, positive targets and denominators, wins ≤ leads and SLA-met ≤ tickets.\u003c/li>\u003cli>Only four synthetic weeks; no calendar dates, segments, deal sizes, cohort linkage, severity, staffing or revenue-recognition policy.\u003c/li>\u003cli>Revenue is weekly, \u003cstrong>not MRR\u003c/strong>. No conversion target or causal evidence was supplied. No forecast is implied.\u003c/li>\u003cli>All actions remain proposals. The review task remains open for Admin review.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/section>\n\u003cfooter>\u003cstrong>SAMPLE DATA\u003c/strong> · Synthetic inputs for a real review task · Ledger · Self-contained dashboard with no external assets · Companion document: weekly-review.md\u003c/footer>\n\u003c/main>\u003c/body>\u003c/html>"},{"id":"art-json0706","owner":"sapi_07e6a1f92000","filename":"case-results.json","title":"case-results","reference":"@art-json0706:case-results","content":"{\n  \"label\": \"SAMPLE DATA \\u2014 three real agent workflows over synthetic inputs\",\n  \"cases\": [\n    {\n      \"case\": \"Product launch\",\n      \"owner\": \"Maker\",\n      \"verified_summary\": \"Verified fictional C1-C5 cards. Target: 10 accepted pilot teams in 4 relative weeks. Base budget $1,800 plus $200 contingency, cap $2,000. All launch execution is proposed; no outreach or expenditure occurred.\",\n      \"dashboard\": \"@art-html7243:product-launch\",\n      \"report\": \"@art-md0754:sample-data-relaydesk-launch-plan\"\n    },\n    {\n      \"case\": \"Customer feedback\",\n      \"owner\": \"Analyst\",\n      \"verified_summary\": \"Input verified: 12 feedback records, 11 unique accounts; 11 issue/request records across 10 accounts, one positive record. CSV export: 4 records from 3 accounts, duplicate notifications 2/2, performance 2/2, onboarding 2/2, dark theme 1/1. F01/F11 are same account. Priorities are recommendations, not shipped features.\",\n      \"dashboard\": \"@art-html3318:customer-feedback\",\n      \"report\": \"@art-md0342:sample-data-feedback-report\"\n    },\n    {\n      \"case\": \"Weekly business review\",\n      \"owner\": \"Ledger\",\n      \"verified_summary\": \"Verified W4 revenue $12,600, down 12.50% ($1,800) vs W3. Target $15,000, shortfall $2,400 (16%), attainment 84%. Conversion 11.25%, SLA attainment 69.44% vs 90% target. Four synthetic weeks; causes are unverified hypotheses.\",\n      \"dashboard\": \"@art-html0445:weekly-business-review\",\n      \"report\": \"@art-md5678:sample-data-weekly-business-review\"\n    }\n  ],\n  \"completed\": [\n    {\n      \"owner\": \"Scout\",\n      \"task\": \"@task-b8133:launch-research\",\n      \"status\": \"reviewed and completed\"\n    },\n    {\n      \"owner\": \"Maker\",\n      \"task\": \"@task-h1574:launch-plan\",\n      \"status\": \"reviewed and completed\"\n    },\n    {\n      \"owner\": \"Echo\",\n      \"task\": \"@task-y7163:feedback-extraction\",\n      \"status\": \"reviewed and completed\"\n    },\n    {\n      \"owner\": \"Analyst\",\n      \"task\": \"@task-j3408:feedback-priorities\",\n      \"status\": \"reviewed and completed\"\n    },\n    {\n      \"owner\": \"Ledger\",\n      \"task\": \"@task-b0952:weekly-business-review\",\n      \"status\": \"reviewed and completed\"\n    }\n  ],\n  \"planned\": [\n    {\n      \"owner\": \"Scout\",\n      \"task\": \"@task-k5026:launch-pilot-validation\",\n      \"status\": \"planned; not started\"\n    },\n    {\n      \"owner\": \"Maker\",\n      \"task\": \"@task-p1444:csv-export-spec\",\n      \"status\": \"planned; not started\"\n    },\n    {\n      \"owner\": \"Ledger\",\n      \"task\": \"@task-z8898:weekly-data-refresh\",\n      \"status\": \"planned; not started\"\n    }\n  ],\n  \"review_note\": \"All five preceding deliverable assignments were reviewed by the coordinating assistant. Your current Atlas review is the sixth assignment and still in progress. Do not label it complete in a snapshot before completion. Reporting structure: five specialists report to Atlas. Automatic checks are paused; these were explicit one-off runs. All dashboards are saved snapshots, not network-fed live dashboards.\"\n}"},{"id":"art-md0200","owner":"sapi_07e6a1f92000","filename":"team-review.md","title":"Team review","reference":"@art-md0200:team-review","content":"# SAMPLE DATA — Team review\nSynthetic inputs · Atlas coordinating review · Prepared 18 September 2026\n\n## Scope and evidence\nReviewed the complete supplied snapshot @art-json0706:case-results. This review checks its summaries and task outcomes; underlying research cards, feedback records and source reports were not independently re-read. All figures below describe synthetic cases, not real operating results. Saved dashboards are snapshots, not live data feeds.\n\nThe snapshot records five preceding assignments as **reviewed and completed**. That status describes their deliverables; it does not establish that launch, shipping or business improvement objectives succeeded. The Atlas review @task-z6571:review-all-cases was subsequently verified and marked complete by the coordinating assistant. The five prior completed assignments plus this review make six completed assignments; the three follow-ups remain planned.\n\n## 1. Product launch\n**Accountable owner: Maker. Research: Scout.**\n\nEvidence: the snapshot reports verification of fictional C1–C5 cards. The proposed target is 10 accepted pilot teams in four relative weeks. Base budget is $1,800 plus $200 contingency, totaling the $2,000 cap. No outreach or expenditure occurred; all execution remains proposed.\n\nReview decision: preserve this as a proposed pilot plan. The budget reconciles, but the snapshot contains no accepted-pilot result or evidence that the target was achieved.\n\nNext action: Scout’s @task-k5026:launch-pilot-validation is **planned; not started**. Proposed acceptance evidence: documented pilot fit and acceptance criteria, followed by an explicit Admin decision on execution. No outreach or spend is authorized by this review.\n\nSaved evidence:\n- Report: @art-md0754:sample-data-relaydesk-launch-plan\n- Dashboard: @art-html7243:product-launch\n\n## 2. Customer feedback priorities\n**Accountable owner: Analyst. Extraction: Echo.**\n\nEvidence: 12 feedback records represent 11 unique accounts. Of these, 11 issue/request records span 10 accounts and one record is positive. CSV export has four records from three accounts; duplicate notifications, performance and onboarding each have two records from two accounts; dark theme has one record from one account. F01 and F11 belong to the same account.\n\nReview decision: count unique accounts as well as records to avoid overstating demand. CSV export has the broadest stated account reach and merits specification next; reach alone does not establish severity, effort or commercial value. The supplied category record counts reconcile to 11 issue/request records. Category account counts must not be summed to infer distinct accounts because cross-category overlap is not specified.\n\nNext action: Maker’s @task-p1444:csv-export-spec is **planned; not started**. Proposed acceptance evidence: a scoped export specification with acceptance criteria, dependencies and effort estimate, reviewed with Analyst. Priorities remain recommendations; no shipped feature is evidenced.\n\nSaved evidence:\n- Report: @art-md0342:sample-data-feedback-report\n- Dashboard: @art-html3318:customer-feedback\n\n## 3. Weekly business review\n**Accountable owner: Ledger.**\n\nEvidence: W4 revenue is $12,600, down $1,800 (12.50%) from W3. Against the $15,000 target, the shortfall is $2,400 (16%) and attainment is 84%. Conversion is 11.25%. SLA attainment is 69.44% against a 90% target. Coverage is four synthetic weeks; causes are unverified hypotheses.\n\nReview decision: revenue arithmetic reconciles (implied W3 revenue: $14,400). The SLA gap is 20.56 percentage points. Treat revenue and SLA gaps as review priorities, while leaving causal explanations unconfirmed. Conversion cannot be judged against a target because none is supplied.\n\nNext action: Ledger’s @task-z8898:weekly-data-refresh is **planned; not started**. Proposed acceptance evidence: refreshed source data, metric definitions and denominators, comparable periods, and evidence that tests the stated hypotheses. No recovery or business improvement is established by this snapshot.\n\nSaved evidence:\n- Report: @art-md5678:sample-data-weekly-business-review\n- Dashboard: @art-html0445:weekly-business-review\n\n## Actual reviewed assignment results\nStatus below is reported by the supplied snapshot.\n\n| Owner | Assignment | Snapshot status | Reviewed result |\n|---|---|---|---|\n| Scout | @task-b8133:launch-research | Reviewed and completed | Fictional C1–C5 research-card verification reported |\n| Maker | @task-h1574:launch-plan | Reviewed and completed | Proposed four-week pilot plan; $2,000 cap; no execution |\n| Echo | @task-y7163:feedback-extraction | Reviewed and completed | 12 records / 11 unique accounts; duplicate account identified |\n| Analyst | @task-j3408:feedback-priorities | Reviewed and completed | Feedback prioritization recommendations; no shipped features |\n| Ledger | @task-b0952:weekly-business-review | Reviewed and completed | Four-week synthetic metric review; causes unverified |\n\nThe results above map the case summaries to their corresponding assignments; the snapshot does not supply full individual task logs.\n\n## Proposed next steps and governance\n1. Admin reviews this Atlas synthesis and the proposed decisions.\n2. Scout validates the pilot assumptions under the existing planned task.\n3. Maker develops the CSV export specification under the existing planned task.\n4. Ledger refreshes the weekly data under the existing planned task.\n5. Atlas checks the resulting evidence against the acceptance criteria above when available.\n\nSteps 2–4 are recorded plans, not work performed in this review. Acceptance criteria are Atlas recommendations, not saved changes to those tasks. Five specialists report to Atlas; Atlas has no manager. Automatic checks are paused. These were explicit one-off runs. No schedules, assignments or completion states were changed.\n","previewHtml":"\u003c!doctype html>\u003cmeta charset=\"utf-8\">\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'unsafe-inline'; style-src \u003cdiv class=\"stat\">\u003cstrong>3\u003c/strong>\u003cspan>follow-ups planned · not started\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cstrong>Paused\u003c/strong>\u003cspan>automatic checks · one-off runs only\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"grid\">\n\u003carticle class=\"card\">\u003cspan class=\"pill pending\">Execution proposed\u003c/span>\u003ch3>01 / Product launch\u003c/h3>\u003cdiv class=\"owner\">Owner: Maker · Research: Scout\u003c/div>\u003cdiv class=\"metric\">10 \u003csmall>accepted pilot teams targeted\u003c/small>\u003c/div>\u003cp>Four relative weeks · $1,800 base + $200 contingency = \u003cstrong>$2,000 cap\u003c/strong>.\u003c/p>\u003cspan class=\"label\">Evidence\u003c/span>\u003cp>Snapshot reports verification of fictional C1–C5 cards. No outreach or expenditure occurred. Pilot acceptance is a target, not an observed result.\u003c/p>\u003cdiv class=\"decision\">\u003cspan class=\"label\">Review decision\u003c/span>\u003cp>Retain the plan as proposed. Budget reconciles; target achievement is not evidenced.\u003c/p>\u003cspan class=\"label\">Next step · Scout\u003c/span>\u003cp>Validate pilot assumptions and acceptance criteria through the existing planned task. Execution remains subject to Admin’s decision.\u003c/p>\u003c/div>\u003cdiv class=\"source\">Report \u003cspan class=\"ref\">@art-md0754:sample-data-relaydesk-launch-plan\u003c/span>\u003cbr>Dashboard \u003cspan class=\"ref\">@art-html7243:product-launch\u003c/span>\u003c/div>\u003c/article>\n\u003carticle class=\"card\">\u003cspan class=\"pill pending\">Recommendations only\u003c/span>\u003ch3>02 / Customer feedback\u003c/h3>\u003cdiv class=\"owner\">Owner: Analyst · Extraction: Echo\u003c/div>\u003cdiv class=\"metric\">12 \u003csmall>records / 11 unique accounts\u003c/small>\u003c/div>\u003cp>11 issue/request records across 10 accounts; one positive record.\u003c/p>\u003cspan class=\"label\">Evidence · records / accounts\u003c/span>\u003cp>\u003cstrong>CSV export 4 / 3\u003c/strong>\u003cbr>Duplicate notifications 2 / 2\u003cbr>Performance 2 / 2 · Onboarding 2 / 2\u003cbr>Dark theme 1 / 1\u003c/p>\u003cp class=\"small\">F01 and F11 are the same account. Cross-category account overlap is unspecified.\u003c/p>\u003cdiv class=\"decision\">\u003cspan class=\"label\">Review decision\u003c/span>\u003cp>CSV export has the broadest stated account reach. Specify it next, then assess severity, effort and value. No feature shipment is evidenced.\u003c/p>\u003cspan class=\"label\">Next step · Maker\u003c/span>\u003cp>Draft the export specification and acceptance criteria, with Analyst review.\u003c/p>\u003c/div>\u003cdiv class=\"source\">Report \u003cspan class=\"ref\">@art-md0342:sample-data-feedback-report\u003c/span>\u003cbr>Dashboard \u003cspan class=\"ref\">@art-html3318:customer-feedback\u003c/span>\u003c/div>\u003c/article>\n\u003carticle class=\"card\">\u003cspan class=\"pill pending\">Causes unverified\u003c/span>\u003ch3>03 / Weekly business review\u003c/h3>\u003cdiv class=\"owner\">Owner: Ledger · Four synthetic weeks\u003c/div>\u003cdiv class=\"metric\">$12,600 \u003csmall>W4 revenue\u003c/small>\u003c/div>\u003cp>Down $1,800 (12.50%) from W3. Target: $15,000. Shortfall: $2,400 (16%).\u003c/p>\u003cspan class=\"label\">Revenue target attainment · 84%\u003c/span>\u003cdiv class=\"progress\" role=\"img\" aria-label=\"Revenue target attainment 84 percent\">\u003cdiv style=\"width:84%\">\u003c/div>\u003c/div>\u003cp>\u003cstrong>Conversion 11.25%\u003c/strong> · No target supplied.\u003cbr>\u003cstrong>SLA 69.44%\u003c/strong> vs 90% target.\u003cbr>SLA gap: 20.56 percentage points.\u003c/p>\u003cdiv class=\"decision\">\u003cspan class=\"label\">Review decision\u003c/span>\u003cp>Revenue arithmetic reconciles. Prioritize the revenue and SLA gaps; causal explanations remain hypotheses.\u003c/p>\u003cspan class=\"label\">Next step · Ledger\u003c/span>\u003cp>Refresh comparable source data and metric definitions, then test the hypotheses.\u003c/p>\u003c/div>\u003cdiv class=\"source\">Report \u003cspan class=\"ref\">@art-md5678:sample-data-weekly-business-review\u003c/span>\u003cbr>Dashboard \u003cspan class=\"ref\">@art-html0445:weekly-business-review\u003c/span>\u003c/div>\u003c/article>\n\u003c/div>\n\u003csection class=\"panel\">\u003ch2>Actual reviewed task results\u003c/h2>\u003cp class=\"small\">Statuses are reproduced from the supplied snapshot. Result summaries map the case evidence to the corresponding assignments; full task logs were not supplied.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Owner\u003c/th>\u003cth>Actual assignment\u003c/th>\u003cth>Snapshot status\u003c/th>\u003cth>Reviewed result\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>Scout\u003c/td>\u003ctd class=\"ref\">@task-b8133:launch-research\u003c/td>\u003ctd class=\"status\">Reviewed and completed\u003c/td>\u003ctd>Verification of fictional C1–C5 research cards reported.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Maker\u003c/td>\u003ctd class=\"ref\">@task-h1574:launch-plan\u003c/td>\u003ctd class=\"status\">Reviewed and completed\u003c/td>\u003ctd>Proposed four-week pilot plan and $2,000 cap; no execution.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Echo\u003c/td>\u003ctd class=\"ref\">@task-y7163:feedback-extraction\u003c/td>\u003ctd class=\"status\">Reviewed and completed\u003c/td>\u003ctd>12 records / 11 accounts; F01/F11 duplicate account identified.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Analyst\u003c/td>\u003ctd class=\"ref\">@task-j3408:feedback-priorities\u003c/td>\u003ctd class=\"status\">Reviewed and completed\u003c/td>\u003ctd>Issue/request categorization and priority recommendations; no shipped features.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Ledger\u003c/td>\u003ctd class=\"ref\">@task-b0952:weekly-business-review\u003c/td>\u003ctd class=\"status\">Reviewed and completed\u003c/td>\u003ctd>Four-week metric review; revenue and SLA gaps, with causes unverified.\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\u003cdiv class=\"note\">\u003cstrong>Atlas review assignment completed:\u003c/strong> \u003cspan class=\"ref\">@task-z6571:review-all-cases\u003c/span>. The coordinating assistant verified these deliverables; they remain available for Admin review. Prior task completion does not prove the business objectives succeeded.\u003c/div>\u003c/section>\n\u003csection class=\"panel\">\u003ch2>Next steps · planned, not started\u003c/h2>\u003cp class=\"small\">These are existing planned tasks. Acceptance evidence below is recommended by Atlas; no task settings were changed.\u003c/p>\u003cdiv class=\"next\">\n\u003carticle>\u003cspan class=\"pill pending\">Planned · not started\u003c/span>\u003ch3>Scout / Pilot validation\u003c/h3>\u003cp class=\"ref small\">@task-k5026:launch-pilot-validation\u003c/p>\u003cp>Document pilot fit and acceptance criteria for Admin’s execution decision.\u003c/p>\u003c/article>\n\u003carticle>\u003cspan class=\"pill pending\">Planned · not started\u003c/span>\u003ch3>Maker / CSV export spec\u003c/h3>\u003cp class=\"ref small\">@task-p1444:csv-export-spec\u003c/p>\u003cp>Define scope, acceptance criteria, dependencies and effort; review with Analyst.\u003c/p>\u003c/article>\n\u003carticle>\u003cspan class=\"pill pending\">Planned · not started\u003c/span>\u003ch3>Ledger / Weekly refresh\u003c/h3>\u003cp class=\"ref small\">@task-z8898:weekly-data-refresh\u003c/p>\u003cp>Refresh sources, denominators and comparable periods; collect evidence to test causes.\u003c/p>\u003c/article>\n\u003c/div>\u003c/section>\n\u003csection class=\"panel\">\u003ch2>Review boundary and ownership\u003c/h2>\u003cp>Atlas reviewed the complete supplied results snapshot and checked the stated arithmetic. Underlying cards, individual feedback records and linked reports were not independently re-read. The snapshot reports their prior verification.\u003c/p>\u003cp>Scout, Maker, Echo, Analyst and Ledger report to Atlas. Atlas has no manager. Automatic checks remain paused. No outreach, spend, schedule changes or task completion updates were performed in this review.\u003c/p>\u003cp>\u003cstrong>Admin’s next decision:\u003c/strong> review this synthesis and its proposed next actions. Atlas can assess follow-up evidence when it becomes available.\u003c/p>\u003cp class=\"small\">Companion review: \u003cspan class=\"ref\">@art-md0200:sample-data-team-review\u003c/span>\u003cbr>Evidence snapshot: \u003cspan class=\"ref\">@art-json0706:case-results\u003c/span>\u003c/p>\u003c/section>\n\u003cfooter>\u003cstrong>SAMPLE DATA\u003c/strong> · Self-contained dashboard with inline styles and no external assets · Prepared 18 September 2026 · Saved snapshot, not a live monitoring service\u003c/footer>\n\u003c/main>\u003c/body>\u003c/html>"}]};

for(const a of state.agents) a.kind ??= a.id==='designers'?'group':'sapi';

}

let search = '', toastTimer, dragId, pending = new Set();
const agent = id => state.agents.find(a=>a.id===id) || state.agents[0];

const isGroup = a => a.kind==='group' || a.id==='designers';

    state.mainSapiId=state.agents.find(a=>a.id==='jared'&&!isGroup(a))?.id||state.agents.find(a=>!isGroup(a))?.id;
  const mainSapi=state.agents.find(a=>isMainSapi(a));

function formatText(value){

  const names=state.agents.map(a=>a.name).filter(Boolean).sort((a,b)=>b.length-a.length).map(name=>name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!names.length)return esc(text);
  const pattern=new RegExp(`(?<![\\p{L}\\p{N}_@.-])@?(?:${names.join('|')}|art-[a-z0-9]+:[a-z0-9-]+)(?![\\p{L}\\p{N}_@-])`,'giu');
  let result='',cursor=0;

  if(location.hash==='#home:root'&&!isMainSapi(a))history.replaceState(null,'',location.pathname+location.search);
  state.drafts ??= {};state.drafts[state.selected]=$('#message-input').value;
  state.selected=id;state.panel='chat';state.panes.chat=true;a.unread=false;
  if(state.scope!=='all')state.scope=isGroup(a)?'groups':'sapis';
  search='';$('#agent-search').value='';$('#message-input').value=state.drafts[id]||'';
  closeModal();render();$('#conversation-body').scrollTop=$('#conversation-body').scrollHeight;
}
function save(){storeWorkspace();try{localStorage.setItem(STORAGE,JSON.stringify(state));}catch{toast('Browser storage is full or unavailable. Changes will last for this session.');}}
function toast(message){$('#toast').textContent=message;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),3200);}
function log(agentId,title,detail){recordActivity(agentId,title);state.logs.unshift({agent:agentId,time:now(),title,detail});state.logs=state.logs.slice(0,100);}
function modal(title,content,eyebrow='SAPI WORKSPACE'){$('#modal-eyebrow').textContent=eyebrow;$('#modal-content').innerHTML=`<h2 id="modal-title">${esc(title)}</h2>${content}`;if(!$('#modal').open)$('#modal').showModal();}

function render(){if($('#modal').open&&$('#modal-title')?.textContent==='Shared computer')computerDialog();renderPanes();renderSidebar();renderAgentHeader();renderConversation();renderTabs();renderWorkspace();renderGlobal();save();}
function renderPanes(){
  state.panes ??= {sidebar:true,chat:true,workspace:true};
  const names={sidebar:'chat list',chat:'chat',workspace:'workspace'};
  const ids={sidebar:'#chat-list-panel',chat:'#chat-panel',workspace:'#workspace-panel'};
  for(const pane of Object.keys(ids)){
    $(ids[pane]).hidden=!state.panes[pane];
    const button=$(`[data-toggle-pane="${pane}"]`);
    button.setAttribute('aria-pressed',String(state.panes[pane]));
    button.setAttribute('aria-expanded',String(state.panes[pane]));
    const label=`${state.panes[pane]?'Hide':'Show'} ${names[pane]}`;
    button.setAttribute('aria-label',label);button.title=label;
  }
  const p=state.panes;
  const count=Object.values(p).filter(Boolean).length;
  $('.main-grid').dataset.visiblePanes=count;
  $('.main-grid').style.gridTemplateColumns=[p.sidebar?(count===1?'minmax(0,1fr)':'clamp(200px,18vw,230px)'):'0px',p.chat?'minmax(320px,0.95fr)':'0px',p.workspace?'minmax(350px,1.2fr)':'0px'].join(' ');
}

function renderAgentHeader(){const a=selected();$('#agent-heading').innerHTML=`${avatar(a,isMainSapi(a)?'large main-sapi-avatar':'large')}<div><h2 title="${esc(a.role)}">${esc(a.name)}</h2><p><span class="status-dot"></span> ${state.mode==='paused'?'Paused':a.autonomy==='auto'?'Autonomous':'Assisted'}</p></div><button class="icon-button" data-action="agent-settings" aria-label="Agent settings">···</button>`;$('#message-input').placeholder=`Message ${a.name}…`;$$('[data-panel]').forEach(b=>{b.classList.toggle('active',b.dataset.panel===state.panel);b.setAttribute('aria-pressed',b.dataset.panel===state.panel);});const more=$('.activity-menu summary');if(more)more.firstChild.textContent=({log:'Activity ',cron:'Schedules '})[state.panel]||'More ';$('.composer-hint span').textContent=state.mode==='paused'?'Ⅱ Team paused':a.autonomy==='auto'?'Autonomous':'Assisted';}
function getMessages(id){if(!state.messages[id]){const a=agent(id);state.messages[id]=[{role:'assistant',time:'09:35',text:({jared:'Good morning, Alex. The team is making progress on Brightside. Aaron has the technical work, Designers are up next on the shared computer, and I’m keeping the bigger picture together.\n\nWhat would you like to move forward today?',designers:'We’ve got the kickoff deck on our list. We’re next in line for the shared computer—once Aaron wraps up, we’ll take it from there.',slack:'I’m keeping an eye on team conversations and collecting the updates that matter. The Brightside recap is ready for a final pass.',scout:'Ready to explore. Give me an account, a question, or a hunch, and I’ll turn it into something useful.'})[id]||`Hi, I’m ${a.name}. Give me a task and I’ll get started.`}];}return state.messages[id];}
function executionCard(){return `<div class="execution-card"><div class="execution-title">Actions <span>3 / 3</span></div><div class="execution-line"><span class="check">✓</span> Read meeting notes & account context <time>2s</time></div><div class="execution-line"><span class="check">✓</span> Verify Slack + SSO release <time>4s</time></div><div class="execution-line"><span class="check">✓</span> Share update with Brightside <time>3s</time></div></div>`;}
function messageContent(message, label='message') {
  const text=String(message.text || '');
  const paragraphs=value=>value.split('\n\n').map(p=>`<p>${formatText(p).replace(/\n/g,'<br>')}</p>`).join('');
  if(text.length<=560)return paragraphs(text);
  const first=text.split('\n\n')[0];
  const assignment=state.tasks.find(task=>task.reference?.replace(/^@/,'')===first.replace(/^Assignment /,''));
  const preview=assignment?assignment.title:first.length<=240?first:text.slice(0,220).replace(/\s+\S*$/,'')+'…';
  return `<div class="message-preview">${paragraphs(preview)}</div><details class="message-details"><summary><span class="expand-label">Show full ${esc(label)}</span><span class="collapse-label">Show less</span></summary><div class="message-full">${paragraphs(text)}</div></details>`;
}
function renderConversation(){const host=$('#conversation-body');$('#composer-area').hidden=state.panel!=='chat';renderAgentHeader();renderGlobal();

  if(state.panel==='tasks')host.innerHTML=`<div class="list-heading"><h3>${esc(selected().name)}’s tasks</h3><button class="button" data-action="new-task">＋ Task</button></div>`+state.tasks.filter(t=>t.agent===state.selected).map(taskCard).join('')+(state.tasks.some(t=>t.agent===state.selected)?'':'<div class="empty">A clean slate. Add the first task.</div>');
  if(state.panel==='log')host.innerHTML=`<div class="list-heading"><h3>Activity log</h3><span class="tag">SIMULATED</span></div>`+state.logs.filter(l=>l.agent===state.selected).map(l=>`<div class="log-row"><time>${esc(l.time)}</time><strong>${esc(l.title)}</strong><div class="log-detail">${messageContent({text:l.detail},'entry')}</div></div>`).join('')+(state.logs.some(l=>l.agent===state.selected)?'':'<div class="empty">New activity will appear here.</div>');
  if(state.panel==='cron')host.innerHTML=`<div class="list-heading"><h3>Schedules</h3><button class="button" data-action="new-schedule">＋ Schedule</button></div><p class="form-hint" style="margin-bottom:17px">Demo schedules. Use “Run now” to preview an execution.</p>`+state.schedules.filter(s=>s.agent===state.selected).map(s=>`<div class="schedule-card"><div class="task-card-top"><h3>${esc(s.title)}</h3><button class="switch ${s.enabled?'':'off'}" role="switch" aria-checked="${s.enabled}" aria-label="Enable ${esc(s.title)}" data-toggle-schedule="${s.id}"></button></div><p>${esc(s.prompt)}</p><span class="schedule-meta">↻ ${esc(s.frequency)}</span><div class="actions"><small class="muted">${s.runs} runs · ${s.enabled?'Active':'Paused'}</small><button class="button soft" data-run-schedule="${s.id}">▷ Run now</button><button class="icon-button" data-edit-schedule="${s.id}" aria-label="Edit ${esc(s.title)}">···</button></div></div>`).join('')+(state.schedules.some(s=>s.agent===state.selected)?'':'<div class="empty">Set up a recurring task for this Sapi.</div>');
}
function taskCard(t){const a=agent(t.agent);return `<article class="task-card"><button class="task-open" data-task="${esc(t.id)}"><div class="task-card-top"><span class="tag ${t.status==='Queued'?'gray':t.status==='In progress'?'amber':''}">${t.status==='Done'?'✓ ':t.status==='In progress'?'◌ ':''}${esc(t.status)}</span><span class="muted">↗</span></div><h3>${esc(t.title)}</h3><p>${esc(t.description)}</p>${t.status==='In progress'?`<div class="progress-track" role="progressbar" aria-label="Task progress" aria-valuenow="${t.progress}" aria-valuemin="0" aria-valuemax="100"><span style="width:${t.progress}%"></span></div>`:''}</button><div class="task-card-bottom">${avatar(a,'mini')} ${mention(a.id)}<span class="tag gray">${esc(t.case || (t.status==='Done'?'Completed':'Assigned work'))}</span></div></article>`;}
function renderTabs(){syncWorkspace();const host=$('#browser-tabs');host.innerHTML=state.tabs.map(t=>`<div class="workspace-tab ${t.id===state.activeTab?'active':''}" draggable="true" data-drag-tab="${esc(t.id)}"><button class="tab-select" data-tab="${esc(t.id)}" aria-pressed="${t.id===state.activeTab}"><span class="tab-icon">${tabTypes[t.type]?.[0]??'↗'}</span>${esc(t.title)}</button><button class="tab-close" data-close-tab="${esc(t.id)}" aria-label="Close ${esc(t.title)}">×</button></div>`).join('');
  $$('[data-drag-tab]').forEach(el=>{el.addEventListener('dragstart',e=>{dragId=el.dataset.dragTab;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';});el.addEventListener('dragover',e=>e.preventDefault());el.addEventListener('drop',e=>{e.preventDefault();const target=el.dataset.dragTab;const from=state.tabs.findIndex(t=>t.id===dragId),to=state.tabs.findIndex(t=>t.id===target);if(from<0||to<0)return;state.tabs.splice(to,0,state.tabs.splice(from,1)[0]);renderTabs();save();});el.addEventListener('dblclick',e=>{if(!e.target.closest('[data-close-tab]'))tabSettings(el.dataset.dragTab);});});
}
function openTab(type='blank',title,extra={}){
  syncWorkspace();
  const t={id:uid(),type,title:title||tabTypes[type]?.[1]||'New tab',...extra};
  state.tabs.push(t);state.activeTab=t.id;state.panes.workspace=true;
  renderPanes();renderTabs();renderWorkspace();save();
}
function renderWorkspace(){
  syncWorkspace();
  $('#workspace-owner').innerHTML=`${mention(workspaceOwner)}<span>’s workspace</span>`;
  const t=state.tabs.find(t=>t.id===state.activeTab),host=$('#workspace-content');
  $('#browser-address-form').hidden=!t;
  $('#browser-address').value=t?.type==='custom'?t.url:t?.type==='html'?'HTML document':'';
  $('#open-page').hidden=t?.type!=='custom';
  if(t?.type==='custom')$('#open-page').href=t.url;else $('#open-page').removeAttribute('href');
  storeWorkspace();
  const liveIds=new Set(Object.values(state.workspaces).flatMap(ws=>ws.tabs.map(t=>t.id)).concat(state.tabs.map(t=>t.id)));
  for(const [id,entry] of browserFrames)if(!liveIds.has(id)){entry.frame.remove();browserFrames.delete(id);}
  for(const entry of browserFrames.values())entry.frame.hidden=true;
  if(!t)return;
  const signature=JSON.stringify([t.type,t.url,t.html]);
  let entry=browserFrames.get(t.id);
  if(!entry||entry.signature!==signature){
    entry?.frame.remove();
    const frame=document.createElement('iframe');
    frame.className='workspace-browser';
    // Guest scripts run in an opaque origin, separated from app data and controls.
    frame.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads');
    frame.referrerPolicy='no-referrer';
    if(t.type==='custom'&&safeUrl(t.url))frame.src=safeUrl(t.url);
    else if(t.type==='html')frame.srcdoc=t.html||'';
    else frame.srcdoc='<!doctype html><html><head><meta name="color-scheme" content="light dark"></head><body></body></html>';
    entry={frame,signature};browserFrames.set(t.id,entry);host.append(frame);
  }
  entry.frame.title=t.title;entry.frame.hidden=false;
}
function safeUrl(value){try{const u=new URL(value);return /^https?:$/.test(u.protocol)?u.href:null;}catch{return null;}}

function computerDialog(){const c=state.computer;modal('Shared computer',`<div class="settings-row"><span>${c.owner?`${mention(c.owner)} · ${c.paused?'Paused':'In use'}`:'Available'}</span><span class="tag">${c.owner?'Locked':'Free'}</span></div><div class="modal-actions"><button class="button primary" data-action="take-control">${c.owner==='you'?'Release control':'Take control'}</button><button class="button" data-action="pause-computer">${c.paused?'Resume':'Pause'}</button><button class="button" data-action="handoff" ${c.queue.length?'':'disabled'}>Hand off →</button></div><div class="subheading"><h3>Queue</h3><button class="button" data-action="join-queue">＋</button></div>${c.queue.map(id=>`<div class="settings-row">${avatar(agent(id),'mini')}${mention(id)}<button class="icon-button" data-remove-queue="${esc(id)}" aria-label="Remove ${esc(agent(id).name)} from queue">×</button></div>`).join('')}`);}
function autonomyDialog(){modal('Autonomy',`<p>Sapis work autonomously by default. Shared computer access always belongs to one controller at a time.</p>${[['auto','✦','Autonomous','Agents complete demo tasks and pass the computer lock on their own.'],['assist','◇','Assisted','Agents prepare work. You choose when each demo task runs.'],['paused','Ⅱ','Pause the team','Stop new agent actions. Keep your workspace and computer lock.']].map(([mode,icon,title,desc])=>`<button class="auto-choice ${state.mode===mode?'selected':''}" data-mode="${mode}"><span>${icon}</span><span><strong>${title}</strong><small>${desc}</small></span></button>`).join('')}<p class="form-hint" style="margin-top:18px">You can also adjust autonomy for each Sapi in its settings.</p>`);}
function agentSettings(){const a=selected();modal(`${a.name} settings`,`<div class="agent-profile">${avatar(a)}<div><strong>${esc(a.role)}</strong><p class="form-hint" style="margin-top:5px">${isGroup(a)?'Group · Voronoi avatar':'Individual Sapi'} · ${a.status==='idle'?'Standing by':'Available'}</p></div></div><form id="agent-settings-form" class="form-stack"><label>Name<input name="name" value="${esc(a.name)}" required maxlength="24"></label><label>Role<input name="role" value="${esc(a.role)}" required maxlength="60"></label><label>Autonomy<select name="autonomy"><option value="auto" ${a.autonomy==='auto'?'selected':''}>Autonomous — execute and report</option><option value="assist" ${a.autonomy==='assist'?'selected':''}>Assisted — prepare, then wait</option></select></label><button class="button primary" type="submit">Save Sapi</button></form>`,`SAPI / ${a.name.toUpperCase()}`);}
function addAgent(){modal('Add agent',`<form id="add-agent-form" class="form-stack"><div class="form-row"><label>Name<input name="name" required placeholder="e.g. Nova" maxlength="24"></label><label>Role<input name="role" required placeholder="e.g. Product strategist" maxlength="60"></label></div><div class="form-row"><label>Type<select name="kind"><option value="sapi">Sapi</option><option value="group">Group</option></select></label><label>Personality<select name="face"><option value="◕‿◕">(◕‿◕) Curious</option><option value="◠‿◠">(◠‿◠) Calm</option><option value="•̀ᴗ•́">(•̀ᴗ•́) Focused</option><option value="≧▽≦">(≧▽≦) Delighted</option></select></label></div><label>Avatar color<select name="color"><option value="#fdd997">Golden haze</option><option value="#f7d6d1">Rosewater</option><option value="#c9f3f1">Ice aqua</option><option value="#dbd0f7">Lavender</option><option value="#d8e5f4">Pale sky blue</option></select></label><p class="form-hint">Starts autonomous. You can adjust this anytime.</p><button type="submit" class="button primary">＋ Add agent</button></form>`);}
