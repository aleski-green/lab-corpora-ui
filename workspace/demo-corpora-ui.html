g:20px;border-radius:12px}details{margin-top:20px}summary{cursor:pointer;font-weight:700;color:var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 system-ui,sans-serif;border-top:1px solid var(--line);padding-top:16px}footer{font-size:12px;color:var(--muted);margin-top:26px}ul{padding-left:20px}li{margin:8px 0}@media(max-width:900px){.weeks,.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){main{padding:16px}header{padding:26px}section{padding:20px}.grid,.weeks,.stats{grid-template-columns:1fr}h1{letter-spacing:-1px}}@media print{body{background:white}main{padding:0}header{background:white;color:var(--ink);border:1px solid var(--line)}header p,.meta{color:var(--muted)}section,.week{break-inside:avoid}.weeks{grid-template-columns:repeat(2,1fr)}details{display:none}}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\n\u003cheader>\u003cdiv class=\"headerline\">\u003cspan class=\"badge\">SAMPLE DATA\u003c/span>\u003cspan class=\"meta\">REVIEW DRAFT · RELATIVE WEEKS · NO LAUNCH DATE\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\" style=\"margin-top:32px\">RelayDesk / Pilot launch proposal\u003c/div>\u003ch1>Ten teams.\u003cbr>Four weeks. Clear evidence.\u003c/h1>\u003cp>Test whether a shared inbox designed for fast setup and clear ownership earns continued use from small service teams. Every product claim, funnel rate and outcome shown here is a hypothesis or target.\u003c/p>\u003c/header>\n\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003cspan>RECRUITMENT TARGET\u003c/span>\u003cstrong>10 teams\u003c/strong>\u003cspan>Eligible + accepted + onboarding booked\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>TIME HORIZON\u003c/span>\u003cstrong>4 weeks\u003c/strong>\u003cspan>Start after scope and owners are approved\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>HARD CASH CEILING\u003c/span>\u003cstrong>$2,000\u003c/strong>\u003cspan>$1,800 base + $200 reserve\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>EXECUTION STATUS\u003c/span>\u003cstrong style=\"font-size:26px\">Not started\u003c/strong>\u003cspan>No measured launch outcomes\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"notice\">\u003cb>Prepared:\u003c/b> input review, launch plan and this dashboard. \u003cb>Proposed only:\u003c/b> outreach, pilot activity, spending and owner roles. No assignments were created. Task @task-h1574 stays open for Admin review. All supplied competitor cards are fictional.\u003c/div>\n\u003csection>\u003cdiv class=\"eyebrow\">01 / Acquisition assumptions\u003c/div>\u003ch2>A measurable path to ten teams\u003c/h2>\u003cdiv class=\"funnel\">\u003cdiv class=\"step\">\u003cb>120\u003c/b>Distinct invited teams\u003c/div>\u003cspan aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"step\">\u003cb>24\u003c/b>Qualified discovery calls · 20%\u003c/div>\u003cspan aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"step\">\u003cb>10\u003c/b>Accepted pilots · 41.7% of calls\u003c/div>\u003c/div>\u003cp class=\"muted\">Planning math, not a forecast: 8.3% overall conversion. Proposed mix: 60 permissioned warm introductions / 40 community opt-ins / 20 partner referrals. No prospect list exists yet.\u003c/p>\u003cdiv class=\"grid\">\u003cdiv>\u003ch3>Who qualifies?\u003c/h3>\u003cp>A 2–10-person service team, at least two participants, a shared request inbox, a named authorized lead and a concrete ownership or follow-up problem. Count a unique team only after terms acceptance and booked onboarding.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>What is the offer?\u003c/h3>\u003cp>Proposed free evaluation through W4; no automatic charge. Future price hypothesis: $59/team/month. Research honoraria are independent of positive feedback or purchase. Admin reviews terms before any execution.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection>\u003cdiv class=\"eyebrow\">02 / Four-week sequence\u003c/div>\u003ch2>Milestones and suggested owners\u003c/h2>\u003cdiv class=\"weeks\">\u003carticle class=\"week\">\u003cdiv class=\"number\">01\u003c/div>\u003ch3>Prepare &amp; qualify\u003c/h3>\u003cp>\u003cb>Proposed:\u003c/b> Atlas + Maker\u003c/p>\u003cp>Define eligibility, approve pilot terms and data handling, test the activation workflow, draft two messages, and prepare 120 prospect records from authorized sources.\u003c/p>\u003cp>30 draft invitations; 6 discovery calls; 2 accepted teams\u003c/p>\u003cdiv class=\"target\">2 / 10 cumulative teams\u003c/div>\u003cp class=\"muted\">$350 weekly envelope\u003c/p>\u003c/article>\u003carticle class=\"week\">\u003cdiv class=\"number\">02\u003c/div>\u003ch3>Recruit &amp; activate\u003c/h3>\u003cp>\u003cb>Proposed:\u003c/b> Maker + Echo\u003c/p>\u003cp>After separate authorization, propose 40 invitations and one follow-up per non-responder after 4–5 business days. Run 8 discovery calls and guided onboarding.\u003c/p>\u003cp>3 additional accepted; 4 cumulative activated\u003c/p>\u003cdiv class=\"target\">5 / 10 cumulative teams\u003c/div>\u003cp class=\"muted\">$500 weekly envelope\u003c/p>\u003c/article>\u003carticle class=\"week\">\u003cdiv class=\"number\">03\u003c/div>\u003ch3>Close the gap\u003c/h3>\u003cp>\u003cb>Proposed:\u003c/b> Atlas + Maker\u003c/p>\u003cp>Propose 35 invitations and 8 discovery calls. Ask willing pilots for introductions only with consent. Compare message responses and fix recurring setup friction.\u003c/p>\u003cp>3 additional accepted; 7 cumulative activated\u003c/p>\u003cdiv class=\"target\">8 / 10 cumulative teams\u003c/div>\u003cp class=\"muted\">$550 weekly envelope\u003c/p>\u003c/article>\u003carticle class=\"week\">\u003cdiv class=\"number\">04\u003c/div>\u003ch3>Confirm &amp; evaluate\u003c/h3>\u003cp>\u003cb>Proposed:\u003c/b> Echo + Analyst + Ledger\u003c/p>\u003cp>Propose final 15 invitations and 2 discovery calls early in week. Confirm remaining teams; measure retained use, ownership clarity, price response and costs.\u003c/p>\u003cp>2 additional accepted; 8 cumulative activated; decision memo\u003c/p>\u003cdiv class=\"target\">10 / 10 cumulative teams\u003c/div>\u003cp class=\"muted\">$400 weekly envelope\u003c/p>\u003c/article>\u003c/div>\u003cp class=\"muted\">W1 additionally proposes 30 invitations and 6 calls. W2: 40 / 8; W3: 35 / 8; W4: 15 / 2. New acceptance targets: 2 / 3 / 3 / 2. W4 assumes both calls close, so prioritize earlier acceptance. Envelopes total $1,800 and allocate, rather than add to, the budget below.\u003c/p>\u003c/section>\n\u003csection>\u003cdiv class=\"eyebrow\">03 / Evidence gates\u003c/div>\u003ch2>Recruitment alone does not prove demand\u003c/h2>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Metric\u003c/th>\u003cth>Proposed W4 threshold\u003c/th>\u003cth>Evidence\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Recruitment\u003c/td>\u003ctd>10 distinct eligible teams\u003c/td>\u003ctd>Accepted terms + lead + booked onboarding\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Activation\u003c/td>\u003ctd>At least 8 of 10\u003c/td>\u003ctd>Inbox connected, teammate added, request assigned, test SLA alert\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Retained use\u003c/td>\u003ctd>At least 6 of 10\u003c/td>\u003ctd>Activity on two separate days in seven days after activation; cohort activated by W3 end\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ownership clarity\u003c/td>\u003ctd>At least 8 of 10 leads\u003c/td>\u003ctd>Identify a request owner without facilitator assistance; untested cases disclosed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Preliminary demand\u003c/td>\u003ctd>At least 5 of 10\u003c/td>\u003ctd>Request continued use and state willingness to pay $59/month after use; no revenue implied\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Setup hypothesis\u003c/td>\u003ctd>Median ≤60 min among completers\u003c/td>\u003ctd>Every attempt recorded; show range, assistance, failures and completion denominator\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Budget\u003c/td>\u003ctd>Committed + paid ≤$2,000\u003c/td>\u003ctd>Cash ledger; $200 reserve released only by Admin\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">Proceed only if recruitment, budget and value gates are met. If recruitment succeeds but value gates fail: “recruitment achieved; demand inconclusive.” Admin decides whether to proceed, iterate or stop. Small samples support directional learning.\u003c/p>\u003c/section>\n\u003csection>\u003cdiv class=\"eyebrow\">04 / Fictional comparison · SAMPLE DATA\u003c/div>\u003ch2>Compete on a hypothesis; test the promise\u003c/h2>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Evidence\u003c/th>\u003cth>Product\u003c/th>\u003cth>USD / team / month\u003c/th>\u003cth>Listed workflow features\u003c/th>\u003cth>Setup\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>C1\u003c/td>\u003ctd>InboxOak\u003c/td>\u003ctd>$49\u003c/td>\u003ctd>Basic assignment; explicitly no SLA alerts\u003c/td>\u003ctd>1 day\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C2\u003c/td>\u003ctd>TeamWillow\u003c/td>\u003ctd>$99\u003c/td>\u003ctd>Assignment + SLA alerts\u003c/td>\u003ctd>3 days\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C3\u003c/td>\u003ctd>QueueFox\u003c/td>\u003ctd>$29\u003c/td>\u003ctd>Manual tags only\u003c/td>\u003ctd>2 hours\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C4\u003c/td>\u003ctd>ReplyHarbor\u003c/td>\u003ctd>$149\u003c/td>\u003ctd>Routing + analytics\u003c/td>\u003ctd>5 days\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C5\u003c/td>\u003ctd>ServiceLark\u003c/td>\u003ctd>$79\u003c/td>\u003ctd>Assignment + analytics\u003c/td>\u003ctd>2 days\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hypothesis\u003c/td>\u003ctd>RelayDesk\u003c/td>\u003ctd>$59 planned\u003c/td>\u003ctd>Assignment + SLA alerts planned\u003c/td>\u003ctd>1-hour target\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">Shared inbox is listed for all rows. RelayDesk capabilities and price are planned; setup is a target. C3 is cheapest. C2 overlaps in feature names only. Only C1 explicitly excludes SLA alerts; omitted features are unknown. No market verification, parity or superiority is established.\u003c/p>\u003cdiv class=\"quote\">\u003cb>Lead message draft:\u003c/b> “A shared inbox designed to get small service teams assigning requests quickly.”\u003cbr>\u003cb>Supporting draft:\u003c/b> “Planned at $59/team/month, with assignment and SLA alerts.”\u003c/div>\u003c/section>\n\u003csection>\u003cdiv class=\"eyebrow\">05 / Cash allocation\u003c/div>\u003ch2>A capped learning budget\u003c/h2>\u003cdiv class=\"bar\" role=\"img\" aria-label=\"90 percent base plan, 10 percent contingency\">\u003cdiv>\u003c/div>\u003cdiv>\u003c/div>\u003c/div>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Category\u003c/th>\u003cth>Basis\u003c/th>\u003cth>Cap\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Pilot research honoraria\u003c/td>\u003ctd>10 teams × $60; compensate feedback, never positive reviews\u003c/td>\u003ctd>$600\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Onboarding assistance\u003c/td>\u003ctd>12 hours × $50; incremental support allowance\u003c/td>\u003ctd>$600\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Research / list preparation\u003c/td>\u003ctd>6 hours × $50; authorized sources only\u003c/td>\u003ctd>$300\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Demo and onboarding materials\u003c/td>\u003ctd>Fixed allowance\u003c/td>\u003ctd>$150\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pilot tools / infrastructure\u003c/td>\u003ctd>Fixed allowance; existing stack first\u003c/td>\u003ctd>$150\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Contingency\u003c/td>\u003ctd>Admin release only; included in hard ceiling\u003c/td>\u003ctd>$200\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cb>$1,800 base + $200 contingency = $2,000 total.\u003c/b> No money has been spent under this assignment. Planned ceiling per recruited team: $200 at ten teams; not observed acquisition cost.\u003c/p>\u003cp class=\"muted\">Internal planning time assumed in-kind; incremental paid assistance is included. Confirm this boundary before launch. Ledger would record commitments, paid amounts and remaining funds. Weekly envelopes do not add to this total.\u003c/p>\u003c/section>\n\u003csection>\u003cdiv class=\"eyebrow\">06 / Review and accountability\u003c/div>\u003ch2>Suggested roles, not assignments\u003c/h2>\u003cdiv class=\"grid\">\u003cdiv>\u003cp>\u003cb>Atlas:\u003c/b> accountable lead, offer approvals and recruitment gates.\u003cbr>\u003cb>Maker:\u003c/b> materials, onboarding and milestones.\u003cbr>\u003cb>Scout:\u003c/b> evidence caveats and positioning.\u003c/p>\u003c/div>\u003cdiv>\u003cp>\u003cb>Echo:\u003c/b> interviews and feedback.\u003cbr>\u003cb>Analyst:\u003c/b> funnel, activation and value assessment.\u003cbr>\u003cb>Ledger:\u003c/b> costs and budget checks.\u003cbr>\u003cb>Admin:\u003c/b> review and any later authorization.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"muted\">Proposed weekly review, W2 recovery decision and W4 decision memo. No schedules, recurring jobs, reporting relationships or extra tasks have been changed.\u003c/p>\u003c/section>\n\u003csection>\u003cdiv class=\"eyebrow\">07 / Risk register\u003c/div>\u003ch2>Triggers that change the plan\u003c/h2>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Risk\u003c/th>\u003cth>Trigger\u003c/th>\u003cth>Proposed response\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Recruitment shortfall\u003c/td>\u003ctd>Below 5 accepted by end of W2\u003c/td>\u003ctd>Atlas: review eligibility objections and shift remaining drafts to the better-performing message/channel. Do not relax eligibility or claim targets met.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Setup or feature gaps\u003c/td>\u003ctd>Workflow cannot be completed or setup median exceeds 60 min\u003c/td>\u003ctd>Maker: log failures and assistance; revise claims and onboarding. Pause invites if safe operation is unverified.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Signup without value\u003c/td>\u003ctd>Below 8 activations or 6 retained teams\u003c/td>\u003ctd>Analyst + Echo: interview drop-offs; report recruitment separately from demand. Extend learning only with Admin review.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Budget overrun\u003c/td>\u003ctd>Committed plus paid costs approach $1,800\u003c/td>\u003ctd>Ledger: stop new commitments; reserve requires Admin release. No paid ads.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Consent / privacy\u003c/td>\u003ctd>Unclear permission, retention or access rules\u003c/td>\u003ctd>Atlas: resolve pilot terms before outreach or real inbox connection; use test data in preparation.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Synthetic evidence\u003c/td>\u003ctd>Any fictional competitor card presented as market proof\u003c/td>\u003ctd>Scout: retain SAMPLE DATA labels and distinguish missing capabilities from explicit exclusions.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003csection>\u003cdiv class=\"eyebrow\">08 / Draft outreach · Not sent\u003c/div>\u003ch2>Permission first, evidence next\u003c/h2>\u003cdiv class=\"quote\">\u003cb>Draft A:\u003c/b> Hi [name], we're exploring RelayDesk, a shared inbox designed to help small service teams assign requests clearly. Would your team consider a short pilot and feedback session? We’re testing the workflow and setup experience; participation is optional. May I share the proposed pilot details?\u003c/div>\u003cp>\u003cb>Draft B:\u003c/b> Hi [name], we're testing a shared inbox with planned assignment and SLA alerts, with a future price hypothesis of $59/team/month. Would a time-limited evaluation be relevant to your team? We’d value candid feedback; there is no automatic charge.\u003c/p>\u003cp>\u003cb>Single follow-up, after 4–5 business days:\u003c/b> Following up once on the RelayDesk pilot invitation. If this is not relevant, no response is needed and we will stop following up.\u003c/p>\u003cp class=\"muted\">Drafts require later execution authorization and confirmed recipient permission and offer. No messaging, paid ads or purchased lists executed.\u003c/p>\u003c/section>\n\u003csection>\u003ch2>Measurement and source notes\u003c/h2>\u003cp>Proposed ledger: anonymous team ID, eligibility, channel and variant, invitation/call/acceptance/onboarding dates, activation steps and elapsed time, assistance and failures, activity dates, ownership result, continued-use request, price response, costs and evidence links. Report missing observations; agree access and retention before real data collection.\u003c/p>\u003cp class=\"muted\">Inputs: @art-md1646:launch-input and @art-md4685:competitor-research. The research contains an older source reference; this dashboard uses the current supplied input. Companion plan: @art-md0754:sample-data-relaydesk-launch-plan.\u003c/p>\u003cdetails>\u003csummary>Read the full planning notes and assumptions\u003c/summary>\u003cpre># SAMPLE DATA — RelayDesk four-week launch plan\n\n**DRAFT FOR ADMIN REVIEW · Proposed execution only · Launch date unset**\n\n## Objective and evidence\nRecruit **10 distinct eligible pilot teams by the end of relative Week 4**, within a **$2,000 cash ceiling**. This is a real planning deliverable based entirely on synthetic sample inputs, not an executed launch or real market validation.\n\nSources: launch-input.md (@art-md1646:launch-input) and competitor-research.md (@art-md4685:competitor-research). C1–C5 below are fictional supplied cards. The research report embeds an older launch-input reference; this plan uses the current supplied artifact reference. All RelayDesk price, capability and setup claims remain hypotheses.\n\n## Status and assumptions\nCompleted in this assignment: input review and preparation of this plan and its companion dashboard. No pilot recruitment, contact, spending, browsing, implementation or assignment creation occurred. No outcome measurements are available; targets below are not actuals. All named owners are suggestions, not completed or accepted assignments. Task @task-h1574 remains open for Admin review.\n\nWeek 1 begins only after Admin approves the offer, owners, capacity and execution scope. Existing internal planning time is assumed in-kind; incremental cash costs are budgeted below. Confirm this accounting boundary before launch. Proposed pilot offer: a free, time-limited evaluation through Week 4 with no automatic charge; $59/team/month is a future price hypothesis. Honoraria reward research participation regardless of feedback or purchase.\n\n## Eligibility, funnel and success criteria\nProposed eligibility: a small service team of 2–10 people, at least two participants, a shared request inbox, a named pilot lead with authority to participate, and a concrete ownership or follow-up problem. These are planning assumptions requiring approval.\n\nRecruitment counts only a unique team with explicit acceptance of pilot terms, an identified lead and a scheduled onboarding session. Deduplicate by organization/team; multiple contacts do not count twice. Proposed funnel: **120 distinct invited teams → 24 qualified discovery calls (20%) → 10 acceptances (41.7% of calls; 8.3% overall)**. These are unvalidated assumptions, not a forecast or guarantee. Channel mix: 60 permissioned warm introductions, 40 relevant community opt-ins under community rules, 20 partner referrals. No real prospect list exists yet; if channel access is unavailable, report a shortfall.\n\nSeparate outcome gates:\n- Recruitment: 10 eligible accepted teams by W4.\n- Activation: at least 8 of 10 complete inbox connection, teammate invitation, request assignment and a test SLA alert by W4.\n- Retention: at least 6 of 10 show team activity on two separate days in the seven days after activation; activate this cohort by W3 end to permit full observation.\n- Ownership clarity: at least 8 of 10 leads correctly identify a request owner in an unassisted exercise; record failed and untested cases.\n- Demand signal: at least 5 of 10 request continued use and state willingness to pay $59/month after use. Report stated preference separately from any future paid commitment; this is preliminary evidence, not validated revenue.\n- Setup hypothesis: record every attempt from setup start to the complete activation workflow, elapsed minutes, assistance, environment and failures. Report median, range and completion rate; test a ≤60-minute median among completers without excluding failed attempts from the completion denominator.\n\n## Weekly milestones — all proposed\n| Week | Focus | Proposed owners | Work | Weekly exit target | Cumulative accepted | Cash envelope |\n| --- | --- | --- | --- | --- | --- | --- |\n| 01 | Prepare &amp; qualify | Atlas + Maker | Define eligibility, approve pilot terms and data handling, test the activation workflow, draft two messages, and prepare 120 prospect records from authorized sources. | 30 draft invitations; 6 discovery calls; 2 accepted teams | 2 / 10 | $350 |\n| 02 | Recruit &amp; activate | Maker + Echo | After separate authorization, propose 40 invitations and one follow-up per non-responder after 4–5 business days. Run 8 discovery calls and guided onboarding. | 3 additional accepted; 4 cumulative activated | 5 / 10 | $500 |\n| 03 | Close the gap | Atlas + Maker | Propose 35 invitations and 8 discovery calls. Ask willing pilots for introductions only with consent. Compare message responses and fix recurring setup friction. | 3 additional accepted; 7 cumulative activated | 8 / 10 | $550 |\n| 04 | Confirm &amp; evaluate | Echo + Analyst + Ledger | Propose final 15 invitations and 2 discovery calls early in week. Confirm remaining teams; measure retained use, ownership clarity, price response and costs. | 2 additional accepted; 8 cumulative activated; decision memo | 10 / 10 | $400 |\nThe weekly envelopes sum to $1,800; the $200 reserve is held separately. They allocate the category budget below, not additional spending. W1 invitations and all subsequent external work are proposals contingent on later authorization. W1 proposed six calls yield two acceptances; W2 eight yield three; W3 eight yield three; W4 two yield two. The optimistic W4 close rate is a risk: prioritize acceptance before W4 and disclose any gap.\n\n## Positioning and fictional competitor table — SAMPLE DATA\nLead draft: “A shared inbox designed to get small service teams assigning requests quickly.”\nSupporting draft: “Planned at $59/team/month, with assignment and SLA alerts.”\nDo not claim proven one-hour setup, feature parity, savings or superiority.\nAll six rows describe shared inbox products; prices are USD/team/month.\n| Evidence | Product | Price | Listed workflow features | Listed setup / target |\n| --- | --- | --- | --- | --- |\n| C1 | InboxOak | $49 | Basic assignment; explicitly no SLA alerts | 1 day |\n| C2 | TeamWillow | $99 | Assignment + SLA alerts | 3 days |\n| C3 | QueueFox | $29 | Manual tags only | 2 hours |\n| C4 | ReplyHarbor | $149 | Routing + analytics | 5 days |\n| C5 | ServiceLark | $79 | Assignment + analytics | 2 days |\n| Hypothesis | RelayDesk | $59 planned | Assignment + SLA alerts planned | 1-hour target |\nC3 is the cheapest fictional card. C2 overlaps in named feature categories, not proven capability. Only C1 explicitly lacks SLA alerts; omissions elsewhere mean unknown. Routing/analytics for RelayDesk are unspecified. Setup measurement conditions for competitors are unknown.\n\n## Cash budget — proposed, no money spent\n| Category | Basis | Maximum |\n| --- | --- | --- |\n| Pilot research honoraria | 10 teams × $60; compensate feedback, never positive reviews | $600 |\n| Onboarding assistance | 12 hours × $50; incremental support allowance | $600 |\n| Research / list preparation | 6 hours × $50; authorized sources only | $300 |\n| Demo and onboarding materials | Fixed allowance | $150 |\n| Pilot tools / infrastructure | Fixed allowance; existing stack first | $150 |\n| Contingency | Admin release only; included in hard ceiling | $200 |\n**Base plan $1,800 + reserve $200 = hard cap $2,000.** At ten recruited teams, the ceiling is $200 per recruited team; this is a planning ratio, not observed acquisition cost. If fewer teams join, show actual cost per accepted and per activated team. Ledger would maintain committed, paid and remaining amounts before any proposed purchase.\n\n## Proposed ownership and review cadence\nAtlas: launch accountability, approvals and recruitment gates. Maker: launch materials, onboarding and milestone coordination. Scout: evidence and positioning caveats. Echo: pilot interviews and feedback capture. Analyst: funnel, activation and value analysis. Ledger: cost ledger and budget checks. Admin: review this plan and authorize any later execution. These roles create no host tasks or reporting changes.\nPropose a weekly internal review of funnel and budget, with a W2 recovery decision and a W4 proceed / iterate / stop memo. No schedule or recurring job is created.\n\n## Outreach drafts — not sent\n**Draft A / ownership:** “Hi [name], we're exploring RelayDesk, a shared inbox designed to help small service teams assign requests clearly. Would your team consider a short pilot and feedback session? We’re testing the workflow and setup experience; participation is optional. May I share the proposed pilot details?”\n**Draft B / offer:** “Hi [name], we're testing a shared inbox with planned assignment and SLA alerts, with a future price hypothesis of $59/team/month. Would a time-limited evaluation be relevant to your team? We’d value candid feedback; there is no automatic charge.”\n**One follow-up draft:** “Following up once on the RelayDesk pilot invitation. If this is not relevant, no response is needed and we will stop following up.”\nUse only after execution authorization, confirmed offer and applicable recipient permission. No mass sends, purchased lists or paid advertising.\n\n## Measurement and decision\nProposed ledger fields: anonymous team ID, eligibility evidence, channel, message variant, invitation date, call date, acceptance/terms date, onboarding date, activation steps, elapsed time, assistance/failure reason, activity dates, ownership result, continued-use request, stated price response, costs and evidence link. Store minimum necessary information with agreed access and retention. Track counts and denominators weekly; report missing data explicitly. Small samples support directional learning only.\n\nProceed recommendation requires recruitment and budget gates plus the activation, retention and demand thresholds above. If recruitment succeeds but value gates fail, report “recruitment achieved; demand inconclusive” and propose iteration. If recruitment or budget fails, report the objective unmet. Admin makes the subsequent decision; this document triggers no action.\n\n## Risks and responses\n| Risk | Trigger | Proposed response / owner |\n| --- | --- | --- |\n| Recruitment shortfall | Below 5 accepted by end of W2 | Atlas: review eligibility objections and shift remaining drafts to the better-performing message/channel. Do not relax eligibility or claim targets met. |\n| Setup or feature gaps | Workflow cannot be completed or setup median exceeds 60 min | Maker: log failures and assistance; revise claims and onboarding. Pause invites if safe operation is unverified. |\n| Signup without value | Below 8 activations or 6 retained teams | Analyst + Echo: interview drop-offs; report recruitment separately from demand. Extend learning only with Admin review. |\n| Budget overrun | Committed plus paid costs approach $1,800 | Ledger: stop new commitments; reserve requires Admin release. No paid ads. |\n| Consent / privacy | Unclear permission, retention or access rules | Atlas: resolve pilot terms before outreach or real inbox connection; use test data in preparation. |\n| Synthetic evidence | Any fictional competitor card presented as market proof | Scout: retain SAMPLE DATA labels and distinguish missing capabilities from explicit exclusions. |\n\n## Admin review\nReview eligibility, pilot terms, owner availability, cash/in-kind accounting and success thresholds before execution. This task remains open; no external actions or additional host tasks are authorized by these drafts.\n\u003c/pre>\u003c/details>\u003c/section>\n\u003cfooter>SAMPLE DATA · Synthetic inputs, real planning deliverables · Prepared for Admin review · All launch work remains proposed · No external assets, scripts or network dependencies\u003c/footer>\n\u003c/main>\u003c/body>\u003c/html>"},{"id":"art-md0342","owner":"sapi_543b6c414819","filename":"feedback-report.md","title":"SAMPLE DATA — Feedback report","reference":"@art-md0342:sample-data-feedback-report","content":"# SAMPLE DATA — Feedback priorities\n\nSynthetic customer feedback; not real customers. Prepared 18 September 2026. Review status: awaiting Admin review.\n\n## Decision brief\n\nCSV export leads (score 8; three accounts), followed by duplicate notifications (6; two accounts), dashboard performance (5; two accounts), assignment onboarding (4; two accounts), and dark theme (1; one account). The top two themes cover five of the ten issue/request accounts in this sample.\n\n## Sample overview\n\n12 records · 11 unique accounts · 11 issue/request records from 10 accounts · 5 issue/request themes · 1 positive record from 1 account.\n\n## Ranking method\n\nRank issue/request themes by severity-weighted account score: sum the maximum source severity for each unique account within the theme (equivalently, unique accounts × mean account severity). This balances frequency and severity without letting repeat posts inflate rank. Ties use unique accounts, then maximum severity, then theme name. Severity: 0 positive, 1 minor, 2 moderate, 3 major. Positive feedback is excluded from the backlog. These are sample-only priorities, not population estimates or delivery commitments.\n\nF01 and F11 are both A01: four CSV records represent three accounts and score 8, not 11. Frequency percentages use all 11 unique sample accounts; 10 accounts supplied issues/requests. No effort estimates, deadlines, or named accountable owners were supplied. All owners below are proposed functional roles; no assignments have been created and no product work is claimed complete.\n\n## Ranked themes\n\n| Rank | Theme | Records | Unique accounts | Share of 11 accounts | Mean account severity | Major accounts | Score | Evidence IDs |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| 1 | CSV export availability | 4 | 3 | 27.3% | 2.67 | 2 | 8 | F01, F02, F03, F11 |\n| 2 | Duplicate notifications | 2 | 2 | 18.2% | 3.00 | 2 | 6 | F09, F10 |\n| 3 | Dashboard loading performance | 2 | 2 | 18.2% | 2.50 | 1 | 5 | F04, F05 |\n| 4 | First-task assignment onboarding | 2 | 2 | 18.2% | 2.00 | 0 | 4 | F06, F07 |\n| 5 | Dark theme request | 1 | 1 | 9.1% | 1.00 | 0 | 1 | F08 |\n\n## Proposed priority backlog\n\n### 1. CSV export availability — proposed\n\nProposed owner: Product + Reporting engineering. Evidence: F01, F02, F03, F11.\n\nDefine and implement CSV export for weekly reports and finance review.\n\nProposed verification: Verify exported fields and rows against the report; test a finance-review workflow.\n\nEffort: not estimated. Status: proposed; unassigned.\n\n### 2. Duplicate notifications — proposed\n\nProposed owner: Notifications engineering + QA. Evidence: F09, F10.\n\nReproduce duplicate task alerts and correct the triggering or delivery behavior.\n\nProposed verification: A controlled task event produces one intended alert; regression checks cover retries.\n\nEffort: not estimated. Status: proposed; unassigned.\n\n### 3. Dashboard loading performance — proposed\n\nProposed owner: Frontend + Backend engineering. Evidence: F04, F05.\n\nReproduce the reported 500-item load and profile the slow path.\n\nProposed verification: Measure the same workload before and after changes; agree a load-time target before implementation.\n\nEffort: not estimated. Status: proposed; unassigned.\n\n### 4. First-task assignment onboarding — proposed\n\nProposed owner: Product design + Onboarding engineering. Evidence: F06, F07.\n\nAdd a first-task assignment example and validate the flow.\n\nProposed verification: Observe a new-user test completing an assignment; agree success criteria before rollout.\n\nEffort: not estimated. Status: proposed; unassigned.\n\n### 5. Dark theme request — proposed\n\nProposed owner: Product design. Evidence: F08.\n\nValidate demand and accessibility needs before committing to a dark theme.\n\nProposed verification: Document validated requirements and an explicit build/defer decision.\n\nEffort: not estimated. Status: proposed; unassigned.\n\n## Positive signal\n\nF12 · A11 · severity 0: “Task ownership is clear and saves us time.” Preserve this strength when changing onboarding; it is not an issue or a completed assignment.\n\n## Evidence ledger\n\n| ID | Account | Severity | Theme | Verbatim sample feedback |\n| --- | --- | --- | --- | --- |\n| F01 | A01 | 3 | CSV export availability | We cannot export the weekly report as CSV. |\n| F02 | A02 | 3 | CSV export availability | CSV export is missing; copying results takes an hour. |\n| F03 | A03 | 2 | CSV export availability | Need CSV export for our finance review. |\n| F04 | A04 | 3 | Dashboard loading performance | The dashboard takes 15 seconds to load with 500 items. |\n| F05 | A05 | 2 | Dashboard loading performance | Dashboard loading is slow on large projects. |\n| F06 | A06 | 2 | First-task assignment onboarding | New teammates do not know how to assign their first task. |\n| F07 | A07 | 2 | First-task assignment onboarding | The first-run onboarding has no assignment example. |\n| F08 | A08 | 1 | Dark theme request | I need a dark theme. |\n| F09 | A09 | 3 | Duplicate notifications | Alerts about the same task are sent twice. |\n| F10 | A10 | 3 | Duplicate notifications | Duplicate notifications make me miss important updates. |\n| F11 | A01 | 3 | CSV export availability | Following up on CSV export, still waiting. |\n| F12 | A11 | 0 | Clear task ownership | Task ownership is clear and saves us time. |\n\n## Provenance and limitations\n\nSources: feedback-input.json (@art-json8097:feedback-input) and feedback-evidence.json (@art-json6046:feedback-evidence). All 12 evidence records were reconciled with the input for ID, account, text and severity; theme counts and account sets were recomputed. The evidence file contains a different upstream source reference (@art-json7990:feedback-input); this analysis uses the supplied local input, whose records match.\n\nSmall synthetic sample; no real customer demand, revenue impact, prevalence, or implementation cost can be inferred. Severity is source-provided and has not been independently validated.\n","previewHtml":"\u003c!doctype html>\u003cmeta charset=\"utf-8\">\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'\">\n\u003ctitle>feedback-report.md\u003c/title>\u003cstyle>body{max-width:850px;margin:32px auto;padding:0 24px;font:16px/1.6 system-ui;color:#202030;background:#faf9f6}.line{white-space:pre-wrap;overflow-wrap:anywhere}pre{white-space:pre-wrap;background:#eeebf3;padding:16px}h1,h2,h3{line-height:1.2}a{color:#7435b8;overflow-wrap:anywhere}code{background:#eeebf3;padding:2px 4px}\u003c/style>\u003ch1>SAMPLE DATA — Feedback priorities\u003c/h1>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Synthetic customer feedback; not real customers. Prepared 18 September 2026. Review status: awaiting Admin review.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>Decision brief\u003c/h2>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">CSV export leads (score 8; three accounts), followed by duplicate notifications (6; two accounts), dashboard performance (5; two accounts), assignment onboarding (4; two accounts), and dark theme (1; one account). The top two themes cover five of the ten issue/request accounts in this sample.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>Sample overview\u003c/h2>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">12 records · 11 unique accounts · 11 issue/request records from 10 accounts · 5 issue/request themes · 1 positive record from 1 account.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>Ranking method\u003c/h2>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Rank issue/request themes by severity-weighted account score: sum the maximum source severity for each unique account within the theme (equivalently, unique accounts × mean account severity). This balances frequency and severity without letting repeat posts inflate rank. Ties use unique accounts, then maximum severity, then theme name. Severity: 0 positive, 1 minor, 2 moderate, 3 major. Positive feedback is excluded from the backlog. These are sample-only priorities, not population estimates or delivery commitments.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">F01 and F11 are both A01: four CSV records represent three accounts and score 8, not 11. Frequency percentages use all 11 unique sample accounts; 10 accounts supplied issues/requests. No effort estimates, deadlines, or named accountable owners were supplied. All owners below are proposed functional roles; no assignments have been created and no product work is claimed complete.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>Ranked themes\u003c/h2>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">| Rank | Theme | Records | Unique accounts | Share of 11 accounts | Mean account severity | Major accounts | Score | Evidence IDs |\u003c/div>\n\u003cdiv class=\"line\">| --- | --- | --- | --- | --- | --- | --- | --- | --- |\u003c/div>\n\u003cdiv class=\"line\">| 1 | CSV export availability | 4 | 3 | 27.3% | 2.67 | 2 | 8 | F01, F02, F03, F11 |\u003c/div>\n\u003cdiv class=\"line\">| 2 | Duplicate notifications | 2 | 2 | 18.2% | 3.00 | 2 | 6 | F09, F10 |\u003c/div>\n\u003cdiv class=\"line\">| 3 | Dashboard loading performance | 2 | 2 | 18.2% | 2.50 | 1 | 5 | F04, F05 |\u003c/div>\n\u003cdiv class=\"line\">| 4 | First-task assignment onboarding | 2 | 2 | 18.2% | 2.00 | 0 | 4 | F06, F07 |\u003c/div>\n\u003cdiv class=\"line\">| 5 | Dark theme request | 1 | 1 | 9.1% | 1.00 | 0 | 1 | F08 |\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>Proposed priority backlog\u003c/h2>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch3>1. CSV export availability — proposed\u003c/h3>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Proposed owner: Product + Reporting engineering. Evidence: F01, F02, F03, F11.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Define and implement CSV export for weekly reports and finance review.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Proposed verification: Verify exported fields and rows against the report; test a finance-review workflow.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Effort: not estimated. Status: proposed; unassigned.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch3>2. Duplicate notifications — proposed\u003c/h3>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Proposed owner: Notifications engineering + QA. Evidence: F09, F10.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Reproduce duplicate task alerts and correct the triggering or delivery behavior.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Proposed verification: A controlled task event produces one intended alert; regression checks cover retries.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Effort: not estimated. Status: proposed; unassigned.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch3>3. Dashboard loading performance — proposed\u003c/h3>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Proposed owner: Frontend + Backend engineering. Evidence: F04, F05.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Reproduce the reported 500-item load and profile the slow path.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Proposed verification: Measure the same workload before and after changes; agree a load-time target before implementation.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Effort: not estimated. Status: proposed; unassigned.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch3>4. First-task assignment onboarding — proposed\u003c/h3>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Proposed owner: Product design + Onboarding engineering. Evidence: F06, F07.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Add a first-task assignment example and validate the flow.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Proposed verification: Observe a new-user test completing an assignment; agree success criteria before rollout.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Effort: not estimated. Status: proposed; unassigned.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch3>5. Dark theme request — proposed\u003c/h3>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Proposed owner: Product design. Evidence: F08.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Validate demand and accessibility needs before committing to a dark theme.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Proposed verification: Document validated requirements and an explicit build/defer decision.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Effort: not estimated. Status: proposed; unassigned.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>Positive signal\u003c/h2>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">F12 · A11 · severity 0: “Task ownership is clear and saves us time.” Preserve this strength when changing onboarding; it is not an issue or a completed assignment.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>Evidence ledger\u003c/h2>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">| ID | Account | Severity | Theme | Verbatim sample feedback |\u003c/div>\n\u003cdiv class=\"line\">| --- | --- | --- | --- | --- |\u003c/div>\n\u003cdiv class=\"line\">| F01 | A01 | 3 | CSV export availability | We cannot export the weekly report as CSV. |\u003c/div>\n\u003cdiv class=\"line\">| F02 | A02 | 3 | CSV export availability | CSV export is missing; copying results takes an hour. |\u003c/div>\n\u003cdiv class=\"line\">| F03 | A03 | 2 | CSV export availability | Need CSV export for our finance review. |\u003c/div>\n\u003cdiv class=\"line\">| F04 | A04 | 3 | Dashboard loading performance | The dashboard takes 15 seconds to load with 500 items. |\u003c/div>\n\u003cdiv class=\"line\">| F05 | A05 | 2 | Dashboard loading performance | Dashboard loading is slow on large projects. |\u003c/div>\n\u003cdiv class=\"line\">| F06 | A06 | 2 | First-task assignment onboarding | New teammates do not know how to assign their first task. |\u003c/div>\n\u003cdiv class=\"line\">| F07 | A07 | 2 | First-task assignment onboarding | The first-run onboarding has no assignment example. |\u003c/div>\n\u003cdiv class=\"line\">| F08 | A08 | 1 | Dark theme request | I need a dark theme. |\u003c/div>\n\u003cdiv class=\"line\">| F09 | A09 | 3 | Duplicate notifications | Alerts about the same task are sent twice. |\u003c/div>\n\u003cdiv class=\"line\">| F10 | A10 | 3 | Duplicate notifications | Duplicate notifications make me miss important updates. |\u003c/div>\n\u003cdiv class=\"line\">| F11 | A01 | 3 | CSV export availability | Following up on CSV export, still waiting. |\u003c/div>\n\u003cdiv class=\"line\">| F12 | A11 | 0 | Clear task ownership | Task ownership is clear and saves us time. |\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>Provenance and limitations\u003c/h2>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Sources: feedback-input.json (@art-json8097:feedback-input) and feedback-evidence.json (@art-json6046:feedback-evidence). All 12 evidence records were reconciled with the input for ID, account, text and severity; theme counts and account sets were recomputed. The evidence file contains a different upstream source reference (@art-json7990:feedback-input); this analysis uses the supplied local input, whose records match.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Small synthetic sample; no real customer demand, revenue impact, prevalence, or implementation cost can be inferred. Severity is source-provided and has not been independently validated.\u003c/div>"},{"id":"art-html8795","owner":"sapi_543b6c414819","filename":"results-dashboard.html","title":"SAMPLE DATA — Results dashboard","reference":"@art-html8795:sample-data-results-dashboard","content":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>SAMPLE DATA — Feedback priorities\u003c/title>\u003cstyle>\n:root{color-scheme:light;--ink:#172c3c;--muted:#536675;--line:#dce5e9;--accent:#087e83}*{box-sizing:border-box}body{margin:0;background:#f2f6f7;color:var(--ink);font:16px/1.6 system-ui,-apple-system,sans-serif}main{max-width:1240px;margin:auto;padding:40px 28px}header{background:#122e40;color:white;padding:38px;border-radius:20px}h1{font-size:clamp(30px,4vw,48px);line-height:1.12;margin:18px 0}h2{font-size:25px;letter-spacing:-.5px}h3{margin:10px 0;font-size:20px}p{margin:10px 0}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800}.sample{display:inline-block;background:#ffe1a0;color:#513705;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:800}header p{color:#d7e7ee;max-width:760px}nav{display:flex;gap:20px;flex-wrap:wrap;margin-top:24px}nav a{color:#a9f2ec;text-underline-offset:5px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0}.kpi,section{background:white;border:1px solid var(--line);border-radius:14px;padding:24px}.kpi strong{display:block;font-size:38px;line-height:1.2}.kpi span,.meta{color:var(--muted);font-size:14px}section{margin:22px 0}.lead{border-left:5px solid var(--accent)}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;text-align:left}th{background:#edf4f5;font-size:12px;color:#3b5665}th,td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}td:nth-child(2){min-width:115px}tbody tr:hover{background:#f6fafb}.pill{display:inline-block;background:#e7f3f1;color:#195e59;font-weight:800;font-size:10px;letter-spacing:.7px;padding:4px 8px;border-radius:5px}.backlog{display:grid;grid-template-columns:48px 1fr;gap:16px;padding:22px 0;border-top:1px solid var(--line)}.num{font-size:25px;color:var(--accent);font-weight:800}.positive{background:#eaf5ef}footer{font-size:13px;color:var(--muted);padding:10px 4px 30px}summary{cursor:pointer;font-weight:700}a:focus-visible,summary:focus-visible{outline:3px solid #de940d;outline-offset:4px}@media(max-width:700px){main{padding:18px 12px}header{padding:25px}.kpis{grid-template-columns:repeat(2,1fr)}section{padding:18px}.backlog{grid-template-columns:34px 1fr}}@media print{body{background:white}main{padding:0}header{background:white;color:var(--ink);border:1px solid var(--line)}header p{color:var(--muted)}nav{display:none}.scroll{overflow:visible}section,.backlog{break-inside:avoid}table{font-size:10px}th,td{padding:6px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\u003cheader>\u003cspan class=\"sample\">SAMPLE DATA · SYNTHETIC INPUTS\u003c/span>\u003ch1>What should come next?\u003c/h1>\u003cp>Feedback priorities grounded in unique accounts and source severity. A review-ready proposal; all backlog items and owners remain unassigned.\u003c/p>\u003cdiv class=\"eyebrow\">18 SEPTEMBER 2026 · AWAITING ADMIN REVIEW\u003c/div>\u003cnav aria-label=\"Sections\">\u003ca href=\"#ranking\">Ranked themes\u003c/a>\u003ca href=\"#backlog\">Proposed backlog\u003c/a>\u003ca href=\"#evidence\">Evidence ledger\u003c/a>\u003ca href=\"#method\">Method\u003c/a>\u003c/nav>\u003c/header>\u003cdiv class=\"kpis\">\u003carticle class=\"kpi\">\u003cstrong>12\u003c/strong>\u003cspan>Feedback records\u003c/span>\u003c/article>\u003carticle class=\"kpi\">\u003cstrong>11\u003c/strong>\u003cspan>Unique accounts\u003c/span>\u003c/article>\u003carticle class=\"kpi\">\u003cstrong>5\u003c/strong>\u003cspan>Issue / request themes\u003c/span>\u003c/article>\u003carticle class=\"kpi\">\u003cstrong>1\u003c/strong>\u003cspan>Positive signal\u003c/span>\u003c/article>\u003c/div>\u003csection class=\"lead\">\u003cspan class=\"eyebrow\">RECOMMENDED FIRST\u003c/span>\u003ch2>CSV export, then notification reliability\u003c/h2>\u003cp>CSV export scores \u003cb>8\u003c/b> across three accounts. Duplicate notifications scores \u003cb>6\u003c/b> across two accounts. Together they cover \u003cb>5 of 10 issue/request accounts\u003c/b> in this synthetic sample.\u003c/p>\u003cp class=\"meta\">11 issue/request records from 10 accounts; 1 positive record from 1 account. No implementation or assignments completed.\u003c/p>\u003c/section>\u003csection id=\"ranking\">\u003ch2>Theme ranking\u003c/h2>\u003cp class=\"meta\">Score = sum of per-account maximum severity. Share uses all 11 sample accounts.\u003c/p>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">Rank\u003c/th>\u003cth scope=\"col\">Theme\u003c/th>\u003cth scope=\"col\">Records\u003c/th>\u003cth scope=\"col\">Unique accounts\u003c/th>\u003cth scope=\"col\">Share of 11 accounts\u003c/th>\u003cth scope=\"col\">Mean account severity\u003c/th>\u003cth scope=\"col\">Major accounts\u003c/th>\u003cth scope=\"col\">Score\u003c/th>\u003cth scope=\"col\">Evidence IDs\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>1\u003c/td>\u003ctd>CSV export availability\u003c/td>\u003ctd>4\u003c/td>\u003ctd>3\u003c/td>\u003ctd>27.3%\u003c/td>\u003ctd>2.67\u003c/td>\u003ctd>2\u003c/td>\u003ctd>8\u003c/td>\u003ctd>F01, F02, F03, F11\u003c/td>\u003c/tr>\u003ctr>\u003ctd>2\u003c/td>\u003ctd>Duplicate notifications\u003c/td>\u003ctd>2\u003c/td>\u003ctd>2\u003c/td>\u003ctd>18.2%\u003c/td>\u003ctd>3.00\u003c/td>\u003ctd>2\u003c/td>\u003ctd>6\u003c/td>\u003ctd>F09, F10\u003c/td>\u003c/tr>\u003ctr>\u003ctd>3\u003c/td>\u003ctd>Dashboard loading performance\u003c/td>\u003ctd>2\u003c/td>\u003ctd>2\u003c/td>\u003ctd>18.2%\u003c/td>\u003ctd>2.50\u003c/td>\u003ctd>1\u003c/td>\u003ctd>5\u003c/td>\u003ctd>F04, F05\u003c/td>\u003c/tr>\u003ctr>\u003ctd>4\u003c/td>\u003ctd>First-task assignment onboarding\u003c/td>\u003ctd>2\u003c/td>\u003ctd>2\u003c/td>\u003ctd>18.2%\u003c/td>\u003ctd>2.00\u003c/td>\u003ctd>0\u003c/td>\u003ctd>4\u003c/td>\u003ctd>F06, F07\u003c/td>\u003c/tr>\u003ctr>\u003ctd>5\u003c/td>\u003ctd>Dark theme request\u003c/td>\u003ctd>1\u003c/td>\u003ctd>1\u003c/td>\u003ctd>9.1%\u003c/td>\u003ctd>1.00\u003c/td>\u003ctd>0\u003c/td>\u003ctd>1\u003c/td>\u003ctd>F08\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection id=\"backlog\">\u003ch2>Proposed priority backlog\u003c/h2>\u003cp class=\"meta\">Functional owners are suggestions. Effort and delivery dates are unknown.\u003c/p>\u003carticle class=\"backlog\">\u003cdiv class=\"num\">01\u003c/div>\u003cdiv>\u003cspan class=\"pill\">PROPOSED · UNASSIGNED\u003c/span>\u003ch3>CSV export availability\u003c/h3>\u003cp>Define and implement CSV export for weekly reports and finance review.\u003c/p>\u003cp class=\"meta\">\u003cb>Proposed owner:\u003c/b> Product + Reporting engineering\u003c/p>\u003cp>\u003cb>Verify:\u003c/b> Verify exported fields and rows against the report; test a finance-review workflow.\u003c/p>\u003cp class=\"meta\">Evidence: F01, F02, F03, F11 · Effort not estimated\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"backlog\">\u003cdiv class=\"num\">02\u003c/div>\u003cdiv>\u003cspan class=\"pill\">PROPOSED · UNASSIGNED\u003c/span>\u003ch3>Duplicate notifications\u003c/h3>\u003cp>Reproduce duplicate task alerts and correct the triggering or delivery behavior.\u003c/p>\u003cp class=\"meta\">\u003cb>Proposed owner:\u003c/b> Notifications engineering + QA\u003c/p>\u003cp>\u003cb>Verify:\u003c/b> A controlled task event produces one intended alert; regression checks cover retries.\u003c/p>\u003cp class=\"meta\">Evidence: F09, F10 · Effort not estimated\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"backlog\">\u003cdiv class=\"num\">03\u003c/div>\u003cdiv>\u003cspan class=\"pill\">PROPOSED · UNASSIGNED\u003c/span>\u003ch3>Dashboard loading performance\u003c/h3>\u003cp>Reproduce the reported 500-item load and profile the slow path.\u003c/p>\u003cp class=\"meta\">\u003cb>Proposed owner:\u003c/b> Frontend + Backend engineering\u003c/p>\u003cp>\u003cb>Verify:\u003c/b> Measure the same workload before and after changes; agree a load-time target before implementation.\u003c/p>\u003cp class=\"meta\">Evidence: F04, F05 · Effort not estimated\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"backlog\">\u003cdiv class=\"num\">04\u003c/div>\u003cdiv>\u003cspan class=\"pill\">PROPOSED · UNASSIGNED\u003c/span>\u003ch3>First-task assignment onboarding\u003c/h3>\u003cp>Add a first-task assignment example and validate the flow.\u003c/p>\u003cp class=\"meta\">\u003cb>Proposed owner:\u003c/b> Product design + Onboarding engineering\u003c/p>\u003cp>\u003cb>Verify:\u003c/b> Observe a new-user test completing an assignment; agree success criteria before rollout.\u003c/p>\u003cp class=\"meta\">Evidence: F06, F07 · Effort not estimated\u003c/p>\u003c/div>\u003c/article>\u003carticle class=\"backlog\">\u003cdiv class=\"num\">05\u003c/div>\u003cdiv>\u003cspan class=\"pill\">PROPOSED · UNASSIGNED\u003c/span>\u003ch3>Dark theme request\u003c/h3>\u003cp>Validate demand and accessibility needs before committing to a dark theme.\u003c/p>\u003cp class=\"meta\">\u003cb>Proposed owner:\u003c/b> Product design\u003c/p>\u003cp>\u003cb>Verify:\u003c/b> Document validated requirements and an explicit build/defer decision.\u003c/p>\u003cp class=\"meta\">Evidence: F08 · Effort not estimated\u003c/p>\u003c/div>\u003c/article>\u003c/section>\u003csection class=\"positive\">\u003cspan class=\"eyebrow\">PRESERVE THE POSITIVE\u003c/span>\u003ch2>Clear task ownership\u003c/h2>\u003cp>“Task ownership is clear and saves us time.”\u003c/p>\u003cp class=\"meta\">F12 · A11 · severity 0 · one record / one account. Keep this strength in view when changing onboarding.\u003c/p>\u003c/section>\u003csection id=\"evidence\">\u003ch2>Evidence ledger\u003c/h2>\u003cp class=\"meta\">Verbatim synthetic feedback. F01 and F11 come from the same account.\u003c/p>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth scope=\"col\">ID\u003c/th>\u003cth scope=\"col\">Account\u003c/th>\u003cth scope=\"col\">Severity\u003c/th>\u003cth scope=\"col\">Sample feedback\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr id=\"F01\">\u003ctd>\u003cb>F01\u003c/b>\u003c/td>\u003ctd>A01\u003c/td>\u003ctd>3\u003c/td>\u003ctd>We cannot export the weekly report as CSV.\u003c/td>\u003c/tr>\u003ctr id=\"F02\">\u003ctd>\u003cb>F02\u003c/b>\u003c/td>\u003ctd>A02\u003c/td>\u003ctd>3\u003c/td>\u003ctd>CSV export is missing; copying results takes an hour.\u003c/td>\u003c/tr>\u003ctr id=\"F03\">\u003ctd>\u003cb>F03\u003c/b>\u003c/td>\u003ctd>A03\u003c/td>\u003ctd>2\u003c/td>\u003ctd>Need CSV export for our finance review.\u003c/td>\u003c/tr>\u003ctr id=\"F04\">\u003ctd>\u003cb>F04\u003c/b>\u003c/td>\u003ctd>A04\u003c/td>\u003ctd>3\u003c/td>\u003ctd>The dashboard takes 15 seconds to load with 500 items.\u003c/td>\u003c/tr>\u003ctr id=\"F05\">\u003ctd>\u003cb>F05\u003c/b>\u003c/td>\u003ctd>A05\u003c/td>\u003ctd>2\u003c/td>\u003ctd>Dashboard loading is slow on large projects.\u003c/td>\u003c/tr>\u003ctr id=\"F06\">\u003ctd>\u003cb>F06\u003c/b>\u003c/td>\u003ctd>A06\u003c/td>\u003ctd>2\u003c/td>\u003ctd>New teammates do not know how to assign their first task.\u003c/td>\u003c/tr>\u003ctr id=\"F07\">\u003ctd>\u003cb>F07\u003c/b>\u003c/td>\u003ctd>A07\u003c/td>\u003ctd>2\u003c/td>\u003ctd>The first-run onboarding has no assignment example.\u003c/td>\u003c/tr>\u003ctr id=\"F08\">\u003ctd>\u003cb>F08\u003c/b>\u003c/td>\u003ctd>A08\u003c/td>\u003ctd>1\u003c/td>\u003ctd>I need a dark theme.\u003c/td>\u003c/tr>\u003ctr id=\"F09\">\u003ctd>\u003cb>F09\u003c/b>\u003c/td>\u003ctd>A09\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Alerts about the same task are sent twice.\u003c/td>\u003c/tr>\u003ctr id=\"F10\">\u003ctd>\u003cb>F10\u003c/b>\u003c/td>\u003ctd>A10\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Duplicate notifications make me miss important updates.\u003c/td>\u003c/tr>\u003ctr id=\"F11\">\u003ctd>\u003cb>F11\u003c/b>\u003c/td>\u003ctd>A01\u003c/td>\u003ctd>3\u003c/td>\u003ctd>Following up on CSV export, still waiting.\u003c/td>\u003c/tr>\u003ctr id=\"F12\">\u003ctd>\u003cb>F12\u003c/b>\u003c/td>\u003ctd>A11\u003c/td>\u003ctd>0\u003c/td>\u003ctd>Task ownership is clear and saves us time.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\u003csection id=\"method\">\u003ch2>Method & limitations\u003c/h2>\u003cp>Rank issue/request themes by severity-weighted account score: sum the maximum source severity for each unique account within the theme (equivalently, unique accounts × mean account severity). This balances frequency and severity without letting repeat posts inflate rank. Ties use unique accounts, then maximum severity, then theme name. Severity: 0 positive, 1 minor, 2 moderate, 3 major. Positive feedback is excluded from the backlog. These are sample-only priorities, not population estimates or delivery commitments.\u003c/p>\u003cp>F01 and F11 are both A01: four CSV records represent three accounts and score 8, not 11. Frequency percentages use all 11 unique sample accounts; 10 accounts supplied issues/requests. No effort estimates, deadlines, or named accountable owners were supplied. All owners below are proposed functional roles; no assignments have been created and no product work is claimed complete.\u003c/p>\u003cdetails>\u003csummary>Source reconciliation\u003c/summary>\u003cp>Sources: feedback-input.json (@art-json8097:feedback-input) and feedback-evidence.json (@art-json6046:feedback-evidence). All 12 evidence records were reconciled with the input for ID, account, text and severity; theme counts and account sets were recomputed. The evidence file contains a different upstream source reference (@art-json7990:feedback-input); this analysis uses the supplied local input, whose records match.\u003c/p>\u003c/details>\u003cp class=\"meta\">Small synthetic sample; no real customer demand, revenue impact, prevalence, or implementation cost can be inferred. Severity is source-provided and not independently validated.\u003c/p>\u003c/section>\u003cfooter>\u003cb>SAMPLE DATA\u003c/b> · Not real customers · Admin review pending · Proposed work only\u003c/footer>\u003c/main>\u003c/body>\u003c/html>"},{"id":"art-html7243","owner":"sapi_07e6a1f92000","filename":"launch-dashboard.html","title":"Product launch","reference":"@art-html7243:product-launch","content":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>SAMPLE DATA — RelayDesk launch dashboard\u003c/title>\n\u003cstyle>\n:root{--bg:#f3f5f0;--ink:#182e2c;--muted:#506661;--line:#d7dfd9;--accent:#146956;--lime:#d8ee98}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif}main{max-width:1220px;margin:auto;padding:36px 28px 64px}header{background:var(--ink);color:#fff;padding:42px;border-radius:24px;position:relative}h1{font-size:clamp(34px,5vw,60px);line-height:1.05;letter-spacing:-2px;margin:20px 0}h2{font-size:25px;letter-spacing:-.6px;margin:0 0 16px}h3{font-size:18px;line-height:1.3;margin:10px 0}p{margin:8px 0 14px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:2px;text-transform:uppercase}.badge{display:inline-block;border-radius:99px;padding:6px 12px;font-weight:750;font-size:12px;background:var(--lime);color:var(--ink)}header p{max-width:790px;color:#d5e3de}.headerline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.meta{font-size:13px;color:#d5e3de}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.stat,.card,section{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}.stat strong{display:block;font-size:34px;letter-spacing:-1px}.stat span,.muted{color:var(--muted);font-size:13px}section{margin:22px 0}.notice{border-left:4px solid var(--accent);padding:14px 18px;background:#e6eee5;border-radius:4px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.week{background:#f5f7f2;border-radius:14px;padding:20px;border:1px solid var(--line)}.number{font-size:36px;color:var(--accent);font-weight:800}.week p{font-size:13px}.target{border-top:1px solid var(--line);padding-top:12px;font-weight:750}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);background:#f5f7f2}th,td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}tbody tr:last-child td{border-bottom:0}.funnel{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.step{flex:1;min-width:170px;background:#eaf1e7;border-radius:12px;padding:20px}.step b{display:block;font-size:30px}.bar{display:flex;height:18px;border-radius:99px;overflow:hidden;margin:20px 0}.bar div:first-child{width:90%;background:var(--accent)}.bar div:last-child{width:10%;background:#afc86d}.quote{background:#f5f7f2;padding:20px;border-radius:12px}details{margin-top:20px}summary{cursor:pointer;font-weight:700;color:var(--accent)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 system-ui,sans-serif;border-top:1px solid var(--line);padding-top:16px}footer{font-size:12px;color:var(--muted);margin-top:26px}ul{padding-left:20px}li{margin:8px 0}@media(max-width:900px){.weeks,.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){main{padding:16px}header{padding:26px}section{padding:20px}.grid,.weeks,.stats{grid-template-columns:1fr}h1{letter-spacing:-1px}}@media print{body{background:white}main{padding:0}header{background:white;color:var(--ink);border:1px solid var(--line)}header p,.meta{color:var(--muted)}section,.week{break-inside:avoid}.weeks{grid-template-columns:repeat(2,1fr)}details{display:none}}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\n\u003cheader>\u003cdiv class=\"headerline\">\u003cspan class=\"badge\">SAMPLE DATA\u003c/span>\u003cspan class=\"meta\">REVIEW DRAFT · RELATIVE WEEKS · NO LAUNCH DATE\u003c/span>\u003c/div>\u003cdiv class=\"eyebrow\" style=\"margin-top:32px\">RelayDesk / Pilot launch proposal\u003c/div>\u003ch1>Ten teams.\u003cbr>Four weeks. Clear evidence.\u003c/h1>\u003cp>Test whether a shared inbox designed for fast setup and clear ownership earns continued use from small service teams. Every product claim, funnel rate and outcome shown here is a hypothesis or target.\u003c/p>\u003c/header>\n\u003cdiv class=\"stats\">\u003cdiv class=\"stat\">\u003cspan>RECRUITMENT TARGET\u003c/span>\u003cstrong>10 teams\u003c/strong>\u003cspan>Eligible + accepted + onboarding booked\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>TIME HORIZON\u003c/span>\u003cstrong>4 weeks\u003c/strong>\u003cspan>Start after scope and owners are approved\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>HARD CASH CEILING\u003c/span>\u003cstrong>$2,000\u003c/strong>\u003cspan>$1,800 base + $200 reserve\u003c/span>\u003c/div>\u003cdiv class=\"stat\">\u003cspan>EXECUTION STATUS\u003c/span>\u003cstrong style=\"font-size:26px\">Not started\u003c/strong>\u003cspan>No measured launch outcomes\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"notice\">\u003cb>Prepared:\u003c/b> input review, launch plan and this dashboard. \u003cb>Proposed only:\u003c/b> outreach, pilot activity, spending and owner roles. No assignments were created. Task @task-h1574 stays open for Admin review. All supplied competitor cards are fictional.\u003c/div>\n\u003csection>\u003cdiv class=\"eyebrow\">01 / Acquisition assumptions\u003c/div>\u003ch2>A measurable path to ten teams\u003c/h2>\u003cdiv class=\"funnel\">\u003cdiv class=\"step\">\u003cb>120\u003c/b>Distinct invited teams\u003c/div>\u003cspan aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"step\">\u003cb>24\u003c/b>Qualified discovery calls · 20%\u003c/div>\u003cspan aria-hidden=\"true\">→\u003c/span>\u003cdiv class=\"step\">\u003cb>10\u003c/b>Accepted pilots · 41.7% of calls\u003c/div>\u003c/div>\u003cp class=\"muted\">Planning math, not a forecast: 8.3% overall conversion. Proposed mix: 60 permissioned warm introductions / 40 community opt-ins / 20 partner referrals. No prospect list exists yet.\u003c/p>\u003cdiv class=\"grid\">\u003cdiv>\u003ch3>Who qualifies?\u003c/h3>\u003cp>A 2–10-person service team, at least two participants, a shared request inbox, a named authorized lead and a concrete ownership or follow-up problem. Count a unique team only after terms acceptance and booked onboarding.\u003c/p>\u003c/div>\u003cdiv>\u003ch3>What is the offer?\u003c/h3>\u003cp>Proposed free evaluation through W4; no automatic charge. Future price hypothesis: $59/team/month. Research honoraria are independent of positive feedback or purchase. Admin reviews terms before any execution.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection>\u003cdiv class=\"eyebrow\">02 / Four-week sequence\u003c/div>\u003ch2>Milestones and suggested owners\u003c/h2>\u003cdiv class=\"weeks\">\u003carticle class=\"week\">\u003cdiv class=\"number\">01\u003c/div>\u003ch3>Prepare &amp; qualify\u003c/h3>\u003cp>\u003cb>Proposed:\u003c/b> Atlas + Maker\u003c/p>\u003cp>Define eligibility, approve pilot terms and data handling, test the activation workflow, draft two messages, and prepare 120 prospect records from authorized sources.\u003c/p>\u003cp>30 draft invitations; 6 discovery calls; 2 accepted teams\u003c/p>\u003cdiv class=\"target\">2 / 10 cumulative teams\u003c/div>\u003cp class=\"muted\">$350 weekly envelope\u003c/p>\u003c/article>\u003carticle class=\"week\">\u003cdiv class=\"number\">02\u003c/div>\u003ch3>Recruit &amp; activate\u003c/h3>\u003cp>\u003cb>Proposed:\u003c/b> Maker + Echo\u003c/p>\u003cp>After separate authorization, propose 40 invitations and one follow-up per non-responder after 4–5 business days. Run 8 discovery calls and guided onboarding.\u003c/p>\u003cp>3 additional accepted; 4 cumulative activated\u003c/p>\u003cdiv class=\"target\">5 / 10 cumulative teams\u003c/div>\u003cp class=\"muted\">$500 weekly envelope\u003c/p>\u003c/article>\u003carticle class=\"week\">\u003cdiv class=\"number\">03\u003c/div>\u003ch3>Close the gap\u003c/h3>\u003cp>\u003cb>Proposed:\u003c/b> Atlas + Maker\u003c/p>\u003cp>Propose 35 invitations and 8 discovery calls. Ask willing pilots for introductions only with consent. Compare message responses and fix recurring setup friction.\u003c/p>\u003cp>3 additional accepted; 7 cumulative activated\u003c/p>\u003cdiv class=\"target\">8 / 10 cumulative teams\u003c/div>\u003cp class=\"muted\">$550 weekly envelope\u003c/p>\u003c/article>\u003carticle class=\"week\">\u003cdiv class=\"number\">04\u003c/div>\u003ch3>Confirm &amp; evaluate\u003c/h3>\u003cp>\u003cb>Proposed:\u003c/b> Echo + Analyst + Ledger\u003c/p>\u003cp>Propose final 15 invitations and 2 discovery calls early in week. Confirm remaining teams; measure retained use, ownership clarity, price response and costs.\u003c/p>\u003cp>2 additional accepted; 8 cumulative activated; decision memo\u003c/p>\u003cdiv class=\"target\">10 / 10 cumulative teams\u003c/div>\u003cp class=\"muted\">$400 weekly envelope\u003c/p>\u003c/article>\u003c/div>\u003cp class=\"muted\">W1 additionally proposes 30 invitations and 6 calls. W2: 40 / 8; W3: 35 / 8; W4: 15 / 2. New acceptance targets: 2 / 3 / 3 / 2. W4 assumes both calls close, so prioritize earlier acceptance. Envelopes total $1,800 and allocate, rather than add to, the budget below.\u003c/p>\u003c/section>\n\u003csection>\u003cdiv class=\"eyebrow\">03 / Evidence gates\u003c/div>\u003ch2>Recruitment alone does not prove demand\u003c/h2>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Metric\u003c/th>\u003cth>Proposed W4 threshold\u003c/th>\u003cth>Evidence\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Recruitment\u003c/td>\u003ctd>10 distinct eligible teams\u003c/td>\u003ctd>Accepted terms + lead + booked onboarding\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Activation\u003c/td>\u003ctd>At least 8 of 10\u003c/td>\u003ctd>Inbox connected, teammate added, request assigned, test SLA alert\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Retained use\u003c/td>\u003ctd>At least 6 of 10\u003c/td>\u003ctd>Activity on two separate days in seven days after activation; cohort activated by W3 end\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Ownership clarity\u003c/td>\u003ctd>At least 8 of 10 leads\u003c/td>\u003ctd>Identify a request owner without facilitator assistance; untested cases disclosed\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Preliminary demand\u003c/td>\u003ctd>At least 5 of 10\u003c/td>\u003ctd>Request continued use and state willingness to pay $59/month after use; no revenue implied\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Setup hypothesis\u003c/td>\u003ctd>Median ≤60 min among completers\u003c/td>\u003ctd>Every attempt recorded; show range, assistance, failures and completion denominator\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Budget\u003c/td>\u003ctd>Committed + paid ≤$2,000\u003c/td>\u003ctd>Cash ledger; $200 reserve released only by Admin\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">Proceed only if recruitment, budget and value gates are met. If recruitment succeeds but value gates fail: “recruitment achieved; demand inconclusive.” Admin decides whether to proceed, iterate or stop. Small samples support directional learning.\u003c/p>\u003c/section>\n\u003csection>\u003cdiv class=\"eyebrow\">04 / Fictional comparison · SAMPLE DATA\u003c/div>\u003ch2>Compete on a hypothesis; test the promise\u003c/h2>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Evidence\u003c/th>\u003cth>Product\u003c/th>\u003cth>USD / team / month\u003c/th>\u003cth>Listed workflow features\u003c/th>\u003cth>Setup\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>C1\u003c/td>\u003ctd>InboxOak\u003c/td>\u003ctd>$49\u003c/td>\u003ctd>Basic assignment; explicitly no SLA alerts\u003c/td>\u003ctd>1 day\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C2\u003c/td>\u003ctd>TeamWillow\u003c/td>\u003ctd>$99\u003c/td>\u003ctd>Assignment + SLA alerts\u003c/td>\u003ctd>3 days\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C3\u003c/td>\u003ctd>QueueFox\u003c/td>\u003ctd>$29\u003c/td>\u003ctd>Manual tags only\u003c/td>\u003ctd>2 hours\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C4\u003c/td>\u003ctd>ReplyHarbor\u003c/td>\u003ctd>$149\u003c/td>\u003ctd>Routing + analytics\u003c/td>\u003ctd>5 days\u003c/td>\u003c/tr>\u003ctr>\u003ctd>C5\u003c/td>\u003ctd>ServiceLark\u003c/td>\u003ctd>$79\u003c/td>\u003ctd>Assignment + analytics\u003c/td>\u003ctd>2 days\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Hypothesis\u003c/td>\u003ctd>RelayDesk\u003c/td>\u003ctd>$59 planned\u003c/td>\u003ctd>Assignment + SLA alerts planned\u003c/td>\u003ctd>1-hour target\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp class=\"muted\">Shared inbox is listed for all rows. RelayDesk capabilities and price are planned; setup is a target. C3 is cheapest. C2 overlaps in feature names only. Only C1 explicitly excludes SLA alerts; omitted features are unknown. No market verification, parity or superiority is established.\u003c/p>\u003cdiv class=\"quote\">\u003cb>Lead message draft:\u003c/b> “A shared inbox designed to get small service teams assigning requests quickly.”\u003cbr>\u003cb>Supporting draft:\u003c/b> “Planned at $59/team/month, with assignment and SLA alerts.”\u003c/div>\u003c/section>\n\u003csection>\u003cdiv class=\"eyebrow\">05 / Cash allocation\u003c/div>\u003ch2>A capped learning budget\u003c/h2>\u003cdiv class=\"bar\" role=\"img\" aria-label=\"90 percent base plan, 10 percent contingency\">\u003cdiv>\u003c/div>\u003cdiv>\u003c/div>\u003c/div>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Category\u003c/th>\u003cth>Basis\u003c/th>\u003cth>Cap\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Pilot research honoraria\u003c/td>\u003ctd>10 teams × $60; compensate feedback, never positive reviews\u003c/td>\u003ctd>$600\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Onboarding assistance\u003c/td>\u003ctd>12 hours × $50; incremental support allowance\u003c/td>\u003ctd>$600\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Research / list preparation\u003c/td>\u003ctd>6 hours × $50; authorized sources only\u003c/td>\u003ctd>$300\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Demo and onboarding materials\u003c/td>\u003ctd>Fixed allowance\u003c/td>\u003ctd>$150\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Pilot tools / infrastructure\u003c/td>\u003ctd>Fixed allowance; existing stack first\u003c/td>\u003ctd>$150\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Contingency\u003c/td>\u003ctd>Admin release only; included in hard ceiling\u003c/td>\u003ctd>$200\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>\u003cb>$1,800 base + $200 contingency = $2,000 total.\u003c/b> No money has been spent under this assignment. Planned ceiling per recruited team: $200 at ten teams; not observed acquisition cost.\u003c/p>\u003cp class=\"muted\">Internal planning time assumed in-kind; incremental paid assistance is included. Confirm this boundary before launch. Ledger would record commitments, paid amounts and remaining funds. Weekly envelopes do not add to this total.\u003c/p>\u003c/section>\n\u003csection>\u003cdiv class=\"eyebrow\">06 / Review and accountability\u003c/div>\u003ch2>Suggested roles, not assignments\u003c/h2>\u003cdiv class=\"grid\">\u003cdiv>\u003cp>\u003cb>Atlas:\u003c/b> accountable lead, offer approvals and recruitment gates.\u003cbr>\u003cb>Maker:\u003c/b> materials, onboarding and milestones.\u003cbr>\u003cb>Scout:\u003c/b> evidence caveats and positioning.\u003c/p>\u003c/div>\u003cdiv>\u003cp>\u003cb>Echo:\u003c/b> interviews and feedback.\u003cbr>\u003cb>Analyst:\u003c/b> funnel, activation and value assessment.\u003cbr>\u003cb>Ledger:\u003c/b> costs and budget checks.\u003cbr>\u003cb>Admin:\u003c/b> review and any later authorization.\u003c/p>\u003c/div>\u003c/div>\u003cp class=\"muted\">Proposed weekly review, W2 recovery decision and W4 decision memo. No schedules, recurring jobs, reporting relationships or extra tasks have been changed.\u003c/p>\u003c/section>\n\u003csection>\u003cdiv class=\"eyebrow\">07 / Risk register\u003c/div>\u003ch2>Triggers that change the plan\u003c/h2>\u003cdiv class=\"scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>Risk\u003c/th>\u003cth>Trigger\u003c/th>\u003cth>Proposed response\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003ctd>Recruitment shortfall\u003c/td>\u003ctd>Below 5 accepted by end of W2\u003c/td>\u003ctd>Atlas: review eligibility objections and shift remaining drafts to the better-performing message/channel. Do not relax eligibility or claim targets met.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Setup or feature gaps\u003c/td>\u003ctd>Workflow cannot be completed or setup median exceeds 60 min\u003c/td>\u003ctd>Maker: log failures and assistance; revise claims and onboarding. Pause invites if safe operation is unverified.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Signup without value\u003c/td>\u003ctd>Below 8 activations or 6 retained teams\u003c/td>\u003ctd>Analyst + Echo: interview drop-offs; report recruitment separately from demand. Extend learning only with Admin review.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Budget overrun\u003c/td>\u003ctd>Committed plus paid costs approach $1,800\u003c/td>\u003ctd>Ledger: stop new commitments; reserve requires Admin release. No paid ads.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Consent / privacy\u003c/td>\u003ctd>Unclear permission, retention or access rules\u003c/td>\u003ctd>Atlas: resolve pilot terms before outreach or real inbox connection; use test data in preparation.\u003c/td>\u003c/tr>\u003ctr>\u003ctd>Synthetic evidence\u003c/td>\u003ctd>Any fictional competitor card presented as market proof\u003c/td>\u003ctd>Scout: retain SAMPLE DATA labels and distinguish missing capabilities from explicit exclusions.\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003csection>\u003cdiv class=\"eyebrow\">08 / Draft outreach · Not sent\u003c/div>\u003ch2>Permission first, evidence next\u003c/h2>\u003cdiv class=\"quote\">\u003cb>Draft A:\u003c/b> Hi [name], we're exploring RelayDesk, a shared inbox designed to help small service teams assign requests clearly. Would your team consider a short pilot and feedback session? We’re testing the workflow and setup experience; participation is optional. May I share the proposed pilot details?\u003c/div>\u003cp>\u003cb>Draft B:\u003c/b> Hi [name], we're testing a shared inbox with planned assignment and SLA alerts, with a future price hypothesis of $59/team/month. Would a time-limited evaluation be relevant to your team? We’d value candid feedback; there is no automatic charge.\u003c/p>\u003cp>\u003cb>Single follow-up, after 4–5 business days:\u003c/b> Following up once on the RelayDesk pilot invitation. If this is not relevant, no response is needed and we will stop following up.\u003c/p>\u003cp class=\"muted\">Drafts require later execution authorization and confirmed recipient permission and offer. No messaging, paid ads or purchased lists executed.\u003c/p>\u003c/section>\n\u003csection>\u003ch2>Measurement and source notes\u003c/h2>\u003cp>Proposed ledger: anonymous team ID, eligibility, channel and variant, invitation/call/acceptance/onboarding dates, activation steps and elapsed time, assistance and failures, activity dates, ownership result, continued-use request, price response, costs and evidence links. Report missing observations; agree access and retention before real data collection.\u003c/p>\u003cp class=\"muted\">Inputs: @art-md1646:launch-input and @art-md4685:competitor-research. The research contains an older source reference; this dashboard uses the current supplied input. Companion plan: @art-md0754:sample-data-relaydesk-launch-plan.\u003c/p>\u003cdetails>\u003csummary>Read the full planning notes and assumptions\u003c/summary>\u003cpre># SAMPLE DATA — RelayDesk four-week launch plan\n\n**DRAFT FOR ADMIN REVIEW · Proposed execution only · Launch date unset**\n\n## Objective and evidence\nRecruit **10 distinct eligible pilot teams by the end of
