/* CORPORA workspace: a quiet, native-feeling shell. Guest documents keep their own design. */
body.sapi-workspace {
  --sapi-bg:#f6f6f6; --sapi-surface:#fafafa; --sapi-white:#fff;
  --sapi-ink:#202020; --sapi-muted:#707070; --sapi-line:#e7e7e7;
  --sapi-pink:#202020; --sapi-violet:#454545; --sapi-accent:#d90068; --sapi-hover:#fbe7f0; --sapi-cyan:#4e6660;
  --sapi-pink-tint:#e9e9e9; --sapi-purple-tint:#f0f0f0; --sapi-cyan-tint:#f0f3f2;
  --sapi-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  --sapi-display:var(--sapi-font);
  --ink:var(--sapi-ink); --paper:var(--sapi-bg); --panel:var(--sapi-surface);
  --line:var(--sapi-line); --muted:var(--sapi-muted); --acid:var(--sapi-pink);
  font:13px/1.5 var(--sapi-font); -webkit-font-smoothing:antialiased;
}
[data-theme=dark] body.sapi-workspace {
  --sapi-bg:#171717; --sapi-surface:#202020; --sapi-white:#212121;
  --sapi-ink:#ececec; --sapi-muted:#a0a0a0; --sapi-line:#333;
  --sapi-pink:#ececec; --sapi-violet:#ccc; --sapi-accent:#ff5aa5; --sapi-hover:#38242e; --sapi-cyan:#a7bdb6;
  --sapi-pink-tint:#303030; --sapi-purple-tint:#292929; --sapi-cyan-tint:#29312e;
}

/* Shared shell preference. Guest pages retain control over their own styles. */
(() => {
  const key='sapi-color-theme';
  let preference;
  try { preference=localStorage.getItem(key); } catch {}
  const system=matchMedia('(prefers-color-scheme: dark)');
  function apply(theme){
    document.documentElement.dataset.theme=theme;
    document.documentElement.style.colorScheme=theme;
    document.querySelectorAll('[data-theme-toggle]').forEach(button=>{
      const label=`Switch to ${theme==='dark'?'light':'dark'} theme`;
      button.textContent=theme==='dark'?'☀':'☾';
      button.setAttribute('aria-label',label);button.title=label;
      button.setAttribute('aria-pressed',String(theme==='dark'));
    });
  }
  apply(preference==='dark'||preference==='light'?preference:system.matches?'dark':'light');
  document.addEventListener('click',event=>{
    if(!event.target.closest('[data-theme-toggle]'))return;
    preference=document.documentElement.dataset.theme==='dark'?'light':'dark';
    apply(preference);try{localStorage.setItem(key,preference);}catch{}
  });
  addEventListener('storage',event=>{if(event.key===key){preference=event.newValue;apply(preference==='dark'||preference==='light'?preference:system.matches?'dark':'light');}});
  system.addEventListener('change',()=>{if(!preference)apply(system.matches?'dark':'light');});
})();

</script>

eturn saved artifact references. Do not mark this task complete; Admin will review.","timestamp":1789685899876},{"role":"user","time":"23:08","text":"Assignment task-z8898:weekly-data-refresh\n\nReplace business-input.json only when Admin supplies actual weekly metrics. Validate week labels, revenue and target, leads/wins and SLA counts, then regenerate weekly-review.md and business-dashboard.html. Preserve source provenance. If no real data is supplied, report that blocker and retain the SAMPLE DATA label. Do not invent a new week.","timestamp":1789686492918},{"role":"assistant","time":"23:14","text":"Admin, both **SAMPLE DATA** deliverables are saved and opened; save receipts verified:\n\n- @art-md5678:sample-data-weekly-business-review\n- @art-html6743:sample-data-business-dashboard\n\nW4 revenue declined **12.50% ($1,800)** and was **$2,400 below target (16.00%)**. Both include all weekly rates, evidence, limitations, and proposed actions.\n\nTask remains open for your review.","timestamp":1789686866194},{"role":"assistant","time":"23:14","text":"Review accepted. Completed: Review four weeks of business results. Results are available in my workspace. Business inputs remain SAMPLE DATA.","timestamp":1789686866195}]},"workspaces":{"sapi_07e6a1f92000":{"tabs":[{"id":"tab-bb76d5c09fa9494190b02a235dd8810b","type":"html","title":"Product launch","artifactId":"art-html7243"},{"id":"tab-7e13d0c255ff48edbe6e959f7d30fb8d","type":"html","title":"Customer feedback","artifactId":"art-html3318"},{"id":"tab-cf014255616c45bd9ae6f398c9b5b452","type":"html","title":"Weekly business review","artifactId":"art-html0445"},{"id":"tab-ee6ac87be09d4baeb648db3ecbd9872a","type":"html","title":"SAMPLE DATA — Team review","artifactId":"art-md0200"},{"id":"tab-add892364ecb4557871db093d194114c","type":"html","title":"Team overview","artifactId":"art-html5934"}],"activeTab":"tab-add892364ecb4557871db093d194114c"},"sapi_cf994bcc564a":{"tabs":[{"id":"tab-674a1d59278e40c199b90f392d297dea","type":"html","title":"SAMPLE DATA — RelayDesk competitor research","artifactId":"art-md9638"}],"activeTab":"tab-674a1d59278e40c199b90f392d297dea"},"sapi_974e5d5b5450":{"tabs":[{"id":"tab-1dde18fabddd4fe5ae15456275b5c993","type":"html","title":"SAMPLE DATA — RelayDesk launch plan","artifactId":"art-md0754"},{"id":"tab-cb783d1a382c421b86740df44c29615b","type":"html","title":"SAMPLE DATA — RelayDesk launch dashboard","artifactId":"art-html3383"}],"activeTab":"tab-cb783d1a382c421b86740df44c29615b"},"sapi_5abb91c5450d":{"tabs":[{"id":"tab-4d088bfb168f43f1aa670bfdbeec9338","type":"html","title":"SAMPLE DATA — Feedback evidence JSON","artifactId":"art-json3910"},{"id":"tab-b61b6d3f8c7d416ea7d7dacfcaa1f381","type":"html","title":"SAMPLE DATA — Feedback evidence","artifactId":"art-md3551"}],"activeTab":"tab-b61b6d3f8c7d416ea7d7dacfcaa1f381"},"sapi_543b6c414819":{"tabs":[{"id":"tab-65e29a613e594c8baff018ee294fd10b","type":"html","title":"SAMPLE DATA — Feedback report","artifactId":"art-md0342"},{"id":"tab-187b47f9ea2a432dbec729dc48381994","type":"html","title":"SAMPLE DATA — Results dashboard","artifactId":"art-html8795"}],"activeTab":"tab-187b47f9ea2a432dbec729dc48381994"},"sapi_6832df1e0acc":{"tabs":[{"id":"tab-4fabb1044d514d92889a7570584fc286","type":"html","title":"SAMPLE DATA — Weekly business review","artifactId":"art-md5678"},{"id":"tab-e73497a56a794bc8b7eab7f885f61973","type":"html","title":"SAMPLE DATA — Business dashboard","artifactId":"art-html6743"}],"activeTab":"tab-e73497a56a794bc8b7eab7f885f61973"}},"document":{"title":"Team review","subtitle":"SAMPLE DATA — three workflows","body":"# SAMPLE DATA — Team review\nSynthetic inputs · Atlas coordinating review · Prepared 18 September 2026\n\n## Scope and evidence\nReviewed the complete supplied snapshot @art-json0706:case-results. This review checks its summaries and task outcomes; underlying research cards, feedback records and source reports were not independently re-read. All figures below describe synthetic cases, not real operating results. Saved dashboards are snapshots, not live data feeds.\n\nThe snapshot records five preceding assignments as **reviewed and completed**. That status describes their deliverables; it does not establish that launch, shipping or business improvement objectives succeeded. The Atlas review @task-z6571:review-all-cases was subsequently verified and marked complete by the coordinating assistant. The five prior completed assignments plus this review make six completed assignments; the three follow-ups remain planned.\n\n## 1. Product launch\n**Accountable owner: Maker. Research: Scout.**\n\nEvidence: the snapshot reports verification of fictional C1–C5 cards. The proposed target is 10 accepted pilot teams in four relative weeks. Base budget is $1,800 plus $200 contingency, totaling the $2,000 cap. No outreach or expenditure occurred; all execution remains proposed.\n\nReview decision: preserve this as a proposed pilot plan. The budget reconciles, but the snapshot contains no accepted-pilot result or evidence that the target was achieved.\n\nNext action: Scout’s @task-k5026:launch-pilot-validation is **planned; not started**. Proposed acceptance evidence: documented pilot fit and acceptance criteria, followed by an explicit Admin decision on execution. No outreach or spend is authorized by this review.\n\nSaved evidence:\n- Report: @art-md0754:sample-data-relaydesk-launch-plan\n- Dashboard: @art-html7243:product-launch\n\n## 2. Customer feedback priorities\n**Accountable owner: Analyst. Extraction: Echo.**\n\nEvidence: 12 feedback records represent 11 unique accounts. Of these, 11 issue/request records span 10 accounts and one record is positive. CSV export has four records from three accounts; duplicate notifications, performance and onboarding each have two records from two accounts; dark theme has one record from one account. F01 and F11 belong to the same account.\n\nReview decision: count unique accounts as well as records to avoid overstating demand. CSV export has the broadest stated account reach and merits specification next; reach alone does not establish severity, effort or commercial value. The supplied category record counts reconcile to 11 issue/request records. Category account counts must not be summed to infer distinct accounts because cross-category overlap is not specified.\n\nNext action: Maker’s @task-p1444:csv-export-spec is **planned; not started**. Proposed acceptance evidence: a scoped export specification with acceptance criteria, dependencies and effort estimate, reviewed with Analyst. Priorities remain recommendations; no shipped feature is evidenced.\n\nSaved evidence:\n- Report: @art-md0342:sample-data-feedback-report\n- Dashboard: @art-html3318:customer-feedback\n\n## 3. Weekly business review\n**Accountable owner: Ledger.**\n\nEvidence: W4 revenue is $12,600, down $1,800 (12.50%) from W3. Against the $15,000 target, the shortfall is $2,400 (16%) and attainment is 84%. Conversion is 11.25%. SLA attainment is 69.44% against a 90% target. Coverage is four synthetic weeks; causes are unverified hypotheses.\n\nReview decision: revenue arithmetic reconciles (implied W3 revenue: $14,400). The SLA gap is 20.56 percentage points. Treat revenue and SLA gaps as review priorities, while leaving causal explanations unconfirmed. Conversion cannot be judged against a target because none is supplied.\n\nNext action: Ledger’s @task-z8898:weekly-data-refresh is **planned; not started**. Proposed acceptance evidence: refreshed source data, metric definitions and denominators, comparable periods, and evidence that tests the stated hypotheses. No recovery or business improvement is established by this snapshot.\n\nSaved evidence:\n- Report: @art-md5678:sample-data-weekly-business-review\n- Dashboard: @art-html0445:weekly-business-review\n\n## Actual reviewed assignment results\nStatus below is reported by the supplied snapshot.\n\n| Owner | Assignment | Snapshot status | Reviewed result |\n|---|---|---|---|\n| Scout | @task-b8133:launch-research | Reviewed and completed | Fictional C1–C5 research-card verification reported |\n| Maker | @task-h1574:launch-plan | Reviewed and completed | Proposed four-week pilot plan; $2,000 cap; no execution |\n| Echo | @task-y7163:feedback-extraction | Reviewed and completed | 12 records / 11 unique accounts; duplicate account identified |\n| Analyst | @task-j3408:feedback-priorities | Reviewed and completed | Feedback prioritization recommendations; no shipped features |\n| Ledger | @task-b0952:weekly-business-review | Reviewed and completed | Four-week synthetic metric review; causes unverified |\n\nThe results above map the case summaries to their corresponding assignments; the snapshot does not supply full individual task logs.\n\n## Proposed next steps and governance\n1. Admin reviews this Atlas synthesis and the proposed decisions.\n2. Scout validates the pilot assumptions under the existing planned task.\n3. Maker develops the CSV export specification under the existing planned task.\n4. Ledger refreshes the weekly data under the existing planned task.\n5. Atlas checks the resulting evidence against the acceptance criteria above when available.\n\nSteps 2–4 are recorded plans, not work performed in this review. Acceptance criteria are Atlas recommendations, not saved changes to those tasks. Five specialists report to Atlas; Atlas has no manager. Automatic checks are paused. These were explicit one-off runs. No schedules, assignments or completion states were changed.\n","edited":false},"connections":{},"posts":[],"attachment":false,"drafts":{}},"artifacts":[{"id":"art-md7339","owner":"sapi_cf994bcc564a","filename":"launch-input.md","title":"launch-input","reference":"@art-md7339:launch-input","content":"# SAMPLE DATA — fictional product launch\nProduct: RelayDesk, a shared inbox for small service teams. Goal: validate demand with 10 pilot teams in 4 weeks. Budget: $2,000. Positioning hypothesis: fast setup and clear ownership. No real competitive research has been performed.\n\nFictional supplied competitor cards (USD/team/month):\nC1 InboxOak: $49, shared inbox, basic assignment, no SLA alerts, setup 1 day.\nC2 TeamWillow: $99, shared inbox, assignment and SLA alerts, setup 3 days.\nC3 QueueFox: $29, shared inbox, manual tags only, setup 2 hours.\nC4 ReplyHarbor: $149, shared inbox, routing and analytics, setup 5 days.\nC5 ServiceLark: $79, shared inbox, assignment and analytics, setup 2 days.\nRelayDesk planned: $59, shared inbox, assignment and SLA alerts, setup target 1 hour. All RelayDesk claims are hypotheses, not measured facts.\nConstraints: no paid advertising or external messaging executed. Produce drafts only. Launch date unset; use relative weeks.\n"},{"id":"art-md1646","owner":"sapi_974e5d5b5450","filename":"launch-input.md","title":"launch-input","reference":"@art-md1646:launch-input","content":"# SAMPLE DATA — fictional product launch\nProduct: RelayDesk, a shared inbox for small service teams. Goal: validate demand with 10 pilot teams in 4 weeks. Budget: $2,000. Positioning hypothesis: fast setup and clear ownership. No real competitive research has been performed.\n\nFictional supplied competitor cards (USD/team/month):\nC1 InboxOak: $49, shared inbox, basic assignment, no SLA alerts, setup 1 day.\nC2 TeamWillow: $99, shared inbox, assignment and SLA alerts, setup 3 days.\nC3 QueueFox: $29, shared inbox, manual tags only, setup 2 hours.\nC4 ReplyHarbor: $149, shared inbox, routing and analytics, setup 5 days.\nC5 ServiceLark: $79, shared inbox, assignment and analytics, setup 2 days.\nRelayDesk planned: $59, shared inbox, assignment and SLA alerts, setup target 1 hour. All RelayDesk claims are hypotheses, not measured facts.\nConstraints: no paid advertising or external messaging executed. Produce drafts only. Launch date unset; use relative weeks.\n"},{"id":"art-json7990","owner":"sapi_5abb91c5450d","filename":"feedback-input.json","title":"feedback-input","referenc AMPLE DATA — RelayDesk competitor research","reference":"@art-md9638:sample-data-relaydesk-competitor-research","content":"# SAMPLE DATA — RelayDesk competitor research\n\nAll inputs are explicitly synthetic. This is a comparison of five supplied fictional cards, not real market research. RelayDesk's price, capabilities and setup time are hypotheses, not measured facts.\n\n## Evidence and scope\n\nSource: launch-input.md (@art-md7339:launch-input), read in full for this report. C1–C5 identify the supplied competitor cards below. “Card fact” means stated in that fictional source only; it does not mean independently verified. Missing features are unknown unless explicitly excluded.\n\nThe supplied brief describes RelayDesk as a shared inbox for small service teams, with a goal of validating demand with 10 pilot teams in 4 weeks and a $2,000 budget. Its planned offer is $59/team/month, shared inbox, assignment and SLA alerts, with a 1-hour setup target. All RelayDesk claims are hypotheses. The launch date is unset; timing below uses relative weeks.\n\n## Comparison table — SAMPLE DATA\n\nPrices are USD/team/month. Price differences are arithmetic against RelayDesk's planned $59, not evidence of realized savings or value. Setup differences are conditional on RelayDesk meeting its target; measurement conditions are unspecified.\n\n| Evidence | Fictional competitor: supplied card facts | Conditional comparison with RelayDesk | Unknowns / limits |\n|---|---|---|---|\n| C1 | **InboxOak:** $49; shared inbox; basic assignment; explicitly no SLA alerts; setup 1 day. | RelayDesk would cost $10 more and add SLA alerts if delivered. Its 1-hour setup target is shorter than the stated 1 day. | Assignment quality, integrations and setup scope are unspecified. |\n| C2 | **TeamWillow:** $99; shared inbox; assignment and SLA alerts; setup 3 days. | RelayDesk proposes the same named feature categories at $40 less (about 40% less), with a shorter setup target. | Category overlap does not establish feature parity, reliability or equal service. |\n| C3 | **QueueFox:** $29; shared inbox; manual tags only; setup 2 hours. | RelayDesk would cost $30 more, proposing assignment and SLA alerts beyond the card's manual-tags-only workflow. Its setup target is 1 hour shorter. | Whether teams value these additions enough to pay the premium is untested. |\n| C4 | **ReplyHarbor:** $149; shared inbox; routing and analytics; setup 5 days. | RelayDesk would cost $90 less and target shorter setup, but its plan does not establish matching routing or analytics. | SLA alerts and assignment in ReplyHarbor are unspecified; RelayDesk routing and analytics are also unspecified. |\n| C5 | **ServiceLark:** $79; shared inbox; assignment and analytics; setup 2 days. | RelayDesk would cost $20 less and target shorter setup. The named emphasis differs: planned SLA alerts versus listed analytics. | ServiceLark SLA alerts and RelayDesk analytics are unspecified. No feature superiority is established. |\n\n## Findings and positioning options — SAMPLE DATA\n\n**What the cards support:** Shared inbox appears in all five cards, so that category alone does not distinguish RelayDesk in this sample. QueueFox is the cheapest listed option (C3). TeamWillow explicitly lists assignment and SLA alerts (C2). Only InboxOak explicitly excludes SLA alerts (C1); omission elsewhere is not proof of absence.\n\n**What remains hypothetical:** RelayDesk's setup target is shorter than every supplied setup figure, but it is unmeasured. “Clear ownership” is a positioning hypothesis: listing assignment does not prove that teams know who owns each request. Neither demand nor willingness to pay has been demonstrated.\n\n| Positioning option | Draft message — hypothesis, not a publishable proven claim | Basis and tradeoff |\n|---|---|---|\n| 1. Fast setup and clear ownership | “A shared inbox designed to get small service teams assigning requests quickly.” | Closest to the supplied brief. C1–C5 provide comparison context, but RelayDesk must demonstrate setup speed and ownership clarity. C3's 2-hour figure makes an exaggerated speed advantage especially risky. |\n| 2. Assignment and SLA alerts at a modest team price | “Planned at $59/team/month, with assignment and SLA alerts.” | C2 is the direct named-feature comparison at $99; C1 costs $49 without SLA alerts. Validate delivery, comparable functionality and willingness to pay. C3 remains cheaper. |\n| 3. Focus on everyday request handling | “For small service teams that prioritize assignment and timely follow-up.” | A possible audience distinction alongside the routing/analytics emphasis in C4 and analytics in C5. This is a customer-need hypothesis, not evidence that those competitors are complex or unsuitable. |\n\n**Proposed lead:** Test option 1, with option 2 as supporting price/feature context. Do not present “1-hour setup,” “clear ownership,” feature parity, or superiority as established outcomes. Option 3 is a secondary segment hypothesis until teams explain their actual needs.\n\n## Three validation questions — SAMPLE DATA\n\n1. **Can representative small service teams reach a useful first workflow within the 1-hour setup target?** In relative Weeks 1–2, propose a standardized pilot exercise: connect an inbox, add a teammate, assign a request and configure/test an SLA alert. Record elapsed time, assistance, failures and environment for every attempt. Define setup start/end before testing; report the distribution rather than only the fastest result.\n\n2. **Do assignment and SLA alerts create enough value to justify $59/team/month?** In Weeks 2–3, propose testing whether pilot users can identify each request's owner and respond to an alert without facilitator help. Ask about willingness to pay after use, including the tradeoff against C3's fictional $29 manual-tags-only offer and C2's fictional $99 feature categories. Separate observed behavior, stated preference and any future commitment; synthetic comparisons cannot validate real competitor performance.\n\n3. **Can the proposed positioning attract 10 suitable pilot teams within 4 weeks, and what would count as validated demand?** Before any outreach, define team eligibility, activation and a meaningful demand signal with Admin. Draft tests of options 1 and 2; if later authorized, track eligible prospects, pilot acceptance, activation and continued use through Week 4. Ten signups alone would not prove demand. Keep any proposed expenditure within the supplied $2,000 budget.\n\n## Execution status — SAMPLE DATA\n\nThis deliverable is analysis and draft validation work only. No browsing, outreach, paid advertising, spending or pilot execution occurred. No real competitor claims were verified. The assigned task remains open for Admin review.\n","previewHtml":"\u003c!doctype html>\u003cmeta charset=\"utf-8\">\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'\">\n\u003ctitle>competitor-research.md\u003c/title>\u003cstyle>body{max-width:850px;margin:32px auto;padding:0 24px;font:16px/1.6 system-ui;color:#202030;background:#faf9f6}.line{white-space:pre-wrap;overflow-wrap:anywhere}pre{white-space:pre-wrap;background:#eeebf3;padding:16px}h1,h2,h3{line-height:1.2}a{color:#7435b8;overflow-wrap:anywhere}code{background:#eeebf3;padding:2px 4px}\u003c/style>\u003ch1>SAMPLE DATA — RelayDesk competitor research\u003c/h1>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">All inputs are explicitly synthetic. This is a comparison of five supplied fictional cards, not real market research. RelayDesk&#x27;s price, capabilities and setup time are hypotheses, not measured facts.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>Evidence and scope\u003c/h2>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Source: launch-input.md (@art-md7339:launch-inp nst C3's fictional $29 manual-tags-only offer and C2's fictional $99 feature categories. Separate observed behavior, stated preference and any future commitment; synthetic comparisons cannot validate real competitor performance.\n\n3. **Can the proposed positioning attract 10 suitable pilot teams within 4 weeks, and what would count as validated demand?** Before any outreach, define team eligibility, activation and a meaningful demand signal with Admin. Draft tests of options 1 and 2; if later authorized, track eligible prospects, pilot acceptance, activation and continued use through Week 4. Ten signups alone would not prove demand. Keep any proposed expenditure within the supplied $2,000 budget.\n\n## Execution status — SAMPLE DATA\n\nThis deliverable is analysis and draft validation work only. No browsing, outreach, paid advertising, spending or pilot execution occurred. No real competitor claims were verified. The assigned task remains open for Admin review.\n"},{"id":"art-json3910","owner":"sapi_5abb91c5450d","filename":"feedback-evidence.json","title":"SAMPLE DATA — Feedback evidence JSON","reference":"@art-json3910:sample-data-feedback-evidence-json","content":"{\n  \"label\": \"SAMPLE DATA — synthetic customer feedback, not real customers\",\n  \"source\": {\n    \"artifact\": \"@art-json7990:feedback-input\",\n    \"filename\": \"feedback-input.json\"\n  },\n  \"method\": {\n    \"classification\": \"One primary theme per record. Positive feedback is reported separately from issues and requests.\",\n    \"account_deduplication\": \"Count distinct source account IDs within each theme and overall. F01 and F11 are both A01: two records, one account.\",\n    \"severity_scale\": {\n      \"0\": \"positive feedback\",\n      \"1\": \"minor\",\n      \"2\": \"moderate\",\n      \"3\": \"major\"\n    },\n    \"evidence\": \"Record text is copied verbatim from the synthetic input. Theme names are analyst classifications.\",\n    \"limitations\": \"Synthetic sample o 01 and count as two records but one account.\n\n| Theme | Type | Records | Unique accounts | Account IDs | Evidence IDs |\n| --- | --- | ---: | ---: | --- | --- |\n| CSV export availability | Issue/request | 4 | 3 | A01, A02, A03 | F01, F02, F03, F11 |\n| Dashboard loading performance | Issue/request | 2 | 2 | A04, A05 | F04, F05 |\n| First-task assignment onboarding | Issue/request | 2 | 2 | A06, A07 | F06, F07 |\n| Dark theme request | Issue/request | 1 | 1 | A08 | F08 |\n| Duplicate notifications | Issue/request | 2 | 2 | A09, A10 | F09, F10 |\n| Clear task ownership | Positive | 1 | 1 | A11 | F12 |\n\n## Evidence — verbatim synthetic input\n\nTheme names are analyst classifications. Text below is copied verbatim; no customer quotes have been invented. Source severity: 0 = positive feedback, 1 = minor, 2 = moderate, 3 = major.\n\n| Evidence ID | Account | Theme | Source severity | Exact source text |\n| --- | --- | --- | ---: | --- |\n| F01 | A01 | CSV export availability | 3 | We cannot export the weekly report as CSV. |\n| F02 | A02 | CSV export availability | 3 | CSV export is missing; copying results takes an hour. |\n| F03 | A03 | CSV export availability | 2 | Need CSV export for our finance review. |\n| F04 | A04 | Dashboard loading performance | 3 | The dashboard takes 15 seconds to load with 500 items. |\n| F05 | A05 | Dashboard loading performance | 2 | Dashboard loading is slow on large projects. |\n| F06 | A06 | First-task assignment onboarding | 2 | New teammates do not know how to assign their first task. |\n| F07 | A07 | First-task assignment onboarding | 2 | The first-run onboarding has no assignment example. |\n| F08 | A08 | Dark theme request | 1 | I need a dark theme. |\n| F09 | A09 | Duplicate notifications | 3 | Alerts about the same task are sent twice. |\n| F10 | A10 | Duplicate notifications | 3 | Duplicate notifications make me miss important updates. |\n| F11 | A01 | CSV export availability | 3 | Following up on CSV export, still waiting. |\n| F12 | A11 | Clear task ownership | 0 | Task ownership is clear and saves us time. |\n\n## Limits\n\nSAMPLE DATA only. Counts describe this synthetic sample and do not establish real customer prevalence. No effort estimates were supplied. F12 is positive evidence about task ownership, not an issue or feature request.\n","previewHtml":"\u003c!doctype html>\u003cmeta charset=\"utf-8\">\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'\">\n\u003ctitle>feedback-evidence.md\u003c/title>\u003cstyle>body{max-width:850px;margin:32px auto;padding:0 24px;font:16px/1.6 system-ui;color:#202030;background:#faf9f6}.line{white-space:pre-wrap;overflow-wrap:anywhere}pre{white-space:pre-wrap;background:#eeebf3;padding:16px}h1,h2,h3{line-height:1.2}a{color:#7435b8;overflow-wrap:anywhere}code{background:#eeebf3;padding:2px 4px}\u003c/style>\u003ch1>SAMPLE DATA — Feedback evidence\u003c/h1>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Synthetic customer feedback, not real customers. Source: @art-json7990:feedback-input (\u003ccode>feedback-input.json\u003c/code>).\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>Counts and method\u003c/h2>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">All 12 records are classified into one primary theme each, covering 11 unique accounts. Issues and requests: 11 records from 10 accounts. Positive feedback: 1 record from 1 account. F01 and F11 both belong to A01 and count as two records but one account.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">| Theme | Type | Records | Unique accounts | Account IDs | Evidence IDs |\u003c/div>\n\u003cdiv class=\"line\">| --- | --- | ---: | ---: | --- | --- |\u003c/div>\n\u003cdiv class=\"line\">| CSV export availability | Issue/request | 4 | 3 | A01, A02, A03 | F01, F02 n CSV export, still waiting.\",\n      \"source_severity\": 3,\n      \"theme_id\": \"csv_export\",\n      \"feedback_type\": \"issue_or_request\"\n    },\n    {\n      \"evidence_id\": \"F12\",\n      \"account\": \"A11\",\n      \"text\": \"Task ownership is clear and saves us time.\",\n      \"source_severity\": 0,\n      \"theme_id\": \"clear_task_ownership\",\n      \"feedback_type\": \"positive\"\n    }\n  ]\n}\n"},{"id":"art-md5280","owner":"sapi_543b6c414819","filename":"feedback-evidence.md","title":"feedback-evidence","reference":"@art-md5280:feedback-evidence","content":"# SAMPLE DATA — Feedback evidence\n\nSynthetic customer feedback, not real customers. Source: @art-json7990:feedback-input (`feedback-input.json`).\n\n## Counts and method\n\nAll 12 records are classified into one primary theme each, covering 11 unique accounts. Issues and requests: 11 records from 10 accounts. Positive feedback: 1 record from 1 account. F01 and F11 both belong to A01 and count as two records but one account.\n\n| Theme | Type | Records | Unique accounts | Account IDs | Evidence IDs |\n| --- | --- | ---: | ---: | --- | --- |\n| CSV export availability | Issue/request | 4 | 3 | A01, A02, A03 | F01, F02, F03, F11 |\n| Dashboard loading performance | Issue/request | 2 | 2 | A04, A05 | F04, F05 |\n| First-task assignment onboarding | Issue/request | 2 | 2 | A06, A07 | F06, F07 |\n| Dark theme request | Issue/request | 1 | 1 | A08 | F08 |\n| Duplicate notifications | Issue/request | 2 | 2 | A09, A10 | F09, F10 |\n| Clear task ownership | Positive | 1 | 1 | A11 | F12 |\n\n## Evidence — verbatim synthetic input\n\nTheme names are analyst classifications. Text below is copied verbatim; no customer quotes have been invented. Source severity: 0 = positive feedback, 1 = minor, 2 = moderate, 3 = major.\n\n| Evidence ID | Account | Theme | Source severity | Exact source text |\n| --- | --- | --- | ---: | --- |\n| F01 | A01 | CSV export availability | 3 | We cannot export the weekly report as CSV. |\n| F02 | A02 | CSV export availability | 3 | CSV export is missing; copying results takes an hour. |\n| F03 | A03 | CSV export availability | 2 | Need CSV export for our finance review. |\n| F04 | A04 | Dashboard loading performance | 3 | The dashboard takes 15 seconds to load with 500 items. |\n| F05 | A05 | Dashboard loading performance | 2 | Dashboard loading is slow on large projects. |\n| F06 | A06 | First-task assignment onboarding | 2 | New teammates do not know how to assign their first task. |\n| F07 | A07 | First-task assignment onboarding | 2 | The first-run onboarding has no assignment example. |\n| F08 | A08 | Dark theme request | 1 | I need a dark theme. |\n| F09 | A09 | Duplicate notifications | 3 | Alerts about the same task are sent twice. |\n| F10 | A10 | Duplicate notifications | 3 | Duplicate notifications make me miss important updates. |\n| F11 | A01 | CSV export availability | 3 | Following up on CSV export, still waiting. |\n| F12 | A11 | Clear task ownership | 0 | Task ownership is clear and saves us time. |\n\n## Limits\n\nSAMPLE DATA only. Counts describe this synthetic sample and do not establish real customer prevalence. No effort estimates were supplied. F12 is positive evidence about task ownership, not an issue or feature request.\n"},{"id":"art-md5678","owner":"sapi_6832df1e0acc","filename":"weekly-review.md","title":"SAMPLE DATA — Weekly business review","reference":"@art-md5678:sample-data-weekly-business-review","content":"# SAMPLE DATA — Weekly business review\n\n**Synthetic business metrics · W1–W4 · USD · Prepared for Admin review**\n\nThis is a review of explicitly synthetic sample inputs, not actual business performance. Source: @art-json5833:business-input (`business-input.json`), read in full through host-control. Source label: “SAMPLE DATA — synthetic business metrics, USD”. No external evidence was used.\n\n## W4 result\n\n- **Revenue: $12,600**, down **$1,800 (12.50%)** from W3’s $14,400.\n- **Target gap: −$2,400 (−16.00%)** against the $15,000 W4 revenue target; attainment is **84.00%**.\n- **Conversion: 11.25%** (18/160), down **4.75 percentage points** from W3’s 16.00%.\n- **SLA attainment: 69.44%** (50/72), down **10.56 percentage points** from W3’s 80.00%; **20.56 percentage points below** the supplied 90% SLA target.\n\n## Weekly input evidence — SAMPLE DATA\n\n| Week | Revenue (USD) | Target (USD) | Leads | Wins | Tickets | SLA met |\n|---|---:|---:|---:|---:|---:|---:|\n| W1 | $12,000 | $12,500 | 100 | 20 | 40 | 36 |\n| W2 | $13,500 | $13,500 | 120 | 24 | 50 | 44 |\n| W3 | $14,400 | $14,500 | 150 | 24 | 60 | 48 |\n| W4 | $12,600 | $15,000 | 160 | 18 | 72 | 50 |\n\n## Calculated weekly rates and gaps — SAMPLE DATA\n\n| Week | Revenue gap (USD) | Revenue gap / target | Conversion | SLA attainment | SLA gap vs 90% (pp) |\n|---|---:|---:|---:|---:|---:|\n| W1 | −$500 | -4.00% | 20.00% | 90.00% | 0.00 |\n| W2 | $0 | 0.00% | 20.00% | 88.00% | -2.00 |\n| W3 | −$100 | -0.69% | 16.00% | 80.00% | -10.00 |\n| W4 | −$2,400 | -16.00% | 11.25% | 69.44% | -20.56 |\n\n## What the sample shows\n\nRevenue rose from W1 through W3, then fell in W4 as the revenue target continued to rise. Leads increased from 150 to 160 in W4 (+6.67%), while wins fell from 24 to 18 (−25.00%). This is an observed association, not evidence explaining the revenue decline.\n\nSLA attainment declined each week: 90.00%, 88.00%, 80.00%, and 69.44%. W4 tickets increased 20.00% (60 to 72), while SLA-met tickets increased from 48 to 50. Tickets outside SLA increased from 12 to 22. The counts establish a worsening rate; they do not establish a staffing or process cause.\n\n## Proposed actions — not executed\n\n| Owner | Proposal | Evidence to obtain / review gate |\n|---|---|---|\n| Ledger | Validate actual weekly data when Admin supplies it, preserving source provenance, then refresh both deliverables. | Confirm week dates, USD basis, targets, revenue recognition, deduplicated leads/wins, ticket eligibility and SLA definition; reconcile totals to supplied sources. Retain SAMPLE DATA labeling until real inputs are supplied and validated. |\n| Scout | Investigate the hypothesis that lead mix or sales-stage timing contributed to lower conversion. Also investigate whether ticket complexity or capacity constraints contributed to lower SLA attainment. | Review authorized segment/stage evidence and ticket priority, age and staffing records. Report evidence for and against each hypothesis; sample aggregates alone cannot confirm causes. |\n| Atlas | Review validated findings with Admin and propose priorities, accountable next steps and success thresholds. | Base any prioritization on verified impact and operational constraints. Confirm conversion goals; use the supplied 90% SLA target only as the sample benchmark. |\n\nThese are proposed actions only. No outreach, assignments, schedules or operational changes were made. The review task remains open for Admin review.\n\n## Method and limitations\n\n- Revenue change = (W4 revenue − W3 revenue) / W3 revenue: (12,600 − 14,400) / 14,400 = −12.50%.\n- Signed revenue target gap = revenue − target; gap percentage = gap / target. W4: −2,400 / 15,000 = −16.00%. Target attainment = revenue / target = 84.00%.\n- Conversion = wins / leads within each week. It is the supplied simplified definition, **not cohort conversion**.\n- SLA attainment = SLA-met tickets / tickets. SLA gap is attainment minus the supplied 90% target, in percentage points (pp).\n- Rates and percentage-point changes use unrounded values, displayed to two decimal places. Raw inputs are preserved in the evidence table.\n- Input validation passed for unique sequential W1–W4 labels, nonnegative integer values, positive rate denominators and targets, wins ≤ leads, and SLA-met tickets ≤ tickets.\n- Four synthetic weeks supply no dates, customer segments, deal sizes, cohort linkage, ticket severity, staffing, revenue-recognition policy or causal evidence. Revenue is weekly, **not MRR**. No conversion target was supplied. No forecast or causal conclusion is warranted.\n","previewHtml":"\u003c!doctype html>\u003cmeta charset=\"utf-8\">\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'\">\n\u003ctitle>weekly-review.md\u003c/title>\u003cstyle>body{max-width:850px;margin:32px auto;padding:0 24px;font:16px/1.6 system-ui;color:#202030;background:#faf9f6}.line{white-space:pre-wrap;overflow-wrap:anywhere}pre{white-space:pre-wrap;background:#eeebf3;padding:16px}h1,h2,h3{line-height:1.2}a{color:#7435b8;overflow-wrap:anywhere}code{background:#eeebf3;padding:2px 4px}\u003c/style>\u003ch1>SAMPLE DATA — Weekly business review\u003c/h1>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">\u003cstrong>Synthetic business metrics · W1–W4 · USD · Prepared for Admin review\u003c/strong>\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">This is a review of explicitly synthetic sample inputs, not actual business performance. Source: @art-json5833:business-input (\u003ccode>business-input.json\u003c/code>), read in full through host-control. Source label: “SAMPLE DATA — synthetic business metrics, USD”. No external evidence was used.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>W4 result\u003c/h2>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">- \u003cstrong>Revenue: $12,600\u003c/strong>, down \u003cstrong>$1,800 (12.50%)\u003c/strong> from W3’s $14,400.\u003c/div>\n\u003cdiv class=\"line\">- \u003cstrong>Target gap: −$2,400 (−16.00%)\u003c/strong> against the $15,000 W4 revenue target; attainment is \u003cstrong>84.00%\u003c/strong>.\u003c/div>\n\u003cdiv class=\"line\">- \u003cstrong>Conversion: 11.25%\u003c/strong> (18/160), down \u003cstrong>4.75 percentage points\u003c/strong> from W3’s 16.00%.\u003c/div>\n\u003cdiv cla outreach, assignments, schedules or operational changes were made. The review task remains open for Admin review.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>Method and limitations\u003c/h2>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">- Revenue change = (W4 revenue − W3 revenue) / W3 revenue: (12,600 − 14,400) / 14,400 = −12.50%.\u003c/div>\n\u003cdiv class=\"line\">- Signed revenue target gap = revenue − target; gap percentage = gap / target. W4: −2,400 / 15,000 = −16.00%. Target attainment = revenue / target = 84.00%.\u003c/div>\n\u003cdiv class=\"line\">- Conversion = wins / leads within each week. It is the supplied simplified definition, \u003cstrong>not cohort conversion\u003c/strong>.\u003c/div>\n\u003cdiv class=\"line\">- SLA attainment = SLA-met tickets / tickets. SLA gap is attainment minus the supplied 90% target, in percentage points (pp).\u003c/div>\n\u003cdiv class=\"line\">- Rates and percentage-point changes use unrounded values, displayed to two decimal places. Raw inputs are preserved in the evidence table.\u003c/div>\n\u003cdiv class=\"line\">- Input validation passed for unique sequential W1–W4 labels, nonnegative integer values, positive rate denominators and targets, wins ≤ leads, and SLA-met tickets ≤ tickets.\u003c/div>\n\u003cdiv class=\"line\">- Four synthetic weeks supply no dates, customer segments, deal sizes, cohort linkage, ticket severity, staffing, revenue-recognition policy or causal evidence. Revenue is weekly, \u003cstrong>not MRR\u003c/strong>. No conversion target was supplied. No forecast or causal conclusion is warranted.\u003c/div>"},{"id":"art-html6743","owner":"sapi_6832df1e0acc","filename":"business-dashboard.html","title":"SAMPLE DATA — Business dashboard","reference":"@art-html6743:sample-data-business-dashboard","content":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\u003ctitle>SAMPLE DATA — Business dashboard\u003c/title>\n\u003cstyle>\n:root{--ink:#172f40;--muted:#4d6270;--teal:#116b63;--blue:#245ea7;--amber:#875914;--line:#d8e2e9;--paper:#fff;--bg:#edf2f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;line-height:1.55}main{max-width:1240px;margin:auto;padding:36px 28px 48px}header{background:#173747;color:white;border-radius:20px;padding:32px 36px;margin-bottom:24px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:750;color:#c1e7df}.badge{display:inline-block;border:1px solid #e9c681;background:#fff2d6;color:#66430b;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:800;letter-spacing:.07em}h1{font-size:clamp(28px,4vw,44px);line-height:1.15;letter-spacing:-.035em;margin:16px 0 12px}header p{max-width:780px;color:#e0eaf0;margin:8px 0}.meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin-top:22px;color:#d8e5eb}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px}.card{padding:22px;border-top:4px solid var(--teal)}.card.alert{border-top-color:var(--amber)}.label{font-size:13px;font-weight:750;color:var(--muted)}.value{font-size:clamp(26px,3vw,36px);font-weight:780;letter-spacing:-.035em;margin:8px 0}.detail{font-size:13px;color:var(--muted);margin:0}.signal{font-weight:700;color:#8b3e20}.panel{padding:24px;margin-top:20px}h2{font-size:20px;margin:0 0 12px;letter-spacing:-.02em}h3{font-size:16px;margin:0 0 6px}.subtle{color:var(--muted);font-size:14px}.charts{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px}.chart{min-width:0}figure{margin:0}svg{width:100%;height:auto;display:block}svg text{font:12px system-ui,sans-serif;fill:#4d6270}.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}.key:before{content:\"\";dis p\">Skip to evidence tables\u003c/a>\u003cmain>\n\u003cheader>\u003cspan class=\"badge\">SAMPLE DATA\u003c/span>\u003cdiv class=\"eyebrow\" style=\"margin-top:20px\">Ledger / weekly business review\u003c/div>\u003ch1>Revenue softened. Service slipped.\u003c/h1>\u003cp>W4 revenue fell as conversion and SLA attainment weakened. These are observations from synthetic sample data; underlying causes remain unverified hypotheses.\u003c/p>\u003cdiv class=\"meta\">\u003cspan>Period: W1–W4 · calendar dates not supplied\u003c/span>\u003cspan>Currency: USD · weekly revenue\u003c/span>\u003cspan>Prepared for Admin review\u003c/span>\u003c/div>\u003c/header>\n\u003csection aria-label=\"W4 sample key performance indicators\" class=\"kpis\">\n\u003cdiv class=\"card\">\u003cdiv class=\"label\">W4 REVENUE\u003c/div>\u003cdiv class=\"value\">$12,600\u003c/div>\u003cp class=\"detail signal\">−$1,800 / −12.50% vs W3\u003c/p>\u003cp class=\"detail\">W3 baseline: $14,400\u003c/p>\u003c/div>\n\u003cdiv class=\"card alert\">\u003cdiv class=\"label\">W4 TARGET SHORTFALL\u003c/div>\u003cdiv class=\"value\">$2,400\u003c/div>\u003cp class=\"detail signal\">16.00% below target\u003c/p>\u003cp class=\"detail\">$15,000 target · 84.00% attained\u003c/p>\u003c/div>\n\u003cdiv class=\"card\">\u003cdiv class=\"label\">W4 CONVERSION\u003c/div>\u003cdiv class=\"value\">11.25%\u003c/div>\u003cp class=\"detail signal\">−4.75 pp vs W3\u003c/p>\u003cp class=\"detail\">18 wins / 160 leads\u003c/p>\u003c/div>\n\u003cdiv class=\"card alert\">\u003cdiv class=\"label\">W4 SLA ATTAINMENT\u003c/div>\u003cdiv class=\"value\">69.44%\u003c/div>\u003cp class=\"detail signal\">20.56 pp below 90% target\u003c/p>\u003cp class=\"detail\">50 / 72 tickets · −10.56 pp vs W3\u003c/p>\u003c/div>\n\u003c/section>\n\u003csection class=\"panel\" aria-labelledby=\"trends\">\u003ch2 id=\"trends\">Four-week trends \u003cspan class=\"subtle\">/ SAMPLE DATA\u003c/span>\u003c/h2>\u003cp class=\"subtle\">All chart axes begin at zero. Exact inputs and rates appear in the evidence tables. pp = percentage points.\u003c/p>\u003cdiv class=\"charts\">\n\u003cfigure class=\"chart\">\u003ch3>Revenue vs target · USD\u003c/h3>\u003csvg viewBox=\"0 0 480 222\" role=\"img\" aria-labelledby=\"rev-title rev-desc\">\u003ctitle id=\"rev-title\">SAMPLE DATA — Weekly revenue and target in USD\u003c/title>\u003cdesc id=\"rev-desc\">Revenue: W1 12000.00, W2 13500.00, W3 14400.00, W4 12600.00; Target: W1 12500.00, W2 13500.00, W3 14500.00, W4 15000.00. Exact values and denominators are in the tables below.\u003c/desc>\u003cline x1=\"60\" x2=\"440\" y1=\"180.0\" y2=\"180.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"184.0\" text-anchor=\"end\">0k\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"145.0\" y2=\"145.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"149.0\" text-anchor=\"end\">4k\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"110.0\" y2=\"110.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"114.0\" text-anchor=\"end\">8k\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"75.0\" y2=\"75.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"79.0\" text-anchor=\"end\">12k\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"40.0\" y2=\"40.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"44.0\" text-anchor=\"end\">16k\u003c/text>\u003cpolyline points=\"60,75.0 180,61.875 300,54.0 420,69.75\" fill=\"none\" stroke=\"#116b63\" stroke-width=\"3\"/>\u003ccircle cx=\"60\" cy=\"75.0\" r=\"4\" fill=\"#116b63\"/>\u003ccircle cx=\"180\" cy=\"61.875\" r=\"4\" fill=\"#116b63\"/>\u003ccircle cx=\"300\" cy=\"54.0\" r=\"4\" fill=\"#116b63\"/>\u003ccircle cx=\"420\" cy=\"69.75\" r=\"4\" fill=\"#116b63\"/>\u003cpolyline points=\"60,70.625 180,61.875 300,53.125 420,48.75\" fill=\"none\" stroke=\"#875914\" stroke-width=\"3\" stroke-dasharray=\"6 5\"/>\u003ccircle cx=\"60\" cy=\"70.625\" r=\"4\" fill=\"#875914\"/>\u003ccircle cx=\"180\" cy=\"61.875\" r=\"4\" fill=\"#875914\"/>\u003ccircle cx=\"300\" cy=\"53.125\" r=\"4\" fill=\"#875914\"/>\u003ccircle cx=\"420\" cy=\"48.75\" r=\"4\" fill=\"#875914\"/>\u003ctext x=\"60\" y=\"207\" text-anchor=\"middle\">W1\u003c/text>\u003ctext x=\"180\" y=\"207\" text-anchor=\"middle\">W2\u003c/text>\u003ctext x=\"300\" y=\"207\" text-anchor=\"middle\">W3\u003c/text>\u003ctext x=\"420\" y=\"207\" text-anchor=\"middle\">W4\u003c/text>\u003c/svg>\u003cfigcaption class=\"legend\">\u003cspan class=\"key\">Revenue · solid\u003c/span>\u003cspan class=\"key target\">Target · dashed\u003c/span>\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"chart\">\u003ch3>Conversion · %\u003c/h3>\u003csvg viewBox=\"0 0 480 222\" role=\"img\" aria-labelledby=\"conv-title conv-desc\">\u003ctitle id=\"conv-title\">SAMPLE DATA — Weekly conversion\u003c/title>\u003cdesc id=\"conv-desc\">Conversion: W1 20.00%, W2 20.00%, W3 16.00%, W4 11.25%. Exact values and denominators are in the tables below.\u003c/desc>\u003cline x1=\"60\" x2=\"440\" y1=\"180.0\" y2=\"180.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"184.0\" text-anchor=\"end\">0%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"152.0\" y2=\"152.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"156.0\" text-anchor=\"end\">5%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"124.0\" y2=\"124.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"128.0\" text-anchor=\"end\">10%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"96.0\" y2=\"96.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"100.0\" text-anchor=\"end\">15%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"68.0\" y2=\"68.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"72.0\" text-anchor=\"end\">20%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"40.0\" y2=\"40.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"44.0\" text-anchor=\"end\">25%\u003c/text>\u003cpolyline points=\"60,68.0 180,68.0 300,90.39999999999999 420,117.0\" fill=\"none\" stroke=\"#116b63\" stroke-width=\"3\"/>\u003ccircle cx=\"60\" cy=\"68.0\" r=\"4\" fill=\"#116b63\"/>\u003ccircle cx=\"180\" cy=\"68.0\" r=\"4\" fill=\"#116b63\"/>\u003ccircle cx=\"300\" cy=\"90.39999999999999\" r=\"4\" fill=\"#116b63\"/>\u003ccircle cx=\"420\" cy=\"117.0\" r=\"4\" fill=\"#116b63\"/>\u003ctext x=\"60\" y=\"207\" text-anchor=\"middle\">W1\u003c/text>\u003ctext x=\"180\" y=\"207\" text-anchor=\"middle\">W2\u003c/text>\u003ctext x=\"300\" y=\"207\" text-anchor=\"middle\">W3\u003c/text>\u003ctext x=\"420\" y=\"207\" text-anchor=\"middle\">W4\u003c/text>\u003c/svg>\u003cfigcaption class=\"subtle\">20.00% → 20.00% → 16.00% → 11.25%\u003c/figcaption>\u003c/figure>\n\u003cfigure class=\"chart\">\u003ch3>SLA attainment · %\u003c/h3>\u003csvg viewBox=\"0 0 480 222\" role=\"img\" aria-labelledby=\"sla-title sla-desc\">\u003ctitle id=\"sla-title\">SAMPLE DATA — Weekly SLA attainment\u003c/title>\u003cdesc id=\"sla-desc\">SLA attainment: W1 90.00%, W2 88.00%, W3 80.00%, W4 69.44%. Exact values and denominators are in the tables below.\u003c/desc>\u003cline x1=\"60\" x2=\"440\" y1=\"180.0\" y2=\"180.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"184.0\" text-anchor=\"end\">0%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"145.0\" y2=\"145.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"149.0\" text-anchor=\"end\">25%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"110.0\" y2=\"110.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"114.0\" text-anchor=\"end\">50%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"75.0\" y2=\"75.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"79.0\" text-anchor=\"end\">75%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"40.0\" y2=\"40.0\" stroke=\"#d8e2e9\"/>\u003ctext x=\"48\" y=\"44.0\" text-anchor=\"end\">100%\u003c/text>\u003cline x1=\"60\" x2=\"440\" y1=\"54.0\" y2=\"54.0\" stroke=\"#875914\" stroke-dasharray=\"5 5\"/>\u003ctext x=\"438\" y=\"46.0\" text-anchor=\"end\">90% target\u003c/text>\u003cpolyline points=\"60,54.0 180,56.8 300,68.0 420,82.77777777777779\" fill=\"none\" stroke=\"#245ea7\" stroke-width=\"3\"/>\u003ccircle cx=\"60\" cy=\"54.0\" r=\"4\" fill=\"#245ea7\"/>\u003ccircle cx=\"180\" cy=\"56.8\" r=\"4\" fill=\"#245ea7\"/>\u003ccircle cx=\"300\" cy=\"68.0\" r=\"4\" fill=\"#245ea7\"/>\u003ccircle cx=\"420\" cy=\"82.77777777777779\" r=\"4\" fill=\"#245ea7\"/>\u003ctext x=\"60\" y=\"207\" text-anchor=\"middle\">W1\u003c/text>\u003ctext x=\"180\" y=\"207\" text-anchor=\"middle\">W2\u003c/text>\u003ctext x=\"300\" y=\"207\" text-anchor=\"middle\">W3\u003c/text>\u003ctext x=\"420\" y=\"207\" text-anchor=\"middle\">W4\u003c/text>\u003c/svg>\u003cfigcaption class=\"subtle\">90.00% → 88.00% → 80.00% → 69.44%\u003c/figcaption>\u003c/figure>\n\u003c/div>\u003c/section>\n\u003csection class=\"panel\" aria-labelledby=\"observations\">\u003ch2 id=\"observations\">What the evidence supports\u003c/h2>\u003cdiv class=\"grid2\">\u003cdiv class=\"insight\">\u003ch3>More leads, fewer wins\u003c/h3>\u003cp>W4 leads grew from 150 to 160 (+6.67%), while wins fell from 24 to 18 (−25.00%). Revenue fell 12.50% after rising from W1 through W3.\u003c/p>\u003cp>\u003cstrong>Hypotheses to test:\u003c/strong> a change in lead mix or sales-stage timing. These aggregates establish no causal link to revenue.\u003c/p>\u003c/div>\u003cdiv class=\"insight\">\u003ch3>Ticket growth outpaced SLA-met growth\u003c/h3>\u003cp>W4 tickets rose 20.00% (60 → 72); SLA-met tickets rose 48 → 50. Tickets outside SLA increased 12 → 22.\u003c/p>\u003cp>\u003cstrong>Hypotheses to test:\u003c/strong> ticket complexity or capacity constraints. Neither is demonstrated by the supplied data.\u003c/p>\u003c/div>\u003c/div>\u003c/section>\n\u003csection class=\"panel\" id=\"evidence\" aria-labelledby=\"evidence-title\">\u003ch2 id=\"evidence-title\">Evidence &amp; calculations\u003c/h2>\u003cp class=\"subtle\">Source: \u003ccode>@art-json5833:business-input\u003c/code> / \u003ccode>business-input.json\u003c/code>, read in full through host-control. Original label: “SAMPLE DATA — synthetic business metrics, USD”. No external sources.\u003c/p>\n\u003cdiv class=\"table-wrap\" tabindex=\"0\" role=\"region\" aria-label=\"Weekly source inputs, scroll horizontally on small screens\">\u003ctable>\u003ccaption>SAMPLE DATA — supplied weekly inputs\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">Week\u003c/th>\u003cth scope=\"col\">Revenue (USD)\u003c/th>\u003cth scope=\"col\">Target (USD)\u003c/th>\u003cth scope=\"col\">Leads\u003c/th>\u003cth scope=\"col\">Wins\u003c/th>\u003cth scope=\"col\">Tickets\u003c/th>\u003cth scope=\"col\">SLA met\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">W1\u003c/th>\u003ctd>$12,000\u003c/td>\u003ctd>$12,500\u003c/td>\u003ctd>100\u003c/td>\u003ctd>20\u003c/td>\u003ctd>40\u003c/td>\u003ctd>36\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">W2\u003c/th>\u003ctd>$13,500\u003c/td>\u003ctd>$13,500\u003c/td>\u003ctd>120\u003c/td>\u003ctd>24\u003c/td>\u003ctd>50\u003c/td>\u003ctd>44\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">W3\u003c/th>\u003ctd>$14,400\u003c/td>\u003ctd>$14,500\u003c/td>\u003ctd>150\u003c/td>\u003ctd>24\u003c/td>\u003ctd>60\u003c/td>\u003ctd>48\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">W4\u003c/th>\u003ctd>$12,600\u003c/td>\u003ctd>$15,000\u003c/td>\u003ctd>160\u003c/td>\u003ctd>18\u003c/td>\u003ctd>72\u003c/td>\u003ctd>50\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\n\u003cdiv class=\"table-wrap\" style=\"margin-top:24px\" tabindex=\"0\" role=\"region\" aria-label=\"Calculated weekly rates, scroll horizontally on small screens\">\u003ctable>\u003ccaption>SAMPLE DATA — derived rates and signed gaps\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">Week\u003c/th>\u003cth scope=\"col\">Revenue gap\u003c/th>\u003cth scope=\"col\">Gap / target\u003c/th>\u003cth scope=\"col\">Conversion\u003c/th>\u003cth scope=\"col\">SLA attainment\u003c/th>\u003cth scope=\"col\">SLA gap vs 90%\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">W1\u003c/th>\u003ctd>−$500\u003c/td>\u003ctd>-4.00%\u003c/td>\u003ctd>20.00%\u003c/td>\u003ctd>90.00%\u003c/td>\u003ctd>0.00 pp\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">W2\u003c/th>\u003ctd>$0\u003c/td>\u003ctd>0.00%\u003c/td>\u003ctd>20.00%\u003c/td>\u003ctd>88.00%\u003c/td>\u003ctd>-2.00 pp\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">W3\u003c/th>\u003ctd>−$100\u003c/td>\u003ctd>-0.69%\u003c/td>\u003ctd>16.00%\u003c/td>\u003ctd>80.00%\u003c/td>\u003ctd>-10.00 pp\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">W4\u003c/th>\u003ctd>−$2,400\u003c/td>\u003ctd>-16.00%\u003c/td>\u003ctd>11.25%\u003c/td>\u003ctd>69.44%\u003c/td>\u003ctd>-20.56 pp\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003c/section>\n\u003csection class=\"panel\" aria-labelledby=\"actions\">\u003ch2 id=\"actions\">Proposed actions\u003c/h2>\u003cp class=\"subtle\">Not executed. Owners below are proposals; no new tasks, outreach or operational changes were made.\u003c/p>\u003cdiv class=\"actions\">\n\u003carticle class=\"action\">\u003cdiv class=\"owner\">Ledger\u003c/div>\u003ch3>Validate and refresh\u003c/h3>\u003cp>When Admin supplies actual metrics, validate dates, currency, targets, revenue basis, lead/win counts and SLA eligibility. Preserve provenance and reconcile the totals.\u003c/p>\u003cp>\u003cstrong>Review gate:\u003c/strong> validated actual input before replacing sample figures; retain SAMPLE DATA labeling until then.\u003c/p>\u003cdiv class=\"status\">PROPOSED · awaiting actual data\u003c/div>\u003c/article>\n\u003carticle class=\"action\">\u003cdiv class=\"owner\">Scout\u003c/div>\u003ch3>Test the hypotheses\u003c/h3>\u003cp>Review authorized lead segments and sales stages, plus ticket priority, age and capacity records. Seek evidence for and against lead-mix, timing, complexity and capacity explanations.\u003c/p>\u003cp>\u003cstrong>Review gate:\u003c/strong> documented evidence, with uncertainty and contrary findings.\u003c/p>\u003cdiv class=\"status\">PROPOSED · not started\u003c/div>\u003c/article>\n\u003carticle class=\"action\">\u003cdiv class=\"owner\">Atlas\u003c/div>\u003ch3>Review priorities with Admin\u003c/h3>\u003cp>Use validated findings to propose priorities, accountable next steps and success thresholds. Confirm conversion goals; the supplied SLA benchmark is 90%.\u003c/p>\u003cp>\u003cstrong>Review gate:\u003c/strong> verified impact and operational constraints before decisions.\u003c/p>\u003cdiv class=\"status\">PROPOSED · pending evidence\u003c/div>\u003c/article>\n\u003c/div>\u003c/section>\n\u003csection class=\"panel method\" aria-labelledby=\"method\">\u003ch2 id=\"method\">Method, validation &amp; limitations\u003c/h2>\u003cdiv class=\"grid2\">\u003cdiv>\u003ch3>Reproducible definitions\u003c/h3>\u003cul>\u003cli>Revenue change: (12,600 − 14,400) / 14,400 = \u003cstrong>−12.50%\u003c/strong>.\u003c/li>\u003cli>Signed target gap = revenue − target. W4: −$2,400; gap / target = \u003cstrong>−16.00%\u003c/strong>. Target attainment = 12,600 / 15,000 = 84.00%.\u003c/li>\u003cli>Conversion = weekly wins / weekly leads, using the supplied simplified definition; \u003cstrong>not cohort conversion\u003c/strong>.\u003c/li>\u003cli>SLA attainment = SLA-met tickets / tickets; SLA gap = attainment − 90%, in pp.\u003c/li>\u003cli>Compute with unrounded values; display rates and pp changes to two decimal places.\u003c/li>\u003c/ul>\u003c/div>\u003cdiv>\u003ch3>Boundaries of this review\u003c/h3>\u003cul>\u003cli>Validated unique sequential W1–W4 labels, nonnegative integers, positive targets and denominators, wins ≤ leads and SLA-met ≤ tickets.\u003c/li>\u003cli>Only four synthetic weeks; no calendar dates, segments, deal sizes, cohort linkage, severity, staffing or revenue-recognition policy.\u003c/li>\u003cli>Revenue is weekly, \u003cstrong>not MRR\u003c/strong>. No conversion target or causal evidence was supplied. No forecast is implied.\u003c/li>\u003cli>All actions remain proposals. The review task remains open for Admin review.\u003c/li>\u003c/ul>\u003c/div>\u003c/div>\u003c/section>\n\u003cfooter>\u003cstrong>SAMPLE DATA\u003c/strong> · Synthetic inputs for a real review task · Ledger · Self-contained dashboard with no external assets · Companion document: weekly-review.md\u003c/footer>\n\u003c/main>\u003c/body>\u003c/html>"},{"id":"art-md0754","owner":"sapi_974e5d5b5450","filename":"launch-plan.md","title":"SAMPLE DATA — RelayDesk launch plan","reference":"@art-md0754:sample-data-relaydesk-launch-plan","content":"# SAMPLE DATA — RelayDesk four-week launch plan\n\n**DRAFT FOR ADMIN REVIEW · Proposed execution only · Launch date unset**\n\n## Objective and evidence\nRecruit **10 distinct eligible pilot teams by the end of relative Week 4**, within a **$2,000 cash ceiling**. This is a real planning deliverable based entirely on synthetic sample inputs, not an executed launch or real market validation.\n\nSources: launch-input.md (@art-md1646:launch-input) and competitor-research.md (@art-md4685:competitor-research). C1–C5 below are fictional supplied cards. The research report embeds an older launch-input reference; this plan uses the current supplied artifact reference. All RelayDesk price, capability and setup claims remain hypotheses.\n\n## Status and assumptions\nCompleted in this assignment: input review and preparation of this plan and its companion dashboard. No pilot recruitment, contact, spending, browsing, implementation or assignment creation occurred. No outcome measurements are available; targets below are not actuals. All named owners are suggestions, not completed or accepted assignments. Task @task-h1574 remains open for Admin review.\n\nWeek 1 begins only after Admin approves the offer, owners, capacity and execution scope. Existing internal planning time is assumed in-kind; incremental cash costs are budgeted below. Confirm this accounting boundary before launch. Proposed pilot offer: a free, time-limited evaluation through Week 4 with no automatic charge; $59/team/month is a future price hypothesis. Honoraria reward research participation regardless of feedback or purchase.\n\n## Eligibility, funnel and success criteria\nProposed eligibility: a small service team of 2–10 people, at least two participants, a shared request inbox, a named pilot lead with authority to participate, and a concrete ownership or follow-up problem. These are planning assumptions requiring approval.\n\nRecruitment counts only a unique team with explicit acceptance of pilot terms, an identified lead and a scheduled onboarding session. Deduplicate by organization/team; multiple contacts do not count twice. Proposed funnel: **120 distinct invited teams → 24 qualified discovery calls (20%) → 10 acceptances (41.7% of calls; 8.3% overall)**. These are unvalidated assumptions, not a forecast or guarantee. Channel mix: 60 permissioned warm introductions, 40 relevant community opt-ins under community rules, 20 partner referrals. No real prospect list exists yet; if channel access is unavailable, report a shortfall.\n\nSeparate outcome gates:\n- Recruitment: 10 eligible accepted teams by W4.\n- Activation: at least 8 of 10 complete inbox connection, teammate invitation, request assignment and a test SLA alert by W4.\n- Retention: at least 6 of 10 show team activity on two separate days in the seven days after activation; activate this cohort by W3 end to permit full observation.\n- Ownership clarity: at least 8 of 10 leads correctly identify a request owner in an unassisted exercise; record failed and untested cases.\n- Demand signal: at least 5 of 10 request continued use and state willingness to pay $59/month after use. Report stated preference separately from any future paid commitment; this is preliminary evidence, not validated revenue.\n- Setup hypothesis: record every attempt from setup start to the complete activation workflow, elapsed minutes, assistance, environment and failures. Report median, range and completion rate; test a ≤60-minute median among completers without excluding failed attempts from the completion denominator.\n\n## Weekly milestones — all proposed\n| Week | Focus | Proposed owners | Work | Weekly exit target | Cumulative accepted | Cash envelope |\n| --- | --- | --- | --- | --- | --- | --- |\n| 01 | Prepare & qualify | Atlas + Maker | Define eligibility, approve pilot terms and data handling, test the activation workflow, draft two messages, and prepare 120 prospect records from authorized sources. | 30 draft invitations; 6 discovery calls; 2 accepted teams | 2 / 10 | $350 |\n| 02 | Recruit & activate | Maker + Echo | After separate authorization, propose 40 invitations and one follow-up per non-responder after 4–5 business days. Run 8 discovery calls and guided onboarding. | 3 additional accepted; 4 cumulative activated | 5 / 10 | $500 |\n| 03 | Close the gap | Atlas + Maker | Propose 35 invitations and 8 discovery calls. Ask willing pilots for introductions only with consent. Compare message responses and fix recurring setup friction. | 3 additional accepted; 7 cumulative activated | 8 / 10 | $550 |\n| 04 | Confirm & evaluate | Echo + Analyst + Ledger | Propose final 15 invitations and 2 discovery calls early in week. Confirm remaining teams; measure retained use, ownership clarity, price response and costs. | 2 additional accepted; 8 cumulative activated; decision memo | 10 / 10 | $400 |\nThe weekly envelopes sum to $1,800; the $200 reserve is held separately. They allocate the category budget below, not additional spending. W1 invitations and all subsequent external work are proposals contingent on later authorization. W1 proposed six calls yield two acceptances; W2 eight yield three; W3 eight yield three; W4 two yield two. The optimistic W4 close rate is a risk: prioritize acceptance before W4 and disclose any gap.\n\n## Positioning and fictional competitor table — SAMPLE DATA\nLead draft: “A shared inbox designed to get small service teams assigning requests quickly.”\nSupporting draft: “Planned at $59/team/month, with assignment and SLA alerts.”\nDo not claim proven one-hour setup, feature parity, savings or superiority.\nAll six rows describe shared inbox products; prices are USD/team/month.\n| Evidence | Product | Price | Listed workflow features | Listed setup / target |\n| --- | --- | --- | --- | --- |\n| C1 | InboxOak | $49 | Basic assignment; explicitly no SLA alerts | 1 day |\n| C2 | TeamWillow | $99 | Assignment + SLA alerts | 3 days |\n| C3 | QueueFox | $29 | Manual tags only | 2 hours |\n| C4 | ReplyHarbor | $149 | Routing + analytics | 5 days |\n| C5 | ServiceLark | $79 | Assignment + analytics | 2 days |\n| Hypothesis | RelayDesk | $59 planned | Assignment + SLA alerts planned | 1-hour target |\nC3 is the cheapest fictional card. C2 overlaps in named feature categories, not proven capability. Only C1 explicitly lacks SLA alerts; omissions elsewhere mean unknown. Routing/analytics for RelayDesk are unspecified. Setup measurement conditions for competitors are unknown.\n\n## Cash budget — proposed, no money spent\n| Category | Basis | Maximum |\n| --- | --- | --- |\n| Pilot research honoraria | 10 teams × $60; compensate feedback, never positive reviews | $600 |\n| Onboarding assistance | 12 hours × $50; incremental support allowance | $600 |\n| Research / list preparation | 6 hours × $50; authorized sources only | $300 |\n| Demo and onboarding materials | Fixed allowance | $150 |\n| Pilot tools / infrastructure | Fixed allowance; existing stack first | $150 |\n| Contingency | Admin release only; included in hard ceiling | $200 |\n**Base plan $1,800 + reserve $200 = hard cap $2,000.** At ten recruited teams, the ceiling is $200 per recruited team; this is a planning ratio, not observed acquisition cost. If fewer teams join, show actual cost per accepted and per activated team. Ledger would maintain committed, paid and remaining amounts before any proposed purchase.\n\n## Proposed ownership and review cadence\nAtlas: launch accountability, approvals and recruitment gates. Maker: launch materials, onboarding and milestone coordination. Scout: evidence and positioning caveats. Echo: pilot interviews and feedback capture. Analyst: funnel, activation and value analysis. Ledger: cost ledger and budget checks. Admin: review this plan and authorize any later execution. These roles create no host tasks or reporting changes.\nPropose a weekly internal review of funnel and budget, with a W2 recovery decision and a W4 proceed / iterate / stop memo. No schedule or recurring job is created.\n\n## Outreach drafts — not sent\n**Draft A / ownership:** “Hi [name], we're exploring RelayDesk, a shared inbox designed to help small service teams assign requests clearly. Would your team consider a short pilot and feedback session? We’re testing the workflow and setup experience; participation is optional. May I share the proposed pilot details?”\n**Draft B / offer:** “Hi [name], we're testing a shared inbox with planned assignment and SLA alerts, with a future price hypothesis of $59/team/month. Would a time-limited evaluation be relevant to your team? We’d value candid feedback; there is no automatic charge.”\n**One follow-up draft:** “Following up once on the RelayDesk pilot invitation. If this is not relevant, no response is needed and we will stop following up.”\nUse only after execution authorization, confirmed offer and applicable recipient permission. No mass sends, purchased lists or paid advertising.\n\n## Measurement and decision\nProposed ledger fields: anonymous team ID, eligibility evidence, channel, message variant, invitation date, call date, acceptance/terms date, onboarding date, activation steps, elapsed time, assistance/failure reason, activity dates, ownership result, continued-use request, stated price response, costs and evidence link. Store minimum necessary information with agreed access and retention. Track counts and denominators weekly; report missing data explicitly. Small samples support directional learning only.\n\nProceed recommendation requires recruitment and budget gates plus the activation, retention and demand thresholds above. If recruitment succeeds but value gates fail, report “recruitment achieved; demand inconclusive” and propose iteration. If recruitment or budget fails, report the objective unmet. Admin makes the subsequent decision; this document triggers no action.\n\n## Risks and responses\n| Risk | Trigger | Proposed response / owner |\n| --- | --- | --- |\n| Recruitment shortfall | Below 5 accepted by end of W2 | Atlas: review eligibility objections and shift remaining drafts to the better-performing message/channel. Do not relax eligibility or claim targets met. |\n| Setup or feature gaps | Workflow cannot be completed or setup median exceeds 60 min | Maker: log failures and assistance; revise claims and onboarding. Pause invites if safe operation is unverified. |\n| Signup without value | Below 8 activations or 6 retained teams | Analyst + Echo: interview drop-offs; report recruitment separately from demand. Extend learning only with Admin review. |\n| Budget overrun | Committed plus paid costs approach $1,800 | Ledger: stop new commitments; reserve requires Admin release. No paid ads. |\n| Consent / privacy | Unclear permission, retention or access rules | Atlas: resolve pilot terms before outreach or real inbox connection; use test data in preparation. |\n| Synthetic evidence | Any fictional competitor card presented as market proof | Scout: retain SAMPLE DATA labels and distinguish missing capabilities from explicit exclusions. |\n\n## Admin review\nReview eligibility, pilot terms, owner availability, cash/in-kind accounting and success thresholds before execution. This task remains open; no external actions or additional host tasks are authorized by these drafts.\n","previewHtml":"\u003c!doctype html>\u003cmeta charset=\"utf-8\">\u003cmeta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base team. Ledger would maintain committed, paid and remaining amounts before any proposed purchase.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>Proposed ownership and review cadence\u003c/h2>\n\u003cdiv class=\"line\">Atlas: launch accountability, approvals and recruitment gates. Maker: launch materials, onboarding and milestone coordination. Scout: evidence and positioning caveats. Echo: pilot interviews and feedback capture. Analyst: funnel, activation and value analysis. Ledger: cost ledger and budget checks. Admin: review this plan and authorize any later execution. These roles create no host tasks or reporting changes.\u003c/div>\n\u003cdiv class=\"line\">Propose a weekly internal review of funnel and budget, with a W2 recovery decision and a W4 proceed / iterate / stop memo. No schedule or recurring job is created.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>Outreach drafts — not sent\u003c/h2>\n\u003cdiv class=\"line\">\u003cstrong>Draft A / ownership:\u003c/strong> “Hi [name], we&#x27;re exploring RelayDesk, a shared inbox designed to help small service teams assign requests clearly. Would your team consider a short pilot and feedback session? We’re testing the workflow and setup experience; participation is optional. May I share the proposed pilot details?”\u003c/div>\n\u003cdiv class=\"line\">\u003cstrong>Draft B / offer:\u003c/strong> “Hi [name], we&#x27;re testing a shared inbox with planned assignment and SLA alerts, with a future price hypothesis of $59/team/month. Would a time-limited evaluation be relevant to your team? We’d value candid feedback; there is no automatic charge.”\u003c/div>\n\u003cdiv class=\"line\">\u003cstrong>One follow-up draft:\u003c/strong> “Following up once on the RelayDesk pilot invitation. If this is not relevant, no response is needed and we will stop following up.”\u003c/div>\n\u003cdiv class=\"line\">Use only after execution authorization, confirmed offer and applicable recipient permission. No mass sends, purchased lists or paid advertising.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>Measurement and decision\u003c/h2>\n\u003cdiv class=\"line\">Proposed ledger fields: anonymous team ID, eligibility evidence, channel, message variant, invitation date, call date, acceptance/terms date, onboarding date, activation steps, elapsed time, assistance/failure reason, activity dates, ownership result, continued-use request, stated price response, costs and evidence link. Store minimum necessary information with agreed access and retention. Track counts and denominators weekly; report missing data explicitly. Small samples support directional learning only.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003cdiv class=\"line\">Proceed recommendation requires recruitment and budget gates plus the activation, retention and demand thresholds above. If recruitment succeeds but value gates fail, report “recruitment achieved; demand inconclusive” and propose iteration. If recruitment or budget fails, report the objective unmet. Admin makes the subsequent decision; this document triggers no action.\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>Risks and responses\u003c/h2>\n\u003cdiv class=\"line\">| Risk | Trigger | Proposed response / owner |\u003c/div>\n\u003cdiv class=\"line\">| --- | --- | --- |\u003c/div>\n\u003cdiv class=\"line\">| Recruitment shortfall | Below 5 accepted by end of W2 | Atlas: review eligibility objections and shift remaining drafts to the better-performing message/channel. Do not relax eligibility or claim targets met. |\u003c/div>\n\u003cdiv class=\"line\">| Setup or feature gaps | Workflow cannot be completed or setup median exceeds 60 min | Maker: log failures and assistance; revise claims and onboarding. Pause invites if safe operation is unverified. |\u003c/div>\n\u003cdiv class=\"line\">| Signup without value | Below 8 activations or 6 retained teams | Analyst + Echo: interview drop-offs; report recruitment separately from demand. Extend learning only with Admin review. |\u003c/div>\n\u003cdiv class=\"line\">| Budget overrun | Committed plus paid costs approach $1,800 | Ledger: stop new commitments; reserve requires Admin release. No paid ads. |\u003c/div>\n\u003cdiv class=\"line\">| Consent / privacy | Unclear permission, retention or access rules | Atlas: resolve pilot terms before outreach or real inbox connection; use test data in preparation. |\u003c/div>\n\u003cdiv class=\"line\">| Synthetic evidence | Any fictional competitor card presented as market proof | Scout: retain SAMPLE DATA labels and distinguish missing capabilities from explicit exclusions. |\u003c/div>\n\u003cdiv class=\"line\">\u003cbr>\u003c/div>\n\u003ch2>Admin review\u003c/h2>\n\u003cdiv class=\"line\">Review eligibility, pilot terms, owner availability, cash/in-kind accounting and success thresholds before execution. This task remains open; no external actions or additional host tasks are authorized by these drafts.\u003c/div>"},{"id":"art-html3383","owner":"sapi_974e5d5b5450","filename":"launch-dashboard.html","title":"SAMPLE DATA — RelayDesk launch dashboard","reference":"@art-html3383:sample-data-relaydesk-launch-dashboard","content":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>SAMPLE DATA — RelayDesk launch dashboard\u003c/title>\n\u003cstyle>\n:root{--bg:#f3f5f0;--ink:#182e2c;--muted:#506661;--line:#d7dfd9;--accent:#146956;--lime:#d8ee98}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif}main{max-width:1220px;margin:auto;padding:36px 28px 64px}header{background:var(--ink);color:#fff;padding:42px;border-radius:24px;position:relative}h1{font-size:clamp(34px,5vw,60px);line-height:1.05;letter-spacing:-2px;margin:20px 0}h2{font-size:25px;letter-spacing:-.6px;margin:0 0 16px}h3{font-size:18px;line-height:1.3;margin:10px 0}p{margin:8px 0 14px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:2px;text-transform:uppercase}.badge{display:inline-block;border-radius:99px;padding:6px 12px;font-weight:750;font-size:12px;background:var(--lime);color:var(--ink)}header p{max-width:790px;color:#d5e3de}.headerline{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.meta{font-size:13px;color:#d5e3de}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}.stat,.card,section{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px}.stat strong{display:block;font-size:34px;letter-spacing:-1px}.stat span,.muted{color:var(--muted);font-size:13px}section{margin:22px 0}.notice{border-left:4px solid var(--accent);padding:14px 18px;background:#e6eee5;border-radius:4px;font-size:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.week{background:#f5f7f2;border-radius:14px;padding:20px;border:1px solid var(--line)}.number{font-size:36px;color:var(--accent);font-weight:800}.week p{font-size:13px}.target{border-top:1px solid var(--line);padding-top:12px;font-weight:750}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;text-align:left}th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);background:#f5f7f2}th,td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top}tbody tr:last-child td{border-bottom:0}.funnel{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.step{flex:1;min-width:170px;background:#eaf1e7;border-radius:12px;padding:20px}.step b{display:block;font-size:30px}.bar{display:flex;height:18px;border-radius:99px;overflow:hidden;margin:20px 0}.bar div:first-child{width:90%;background:var(--accent)}.bar div:last-child{width:10%;background:#afc86d}.quote{background:#f5f7f2;paddin
